<!DOCTYPE html>
<html>

<head>

<title>YouTube Money Calculator</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<h1>YouTube Money Calculator</h1>

<p>Enter views and CPM to estimate earnings.</p>

<input id="views" placeholder="Total Views">

<input id="cpm" placeholder="CPM">

<button onclick="calc()">Calculate</button>

<h2 id="result"></h2>

<script>

function calc(){

var views=document.getElementById("views").value;

var cpm=document.getElementById("cpm").value;

var income=(views/1000)*cpm;

document.getElementById("result").innerHTML="Estimated Income: $"+income;

}

</script>

</body>

</html>
