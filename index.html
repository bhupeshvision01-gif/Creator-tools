<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProfitLab | Precision 26-Tool Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --brand: #6366f1; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; }
        aside { width: 260px; background: var(--surface); border-right: 1px solid var(--border); padding: 2rem; height: 100vh; position: fixed; }
        nav button { width: 100%; padding: 0.8rem; margin-bottom: 0.5rem; border: none; border-radius: 10px; background: transparent; color: var(--text-muted); font-weight: 700; text-align: left; cursor: pointer; }
        nav button.active { background: var(--brand); color: white; }
        main { flex: 1; margin-left: 260px; padding: 2rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.2rem; }
        .card { background: var(--surface); padding: 1.5rem; border-radius: 16px; border: 1px solid var(--border); }
        .card h3 { font-size: 0.9rem; margin-bottom: 1rem; color: var(--brand); text-transform: uppercase; }
        .field { margin-bottom: 0.8rem; }
        label { font-size: 0.6rem; font-weight: 800; color: var(--text-muted); display: block; margin-bottom: 3px; }
        input, select { width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-weight: 600; }
        .btn-calc { width: 100%; padding: 0.8rem; background: var(--brand); color: white; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .out-box { margin-top: 1rem; padding: 0.8rem; background: #f0f2ff; border-radius: 8px; text-align: center; font-weight: 800; color: var(--brand); border: 1px dashed var(--brand); }
    </style>
</head>
<body>

<aside>
    <h2 style="color:var(--brand); margin-bottom:2rem;">🚀 ProfitLab</h2>
    <nav>
        <button class="active" onclick="tab(event, 'creator')">Creator Tool</button>
        <button onclick="tab(event, 'finance')">Finance Suite</button>
        <button onclick="tab(event, 'health')">Health / Fitness</button>
    </nav>
</aside>

<main>
    <section id="creator" class="tab-content">
        <div class="grid">
            <div class="card"><h3>YT Income</h3><div class="field"><label>Views</label><input type="number" id="c1-v" value="100000"></div><div class="field"><label>CPM ($)</label><input type="number" id="c1-c" value="5"></div><button class="btn-calc" onclick="run('c1')">Calculate</button><div class="out-box" id="r-c1">$500</div></div>
            <div class="card"><h3>Influencer Rate</h3><div class="field"><label>Followers</label><input type="number" id="c10-f" value="100000"></div><button class="btn-calc" onclick="run('c10')">Market Val</button><div class="out-box" id="r-c10">$1,000</div></div>
            </div>
    </section>

    <section id="finance" class="tab-content" style="display:none">
        <div class="grid">
            <div class="card"><h3>Fixed Deposit</h3><div class="field"><label>Principal ($)</label><input type="number" id="f5-p" value="5000"></div><div class="field"><label>Rate %</label><input type="number" id="f5-r" value="7"></div><div class="field"><label>Years</label><input type="number" id="f5-y" value="5"></div><button class="btn-calc" onclick="run('f5')">Maturity</button><div class="out-box" id="r-f5">$7,013</div></div>
            <div class="card"><h3>RD Projector</h3><div class="field"><label>Monthly ($)</label><input type="number" id="f6-m" value="1000"></div><div class="field"><label>Rate %</label><input type="number" id="f6-r" value="7"></div><div class="field"><label>Months</label><input type="number" id="f6-n" value="12"></div><button class="btn-calc" onclick="run('f6')">Project</button><div class="out-box" id="r-f6">$12,460</div></div>
            <div class="card"><h3>Comp. Interest</h3><div class="field"><label>Principal</label><input type="number" id="f8-p" value="5000"></div><div class="field"><label>Rate %</label><input type="number" id="f8-r" value="10"></div><div class="field"><label>Years</label><input type="number" id="f8-y" value="5"></div><button class="btn-calc" onclick="run('f8')">Total Value</button><div class="out-box" id="r-f8">$8,052</div></div>
            <div class="card"><h3>Income Tax</h3><div class="field"><label>Annual Income</label><input type="number" id="f7-i" value="80000"></div><button class="btn-calc" onclick="run('f7')">Tax Due</button><div class="out-box" id="r-f7">$13,000</div></div>
        </div>
    </section>

    <section id="health" class="tab-content" style="display:none">
        <div class="grid">
            <div class="card"><h3>BMR (Mifflin)</h3><div class="field"><label>Gender</label><select id="h2-g"><option value="m">Male</option><option value="f">Female</option></select></div><div class="field"><label>W(kg)/H(cm)/Age</label><div style="display:flex;gap:5px;"><input type="number" id="h2-w" value="70"><input type="number" id="h2-h" value="175"><input type="number" id="h2-a" value="25"></div></div><button class="btn-calc" onclick="run('h2')">Calculate</button><div class="out-box" id="r-h2">1,682 kcal</div></div>
            <div class="card"><h3>Daily Calorie</h3><div class="field"><label>Activity</label><select id="h3-a"><option value="1.2">Sedentary</option><option value="1.375">Lightly Active</option><option value="1.55" selected>Moderate</option><option value="1.725">Very Active</option></select></div><button class="btn-calc" onclick="run('h3')">TDEE</button><div class="out-box" id="r-h3">2,607 kcal</div></div>
        </div>
    </section>
</main>

<script>
    function tab(e, id) {
        document.querySelectorAll('.tab-content').forEach(x => x.style.display = 'none');
        document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
        document.getElementById(id).style.display = 'block';
        e.currentTarget.classList.add('active');
    }

    function run(t) {
        // Influencer Rate: $10 per 1k followers for micro, $8 for macro
        if(t==='c10') {
            let f = document.getElementById('c10-f').value;
            let rate = f < 100000 ? 0.012 : 0.01;
            document.getElementById('r-c10').innerText = '$' + Math.round(f * rate).toLocaleString();
        }

        // Fixed Deposit: A = P(1 + r/n)^nt (n=4 for quarterly)
        if(t==='f5') {
            let p = parseFloat(document.getElementById('f5-p').value), r = document.getElementById('f5-r').value/100, y = document.getElementById('f5-y').value;
            let a = p * Math.pow((1 + r/4), 4 * y);
            document.getElementById('r-f5').innerText = '$' + Math.round(a).toLocaleString();
        }

        // RD Projector: M = R[(1+i)^n - 1] / (1-(1+i)^-1/3)
        if(t==='f6') {
            let p = parseFloat(document.getElementById('f6-m').value), r = document.getElementById('f6-r').value/100, n = document.getElementById('f6-n').value;
            let i = r/4;
            let m = p * (Math.pow(1+i, n/3)-1) / (1-Math.pow(1+i, -1/3));
            document.getElementById('r-f6').innerText = '$' + Math.round(m).toLocaleString();
        }

        // Comp Interest: A = P(1+r)^t
        if(t==='f8') {
            let p = parseFloat(document.getElementById('f8-p').value), r = document.getElementById('f8-r').value/100, y = document.getElementById('f8-y').value;
            let a = p * Math.pow(1 + r, y);
            document.getElementById('r-f8').innerText = '$' + Math.round(a).toLocaleString();
        }

        // Income Tax (Simplified Progressive)
        if(t==='f7') {
            let i = document.getElementById('f7-i').value, tax = 0;
            if(i > 95000) tax += (i-95000)*0.24 + 16000;
            else if(i > 45000) tax += (i-45000)*0.22 + 5000;
            else if(i > 11000) tax += (i-11000)*0.10;
            document.getElementById('r-f7').innerText = '$' + Math.round(tax).toLocaleString();
        }

        // Health: BMR & TDEE
        if(t==='h2') {
            let w=document.getElementById('h2-w').value, h=document.getElementById('h2-h').value, a=document.getElementById('h2-a').value, s=document.getElementById('h2-g').value==='m'?5:-161;
            let bmr = (10*w) + (6.25*h) - (5*a) + s;
            document.getElementById('r-h2').innerText = Math.round(bmr) + ' kcal';
        }
        if(t==='h3') {
            let bmr = parseInt(document.getElementById('r-h2').innerText) || 1600;
            let tdee = bmr * document.getElementById('h3-a').value;
            document.getElementById('r-h3').innerText = Math.round(tdee).toLocaleString() + ' kcal';
        }
    }
</script>
</body>
</html>
