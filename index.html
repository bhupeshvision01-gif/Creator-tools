<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreatorProfitLab | Advanced Creator & Finance Tools</title>
    <meta name="description" content="Professional calculators for YouTube, Instagram, TikTok, and Affiliate Marketing revenue.">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand: #4f46e5; --brand-light: #f5f7ff; --bg: #f8fafc; 
            --surface: #ffffff; --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        
        /* Header & Search */
        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
        .nav-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.4rem; color: var(--brand); text-decoration: none; }
        #toolSearch { width: 280px; padding: 10px 18px; border-radius: 50px; border: 1px solid var(--border); outline: none; font-size: 0.9rem; }

        /* Home View */
        .hero { text-align: center; padding: 50px 0; background: linear-gradient(180deg, #eff6ff 0%, #f8fafc 100%); }
        .hero h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 10px; color: var(--text); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-bottom: 60px; }
        .card { background: var(--surface); padding: 25px; border-radius: 16px; border: 1px solid var(--border); text-decoration: none; color: inherit; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--brand); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .card .tag { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; color: var(--brand); background: var(--brand-light); padding: 4px 10px; border-radius: 4px; margin-bottom: 12px; display: inline-block; }

        /* Calculator View */
        .calc-layout { display: grid; grid-template-columns: 1.8fr 1fr; gap: 30px; margin-top: 30px; }
        .main-card { background: var(--surface); padding: 35px; border-radius: 20px; border: 1px solid var(--border); }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.75rem; font-weight: 800; margin-bottom: 5px; color: var(--text-muted); text-transform: uppercase; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 1.1rem; font-weight: 700; background: #fcfdfe; }
        input:focus { border-color: var(--brand); outline: none; }
        
        .result-display { background: var(--brand); color: white; padding: 30px; border-radius: 16px; text-align: center; margin: 25px 0; }
        .result-display p { font-size: 0.85rem; font-weight: 600; opacity: 0.9; text-transform: uppercase; }
        .result-display h2 { font-size: 2.8rem; font-weight: 800; margin: 0; }

        .article { margin-top: 40px; padding-top: 30px; border-top: 1px solid var(--border); }
        .ad-box { background: #f1f5f9; border: 1px dashed #cbd5e1; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 0.7rem; border-radius: 12px; margin: 20px 0; min-height: 90px; }
        
        @media (max-width: 900px) { .calc-layout { grid-template-columns: 1fr; } .nav-content { flex-direction: column; gap: 10px; } }
    </style>
</head>
<body>

<header>
    <div class="container nav-content">
        <a href="index.html" class="logo">🚀 CreatorProfitLab</a>
        <input type="text" id="toolSearch" placeholder="Search creators tools..." onkeyup="doSearch()">
    </div>
</header>

<div id="content-area"></div>

<footer>
    <div class="container" style="text-align: center; padding: 40px 0; color: var(--text-muted);">
        <p>&copy; 2026 CreatorProfitLab. The Professional Creator Hub.</p>
    </div>
</footer>

<script>
    const TOOLS = [
        { id: "yt-income", cat: "Creator", name: "YouTube Income Calculator", desc: "Estimate revenue from views, CPM, and ad frequency.", unit: "$", formula: "(v/1000)*c*a", inputs: [{id:"v", l:"Monthly Views", v:100000}, {id:"c", l:"Estimated CPM", v:4}, {id:"a", l:"Ads per Video", v:1.5}], art: "<h2>YouTube Revenue Breakdown</h2><p>Your income is calculated by multiplying total views by your CPM (Cost Per Mille) and the average number of ads per video. Remember, YouTube takes a 45% cut of ad revenue before it reaches you.</p>" },
        
        { id: "ig-engagement", cat: "Social", name: "Instagram Engagement Rate", desc: "Calculate engagement percentage based on reach and interactions.", unit: "%", formula: "((l+c)/r)*100", inputs: [{id:"l", l:"Likes", v:1200}, {id:"c", l:"Comments", v:85}, {id:"r", l:"Total Reach", v:25000}], art: "<h2>Why Engagement Matters</h2><p>Brands value engagement over follower count. A rate between 3% and 6% is considered high for influencers.</p>" },
        
        { id: "tk-earnings", cat: "Creator", name: "TikTok Earnings Estimate", desc: "Views × Creator Fund + Brand CPM potential.", unit: "$", formula: "(v/1000000)*30 + (v/1000)*0.50", inputs: [{id:"v", l:"Video Views", v:500000}], art: "<h2>TikTok Creator Fund</h2><p>TikTok usually pays $0.02 - $0.04 per 1,000 views. This tool combines Creator Fund estimates with typical baseline brand value.</p>" },
        
        { id: "cpm-master", cat: "Ads", name: "Professional CPM Calculator", desc: "Calculate the exact cost per 1,000 impressions.", unit: "$", formula: "(cost/imp)*1000", inputs: [{id:"cost", l:"Total Ad Spend", v:1000}, {id:"imp", l:"Total Impressions", v:200000}], art: "<h2>Mastering Ad Spend</h2><p>CPM is the gold standard for measuring the cost-efficiency of an advertising campaign.</p>" },
        
        { id: "affiliate-income", cat: "Earnings", name: "Affiliate Income Calculator", desc: "Predict monthly earnings from clicks and conversion rates.", unit: "$", formula: "cl*(cr/100)*com", inputs: [{id:"cl", l:"Link Clicks", v:5000}, {id:"cr", l:"Conversion Rate (%)", v:2}, {id:"com", l:"Avg Commission ($)", v:15}], art: "<h2>Affiliate Success</h2><p>Success in affiliate marketing depends on high-intent clicks and strong conversion landing pages.</p>" },
        
        { id: "brand-deal", cat: "Creator", name: "Brand Deal Estimator", desc: "Calculate base sponsorship rates based on followers.", unit: "$", formula: "f*rate", inputs: [{id:"f", l:"Total Followers", v:50000}, {id:"rate", l:"Rate per Follower ($)", v:0.01}], art: "<h2>Pricing Your Worth</h2><p>A common baseline is $10 per 1,000 followers ($0.01 per follower), but this doubles if your engagement is high.</p>" },
        
        { id: "creator-roi", cat: "Business", name: "Creator ROI Calculator", desc: "Analyze revenue vs effort/time investment.", unit: "x ROI", formula: "rev/exp", inputs: [{id:"rev", l:"Total Project Revenue", v:5000}, {id:"exp", l:"Production Costs/Expenses", v:1200}], art: "<h2>Business Efficiency</h2><p>An ROI of 3x or higher means your production is sustainable and profitable.</p>" },
        
        { id: "sub-growth", cat: "Growth", name: "Subscriber Growth Tracker", desc: "Project future growth based on daily average gain.", unit: " Subs", formula: "cur + (daily*days)", inputs: [{id:"cur", l:"Current Subs", v:10000}, {id:"daily", l:"Avg Daily Gain", v:50}, {id:"days", l:"Days to Project", v:30}], art: "<h2>Predicting Fame</h2><p>Growth is often exponential, but linear tracking helps set short-term milestones.</p>" },
        
        { id: "video-profit", cat: "Business", name: "Video Net Profit", desc: "Calculate final profit after production costs.", unit: "$", formula: "rev - cost", inputs: [{id:"rev", l:"Monetization Revenue", v:800}, {id:"cost", l:"Video Budget", v:300}], art: "<h2>Net vs Gross</h2><p>Always subtract equipment, editors, and prop costs to see if a video niche is truly profitable.</p>" },
        
        { id: "influencer-rate", cat: "Social", name: "Influencer Rate Calculator", desc: "Calculate ideal rates for sponsored posts.", unit: "$", formula: "(f/1000)*15 + (e/100)*50", inputs: [{id:"f", l:"Followers", v:20000}, {id:"e", l:"Avg Engagement (%)", v:4}], art: "<h2>The Value of Engagement</h2><p>This formula weighs reach (followers) and impact (engagement) to find a fair market price.</p>" }
    ];

    const app = document.getElementById('content-area');

    function router() {
        const id = new URLSearchParams(window.location.search).get('id');
        if (id) {
            const tool = TOOLS.find(t => t.id === id);
            renderTool(tool);
        } else {
            renderHome();
        }
    }

    function renderHome() {
        app.innerHTML = `
            <section class="hero">
                <div class="container">
                    <h1>Creator Monetization Lab</h1>
                    <p>Professional tools to calculate, track, and scale your digital income.</p>
                </div>
            </section>
            <div class="container">
                <div class="grid" id="toolGrid">
                    ${TOOLS.map(t => `
                        <a href="?id=${t.id}" class="card">
                            <span class="tag">${t.cat}</span>
                            <h3>${t.name}</h3>
                            <p>${t.desc}</p>
                        </a>
                    `).join('')}
                </div>
            </div>
        `;
    }

    function renderTool(tool) {
        if (!tool) { renderHome(); return; }
        document.title = `${tool.name} | CreatorProfitLab`;
        
        app.innerHTML = `
            <div class="container">
                <div class="calc-layout">
                    <div class="main-card">
                        <a href="index.html" style="font-weight:700; text-decoration:none; color:var(--brand); font-size:0.8rem;">← ALL TOOLS</a>
                        <h1 style="margin: 15px 0 5px 0;">${tool.name}</h1>
                        <p style="color:var(--text-muted); margin-bottom:30px;">${tool.desc}</p>
                        
                        <div class="ad-box">ADVERTISEMENT SLOT</div>

                        <div class="calculator-engine">
                            ${tool.inputs.map(i => `
                                <div class="input-group">
                                    <label>${i.l}</label>
                                    <input type="number" id="${i.id}" value="${i.v}" oninput="runMath()">
                                </div>
                            `).join('')}
                            
                            <div class="result-display">
                                <p>Estimated ${tool.name}</p>
                                <h2 id="res">--</h2>
                            </div>
                        </div>

                        <div class="article">
                            ${tool.art}
                        </div>
                    </div>
                    
                    <div class="sidebar">
                        <div class="ad-box" style="height:400px;">SIDEBAR AD UNIT</div>
                        <div style="background:#4f46e5; color:white; padding:20px; border-radius:15px; margin-top:20px;">
                            <h4>Scale Your Channel</h4>
                            <p style="font-size:0.8rem; margin-top:10px;">Download our blueprint for reaching ₹1,00,000/mo.</p>
                            <button style="width:100%; padding:10px; margin-top:15px; border-radius:8px; border:none; font-weight:bold; cursor:pointer;">Get Guide</button>
                        </div>
                    </div>
                </div>
            </div>
        `;
        window.activeTool = tool;
        runMath();
    }

    function runMath() {
        const t = window.activeTool;
        let expression = t.formula;
        t.inputs.forEach(i => {
            const val = document.getElementById(i.id).value || 0;
            expression = expression.replace(new RegExp(`\\b${i.id}\\b`, 'g'), val);
        });
        try {
            const result = eval(expression);
            document.getElementById('res').innerText = (t.unit === '%' ? '' : t.unit) + result.toLocaleString(undefined, {maximumFractionDigits: 2}) + (t.unit === '%' ? '%' : '');
        } catch(e) { console.error("Math Error"); }
    }

    function doSearch() {
        const q = document.getElementById('toolSearch').value.toLowerCase();
        document.querySelectorAll('.card').forEach(c => {
            c.style.display = c.innerText.toLowerCase().includes(q) ? 'block' : 'none';
        });
    }

    router();
</script>
</body>
</html>
