<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreatorProfitLab | 50+ Precision Tools for Creators & Finance</title>
    <meta name="description" content="Free professional calculators for YouTube revenue, SIP, BMI, GST, and Business ROI. Optimized for Creators and Entrepreneurs.">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand: #4f46e5; --brand-light: #eef2ff; --bg: #f8fafc; 
            --surface: #ffffff; --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        /* Navigation */
        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
        .nav-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.4rem; color: var(--brand); text-decoration: none; letter-spacing: -0.5px; }
        .search-box { position: relative; width: 300px; }
        #toolSearch { width: 100%; padding: 10px 15px; border-radius: 50px; border: 1px solid var(--border); outline: none; font-size: 0.9rem; }

        /* Hero & Home */
        .hero { text-align: center; padding: 60px 0; background: radial-gradient(circle at top right, #e0e7ff, transparent); }
        .hero h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 15px; color: var(--text); }
        .category-nav { display: flex; gap: 10px; justify-content: center; margin-bottom: 40px; flex-wrap: wrap; }
        .cat-btn { padding: 8px 16px; border-radius: 50px; border: 1px solid var(--border); background: white; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
        .cat-btn:hover, .cat-btn.active { background: var(--brand); color: white; border-color: var(--brand); }

        /* Grid System */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding-bottom: 60px; }
        .card { background: var(--surface); padding: 25px; border-radius: 16px; border: 1px solid var(--border); text-decoration: none; color: inherit; transition: 0.3s; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); border-color: var(--brand); box-shadow: 0 10px 25px rgba(79, 70, 229, 0.1); }
        .card .tag { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: var(--brand); margin-bottom: 10px; }
        .card h3 { font-size: 1.1rem; margin-bottom: 10px; }
        .card p { font-size: 0.9rem; color: var(--text-muted); }

        /* Calculator Page Layout */
        .calc-wrapper { display: grid; grid-template-columns: 2fr 1fr; gap: 40px; margin-top: 30px; }
        .calc-card { background: var(--surface); padding: 40px; border-radius: 20px; border: 1px solid var(--border); }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.8rem; font-weight: 800; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; }
        input[type="number"], select { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--border); font-size: 1.1rem; font-weight: 600; outline: none; }
        input:focus { border-color: var(--brand); }
        .result-box { background: var(--brand-light); border: 2px dashed #c7d2fe; padding: 30px; border-radius: 15px; text-align: center; margin-top: 30px; }
        .result-box h3 { font-size: 2.8rem; color: var(--brand); font-weight: 800; }
        
        /* SEO Content Area */
        .seo-content { margin-top: 50px; border-top: 1px solid var(--border); padding-top: 40px; }
        .seo-content h2 { margin-bottom: 20px; font-size: 1.8rem; }
        .seo-content p { margin-bottom: 15px; font-size: 1.05rem; color: #475569; }

        /* Sidebar & Ads */
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .ad-placeholder { background: #f1f5f9; border: 1px dashed #cbd5e1; height: 250px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: var(--text-muted); border-radius: 12px; }
        .affiliate-box { background: #10b981; color: white; padding: 25px; border-radius: 15px; }
        .affiliate-box h4 { margin-bottom: 10px; }
        .affiliate-box button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: white; color: #10b981; font-weight: 800; cursor: pointer; margin-top: 15px; }

        footer { background: white; padding: 40px 0; border-top: 1px solid var(--border); text-align: center; font-size: 0.9rem; color: var(--text-muted); }
        
        @media (max-width: 900px) { .calc-wrapper { grid-template-columns: 1fr; } .search-box { display: none; } }
    </style>
</head>
<body>

<header>
    <div class="container nav-content">
        <a href="index.html" class="logo">🚀 CreatorProfitLab</a>
        <div class="search-box">
            <input type="text" id="toolSearch" placeholder="Search 50+ calculators..." onkeyup="filterTools()">
        </div>
    </div>
</header>

<main id="app-router">
    </main>

<footer>
    <div class="container">
        <p>&copy; 2026 CreatorProfitLab. All professional tools for Creators & Finance.</p>
        <div style="margin-top: 10px;">
            <a href="#" style="color: inherit; margin: 0 10px;">Privacy Policy</a>
            <a href="#" style="color: inherit; margin: 0 10px;">About</a>
        </div>
    </div>
</footer>

<script>
    // 50+ CALCULATORS DATABASE
    const DB = [
        // CREATOR ECONOMY
        { id: "yt-money", cat: "Creator", name: "YouTube Money Calculator", desc: "Estimate revenue based on daily views and niche CPM.", unit: "$", formula: "(v/1000)*c", inputs: [{id:"v", l:"Daily Views", v:10000}, {id:"c", l:"CPM ($)", v:5}], art: "<h2>How much does YouTube pay?</h2><p>YouTube earnings are determined by CPM (Cost Per Mille). High-paying niches like Finance and Tech often see CPMs over $10, while lifestyle channels may see $2-$4.</p>" },
        { id: "ig-money", cat: "Creator", name: "Instagram Earnings", desc: "Predict sponsored post rates based on followers.", unit: "$", formula: "f*0.015", inputs: [{id:"f", l:"Followers", v:50000}], art: "<h2>Instagram Monetization Guide</h2><p>Micro-influencers typically charge $10-$20 per 1,000 followers per post.</p>" },
        { id: "cpm-calc", cat: "Creator", name: "CPM Calculator", desc: "Calculate Cost Per Mille for ad campaigns.", unit: "$", formula: "(cost/imp)*1000", inputs: [{id:"cost", l:"Total Cost", v:500}, {id:"imp", l:"Impressions", v:100000}], art: "<h2>Mastering CPM</h2><p>CPM helps advertisers compare the cost of different media campaigns.</p>" },
        
        // FINANCE
        { id: "sip-calc", cat: "Finance", name: "SIP Calculator", desc: "Calculate wealth gain through Systematic Investment Plans.", unit: "₹", formula: "p*((((1+r/1200)**n)-1)/(r/1200))*(1+r/1200)", inputs: [{id:"p", l:"Monthly SIP", v:5000}, {id:"r", l:"Expected Return (%)", v:12}, {id:"n", l:"Months", v:120}], art: "<h2>Power of Compounding</h2><p>SIP allows you to benefit from rupee cost averaging and long-term compounding.</p>" },
        { id: "gst-calc", cat: "Finance", name: "GST Calculator", desc: "Add or remove GST from your product price.", unit: "₹", formula: "p*(r/100)", inputs: [{id:"p", l:"Amount", v:1000}, {id:"r", l:"GST %", v:18}], art: "<h2>Understanding GST</h2><p>GST is an indirect tax used in India on the supply of goods and services.</p>" },
        { id: "emi-calc", cat: "Finance", name: "Loan EMI Calculator", desc: "Calculate monthly installments for home or car loans.", unit: "₹", formula: "(p*(r/1200)*((1+r/1200)**n))/(((1+r/1200)**n)-1)", inputs: [{id:"p", l:"Principal", v:1000000}, {id:"r", l:"Interest Rate", v:8}, {id:"n", l:"Tenure (Months)", v:60}], art: "<h2>EMI Planning</h2><p>Lower tenures reduce total interest, while higher tenures reduce monthly burden.</p>" },
        
        // HEALTH
        { id: "bmi-calc", cat: "Health", name: "BMI Calculator", desc: "Check your Body Mass Index for health status.", unit: "BMI ", formula: "w/((h/100)**2)", inputs: [{id:"w", l:"Weight (kg)", v:70}, {id:"h", l:"Height (cm)", v:175}], art: "<h2>Healthy Weight Range</h2><p>A BMI between 18.5 and 24.9 is considered ideal for adults.</p>" },
        { id: "cal-calc", cat: "Health", name: "Calorie Calculator", desc: "Estimate daily calories needed for maintenance.", unit: "kcal", formula: "(10*w)+(6.25*h)-(5*25)+5", inputs: [{id:"w", l:"Weight (kg)", v:70}, {id:"h", l:"Height (cm)", v:175}], art: "<h2>BMR & Fitness</h2><p>This uses the Mifflin-St Jeor equation to estimate Basal Metabolic Rate.</p>" },

        // BUSINESS
        { id: "roi-calc", cat: "Business", name: "ROI Calculator", desc: "Calculate the Return on Investment for projects.", unit: "%", formula: "((g-c)/c)*100", inputs: [{id:"g", l:"Gain from Investment", v:5000}, {id:"c", l:"Cost of Investment", v:3000}], art: "<h2>Maximizing ROI</h2><p>ROI is a key metric to evaluate the efficiency of an investment.</p>" }
        // ... (The engine handles unlimited tools as you add them here)
    ];

    const router = document.getElementById('app-router');

    function init() {
        const params = new URLSearchParams(window.location.search);
        const toolId = params.get('id');
        
        if (toolId) {
            const tool = DB.find(t => t.id === toolId);
            renderTool(tool);
        } else {
            renderHome();
        }
    }

    function renderHome(filter = "") {
        let html = `
            <section class="hero">
                <div class="container">
                    <h1>Smarter Tools for Growth</h1>
                    <p>Accurate, fast, and free calculators for the modern creator economy.</p>
                </div>
            </section>
            <div class="container">
                <div class="category-nav">
                    <button class="cat-btn active" onclick="filterCat('All')">All</button>
                    <button class="cat-btn" onclick="filterCat('Creator')">Creator</button>
                    <button class="cat-btn" onclick="filterCat('Finance')">Finance</button>
                    <button class="cat-btn" onclick="filterCat('Health')">Health</button>
                    <button class="cat-btn" onclick="filterCat('Business')">Business</button>
                </div>
                <div class="grid" id="toolGrid">
        `;
        
        DB.forEach(tool => {
            html += `
                <a href="?id=${tool.id}" class="card" data-cat="${tool.cat}">
                    <span class="tag">${tool.cat}</span>
                    <h3>${tool.name}</h3>
                    <p>${tool.desc}</p>
                </a>
            `;
        });
        
        html += `</div></div>`;
        router.innerHTML = html;
    }

    function renderTool(tool) {
        if (!tool) { renderHome(); return; }
        document.title = `${tool.name} - CreatorProfitLab`;
        
        router.innerHTML = `
            <div class="container">
                <div class="calc-wrapper">
                    <div class="calc-main">
                        <a href="index.html" style="font-size:0.8rem; text-decoration:none; color:var(--brand); font-weight:700;">← BACK TO HOME</a>
                        <h1 style="margin-top:10px;">${tool.name}</h1>
                        <p style="color:var(--text-muted); margin-bottom:30px;">${tool.desc}</p>
                        
                        <div class="ad-placeholder">HORIZONTAL AD BANNER</div>

                        <div class="calc-card">
                            ${tool.inputs.map(i => `
                                <div class="input-group">
                                    <label>${i.l}</label>
                                    <input type="number" id="${i.id}" value="${i.v}" oninput="runMath()">
                                </div>
                            `).join('')}
                            
                            <div class="result-box">
                                <label>Estimated Result</label>
                                <h3 id="res-val">--</h3>
                            </div>
                        </div>

                        <div class="seo-content">
                            ${tool.art}
                            <h3>How to use this tool</h3>
                            <p>Simply enter your values into the fields above. The calculation happens instantly as you type.</p>
                        </div>
                    </div>
                    
                    <div class="sidebar">
                        <div class="affiliate-box">
                            <h4>Pro Creator Tools</h4>
                            <p>Get exclusive discounts on software to grow your channel.</p>
                            <button onclick="window.open('https://example.com')">View Offers</button>
                        </div>
                        <div class="ad-placeholder" style="height:600px;">VERTICAL SIDEBAR AD</div>
                    </div>
                </div>
            </div>
        `;
        window.activeTool = tool;
        runMath();
    }

    function runMath() {
        const tool = window.activeTool;
        let formula = tool.formula;
        tool.inputs.forEach(i => {
            const val = document.getElementById(i.id).value || 0;
            formula = formula.replace(new RegExp(`\\b${i.id}\\b`, 'g'), val);
        });
        
        try {
            const result = eval(formula);
            document.getElementById('res-val').innerText = tool.unit + result.toLocaleString(undefined, {maximumFractionDigits: 2});
        } catch(e) { console.error("Math Error"); }
    }

    function filterCat(cat) {
        const cards = document.querySelectorAll('.card');
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        
        cards.forEach(card => {
            if (cat === "All" || card.getAttribute('data-cat') === cat) {
                card.style.display = "flex";
            } else {
                card.style.display = "none";
            }
        });
    }

    function filterTools() {
        const query = document.getElementById('toolSearch').value.toLowerCase();
        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            card.style.display = card.innerText.toLowerCase().includes(query) ? "flex" : "none";
        });
    }

    init();
</script>
</body>
</html>
