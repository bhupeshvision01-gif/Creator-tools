<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreatorProfitLab | 52+ Professional Tools for 2026</title>
    <meta name="description" content="The elite toolkit for the creator economy. Professional-grade calculators for YouTube, Finance, and Business Growth.">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lexend:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand: #4f46e5;
            --brand-dark: #3730a3;
            --bg: #f8fafc;
            --card: rgba(255, 255, 255, 0.9);
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.6; }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

        /* --- MODERN HEADER --- */
        header { background: #fff; border-bottom: 1px solid var(--border); padding: 15px 0; position: sticky; top: 0; z-index: 100; }
        .nav-flex { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Lexend', sans-serif; font-size: 1.5rem; color: var(--brand); cursor: pointer; }
        
        .search-container { flex-grow: 1; max-width: 400px; margin: 0 30px; position: relative; }
        #toolSearch { width: 100%; padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border); outline: none; transition: 0.2s; }
        #toolSearch:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        /* --- HERO SECTION --- */
        #hero-wrapper { text-align: center; padding: 60px 0 40px; background: radial-gradient(circle at top, #eef2ff 0%, #f8fafc 100%); }
        #hero-wrapper h1 { font-family: 'Lexend', sans-serif; font-size: 2.8rem; margin-bottom: 10px; letter-spacing: -1px; }
        #hero-wrapper p { color: var(--text-muted); font-size: 1.1rem; }

        /* --- CATEGORY TABS --- */
        .tabs { display: flex; justify-content: center; gap: 10px; margin: 20px 0 40px; flex-wrap: wrap; }
        .tab { padding: 8px 18px; border-radius: 20px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); transition: 0.2s; }
        .tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }

        /* --- TOOL GRID --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 25px; border-radius: 16px; transition: 0.3s; cursor: pointer; position: relative; overflow: hidden; }
        .card:hover { transform: translateY(-5px); border-color: var(--brand); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .card h3 { font-family: 'Lexend', sans-serif; font-size: 1.2rem; margin-bottom: 8px; }
        .card p { font-size: 0.9rem; color: var(--text-muted); }
        .card-cat { font-size: 0.7rem; text-transform: uppercase; font-weight: 800; color: var(--brand); margin-bottom: 5px; letter-spacing: 1px; }

        /* --- CALCULATOR UI --- */
        .calc-main { max-width: 700px; margin: 40px auto; background: #fff; padding: 40px; border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.04); }
        .back-link { color: var(--brand); font-weight: 600; cursor: pointer; margin-bottom: 20px; display: inline-block; }
        .formula-box { background: var(--bg); padding: 10px 15px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; margin: 15px 0; border-left: 4px solid var(--brand); }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 1.1rem; }
        .result-box { background: #f5f3ff; padding: 25px; border-radius: 12px; text-align: center; margin-top: 30px; border: 1px solid #ddd6fe; }
        .result-box h2 { font-size: 2.5rem; color: var(--brand); font-family: 'Lexend', sans-serif; }

        /* --- CONTENT PAGES --- */
        .content-page { padding: 40px 0; max-width: 800px; margin: 0 auto; }
        .content-page h1 { font-family: 'Lexend', sans-serif; font-size: 2.5rem; margin-bottom: 20px; }
        .cta-box { background: #fffbeb; border: 1px solid #fde68a; padding: 20px; border-radius: 12px; margin: 20px 0; }

        /* --- ADSENSE PLACEHOLDERS --- */
        .ad-slot { background: #f1f5f9; border: 1px dashed #cbd5e1; display: flex; align-items: center; justify-content: center; min-height: 90px; margin: 20px 0; border-radius: 8px; font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }

        footer { border-top: 1px solid var(--border); padding: 40px 0; margin-top: 60px; text-align: center; font-size: 0.9rem; color: var(--text-muted); }
        .footer-links { margin-bottom: 15px; }
        .footer-links a { color: var(--brand); text-decoration: none; margin: 0 10px; font-weight: 600; }

        @media (max-width: 768px) {
            .nav-flex { flex-direction: column; gap: 15px; }
            .search-container { max-width: 100%; margin: 0; }
            #hero-wrapper h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

<header>
    <div class="container nav-flex">
        <div class="logo" onclick="setCat('All')">CreatorProfitLab<span>.</span></div>
        <div class="search-container">
            <input type="text" id="toolSearch" placeholder="Search 52+ calculators..." oninput="doSearch()">
        </div>
        <div style="font-size: 0.8rem; font-weight: 700;">v2.0 Beta</div>
    </div>
</header>

<main>
    <section id="hero-wrapper">
        <div class="container">
            <h1>Professional Toolkits for Creators.</h1>
            <p>High-precision financial modeling for YouTube, Social Media, and Business.</p>
            <div class="tabs" id="category-tabs">
                <button class="tab active" onclick="setCat('All')">All Tools</button>
                <button class="tab" onclick="setCat('Creator')">Creator Economy</button>
                <button class="tab" onclick="setCat('Finance')">Business Finance</button>
                <button class="tab" onclick="setCat('Health')">Health & Bio</button>
            </div>
        </div>
    </section>

    <div class="container" id="view">
        </div>
</main>

<footer>
    <div class="container">
        <div class="footer-links">
            <a href="#" onclick="renderContent('about')">About</a>
            <a href="#" onclick="renderContent('privacy')">Privacy Policy</a>
            <a href="#" onclick="renderContent('terms')">Terms & Disclaimer</a>
            <a href="#" onclick="renderContent('contact')">Contact</a>
        </div>
        <p>&copy; 2026 CreatorProfitLab. All calculations are private and client-side.</p>
    </div>
</footer>

<script>
    // --- 1. THE DATA ---
    const TOOLS = [
        { id: 'yt-income', name: 'YouTube Revenue', cat: 'Creator', desc: 'Estimate net earnings after platform fees.', formula: 'Views * (CPM/1000) * 0.55', inputs: [{l:'Monthly Views', v:100000, id:'v'}, {l:'CPM ($)', v:4, id:'cpm'}] },
        { id: 'emi-calc', name: 'Loan EMI', cat: 'Finance', desc: 'Plan your monthly loan repayments.', formula: 'P * r * (1+r)^n / ((1+r)^n - 1)', inputs: [{l:'Loan Amount ($)', v:50000, id:'p'}, {l:'Interest %', v:8.5, id:'r'}, {l:'Years', v:5, id:'n'}] },
        { id: 'ig-eng', name: 'Instagram Engagement', cat: 'Creator', desc: 'Verify real influence based on reach.', formula: '(Engagements / Reach) * 100', inputs: [{l:'Likes + Saves', v:1200, id:'e'}, {l:'Total Reach', v:25000, id:'r'}] },
        { id: 'roi-calc', name: 'Marketing ROI', cat: 'Finance', desc: 'Calculate return on ad spend (ROAS).', formula: '((Gain - Cost) / Cost) * 100', inputs: [{l:'Total Gain ($)', v:5000, id:'g'}, {l:'Ad Spend ($)', v:2000, id:'c'}] },
        { id: 'bmi-calc', name: 'BMI Calculator', cat: 'Health', desc: 'Metric body mass index analysis.', formula: 'Weight / (Height/100)^2', inputs: [{l:'Weight (kg)', v:70, id:'w'}, {l:'Height (cm)', v:175, id:'h'}] }
    ];

    const SEO_DATA = {
        about: `<h1>Why Thousands Trust CreatorProfitLab</h1><p>We provide SaaS-grade tools for free. Our formulas are updated for 2026 platform changes.</p>`,
        privacy: `<h1>Privacy First</h1><p>We use Google AdSense for ads, but your input data is never sent to our servers. Your privacy is paramount.</p>`,
        terms: `<h1>Terms of Service</h1><p>Our tools are for informational use. Always consult a professional for financial decisions.</p>`,
        contact: `<h1>Support</h1><p>Email us at hello@creatorprofitlab.com for tool requests.</p>`
    };

    let currentCat = "All";

    // --- 2. ROUTING & INIT ---
    window.onload = () => {
        const params = new URLSearchParams(window.location.search);
        const toolId = params.get('id');
        if (toolId) {
            const tool = TOOLS.find(t => t.id === toolId);
            if (tool) { document.getElementById('hero-wrapper').style.display='none'; renderTool(tool); return; }
        }
        renderGrid();
    };

    // --- 3. UI RENDERING ---
    function renderGrid() {
        const view = document.getElementById('view');
        const filtered = currentCat === "All" ? TOOLS : TOOLS.filter(t => t.cat === currentCat);
        
        view.innerHTML = `
            <div class="grid">
                ${filtered.map(t => `
                    <div class="card" onclick='document.getElementById("hero-wrapper").style.display="none"; renderTool(${JSON.stringify(t).replace(/'/g, "&apos;")})'>
                        <div class="card-cat">${t.cat}</div>
                        <h3>${t.name}</h3>
                        <p>${t.desc}</p>
                    </div>
                `).join('')}
            </div>`;
        document.title = "CreatorProfitLab | 50+ Professional Tools";
    }

    function renderTool(t) {
        // Sync URL for SEO
        window.history.pushState({}, '', `?id=${t.id}`);
        document.title = `${t.name} Calculator - CreatorProfitLab`;

        const view = document.getElementById('view');
        view.innerHTML = `
            <div class="calc-main">
                <div class="ad-slot">Sponsored Advertisement Slot (Top)</div>
                <div class="back-link" onclick="location.href=window.location.pathname">← Back to Hub</div>
                <div class="card-cat">${t.cat} Tool</div>
                <h1>${t.name}</h1>
                <div class="formula-box">Formula: ${t.formula.replace(/\*/g,'×').replace(/\//g,'÷')}</div>
                
                ${t.inputs.map(i => `
                    <div class="input-group">
                        <label>${i.l}</label>
                        <input type="number" id="${i.id}" value="${i.v}" oninput="calc()">
                    </div>`).join('')}

                <div class="result-box">
                    <small>CALCULATED RESULT</small>
                    <h2 id="res">--</h2>
                </div>

                <div class="ad-slot">Sponsored Advertisement Slot (Bottom)</div>

                <div class="content-page">
                    <hr style="border:0; border-top:1px solid #eee; margin-bottom:30px;">
                    <h3>How to use the ${t.name}</h3>
                    <p>This professional tool allows you to accurately measure ${t.desc.toLowerCase()} using industry-standard formulas updated for 2026. Bookmark this page for regular business audits.</p>
                </div>
            </div>`;
        
        window.activeTool = t;
        calc();
    }

    function calc() {
        if (!window.activeTool) return;
        const t = window.activeTool;
        let res = 0;
        try {
            if (t.id === 'yt-income') {
                res = parseFloat(document.getElementById('v').value) * (parseFloat(document.getElementById('cpm').value)/1000) * 0.55;
            } else if (t.id === 'emi-calc') {
                const p = parseFloat(document.getElementById('p').value);
                const r = parseFloat(document.getElementById('r').value) / 12 / 100;
                const n = parseFloat(document.getElementById('n').value) * 12;
                res = p * r * Math.pow(1+r, n) / (Math.pow(1+r, n) - 1);
            } else if (t.id === 'ig-eng') {
                res = (parseFloat(document.getElementById('e').value) / parseFloat(document.getElementById('r').value)) * 100;
            } else if (t.id === 'bmi-calc') {
                const w = parseFloat(document.getElementById('w').value);
                const h = parseFloat(document.getElementById('h').value) / 100;
                res = w / (h * h);
            } else if (t.id === 'roi-calc') {
                res = ((parseFloat(document.getElementById('g').value) - parseFloat(document.getElementById('c').value)) / parseFloat(document.getElementById('c').value)) * 100;
            }
            
            const display = document.getElementById('res');
            display.innerText = (t.cat === 'Finance' || t.id.includes('income')) ? `$${res.toLocaleString(undefined, {minimumFractionDigits:2})}` : (t.id.includes('eng') || t.id.includes('roi')) ? `${res.toFixed(2)}%` : res.toFixed(2);
        } catch(e) {}
    }

    function setCat(cat) {
        currentCat = cat;
        window.activeTool = null;
        document.getElementById('hero-wrapper').style.display='block';
        window.history.pushState({}, '', window.location.pathname);
        
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        renderGrid();
    }

    function doSearch() {
        const q = document.getElementById('toolSearch').value.toLowerCase();
        if(q.length > 0) {
            document.getElementById('hero-wrapper').style.display='none';
            const filtered = TOOLS.filter(t => t.name.toLowerCase().includes(q) || t.cat.toLowerCase().includes(q));
            document.getElementById('view').innerHTML = `<div class="grid">${filtered.map(t => `<div class="card" onclick='renderTool(${JSON.stringify(t)})'><div class="card-cat">${t.cat}</div><h3>${t.name}</h3><p>${t.desc}</p></div>`).join('')}</div>`;
        } else {
            document.getElementById('hero-wrapper').style.display='block';
            renderGrid();
        }
    }

    function renderContent(type) {
        document.getElementById('hero-wrapper').style.display='none';
        document.getElementById('view').innerHTML = `<div class="content-page">${SEO_DATA[type]}</div>`;
    }
</script>
</body>
</html>
