<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>CreatorProfitLab | 46+ Precision Calculators for Creators & Finance</title>
    <meta name="description" content="Calculate YouTube revenue, Instagram engagement, Loan EMI, BMI, and more with CreatorProfitLab. The all-in-one precision tool suite for modern creators.">
    <link rel="canonical" href="https://yourdomain.com/">
    
    <meta property="og:title" content="CreatorProfitLab | Precision Tool Suite">
    <meta property="og:description" content="46+ Calculators for Finance, Health, and the Creator Economy.">
    <meta property="og:image" content="https://yourdomain.com/og-card.jpg">
    <meta property="og:url" content="https://yourdomain.com/">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "CreatorProfitLab",
      "url": "https://yourdomain.com/",
      "applicationCategory": "BusinessApplication",
      "about": "A collection of 46 calculators for creators and business professionals.",
      "browserRequirements": "Requires JavaScript",
      "softwareHelp": {
        "@type": "CreativeWork",
        "url": "https://yourdomain.com/help"
      }
    }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* [Your existing styles stay here - keeping it lightweight for PageSpeed] */
        :root { --brand: #4f46e5; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0; --accent: #10b981; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
        aside { width: 300px; background: var(--surface); border-right: 1px solid var(--border); padding: 1.5rem; height: 100vh; position: fixed; overflow-y: auto; z-index: 100; }
        .logo { font-size: 1.4rem; font-weight: 800; color: var(--brand); margin-bottom: 2rem; display: flex; align-items: center; gap: 10px; text-decoration: none; }
        nav button { width: 100%; padding: 0.8rem 1rem; margin-bottom: 0.5rem; border: none; border-radius: 10px; background: transparent; color: var(--text-muted); font-weight: 700; text-align: left; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        nav button:hover { background: #f1f5f9; color: var(--brand); }
        nav button.active { background: var(--brand); color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2); }
        main { flex: 1; margin-left: 300px; padding: 2.5rem; max-width: 1400px; }
        .hero-header { margin-bottom: 2rem; }
        .hero-header h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -1px; }
        .tab-content { display: none; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
        .card { background: var(--surface); padding: 1.5rem; border-radius: 16px; border: 1px solid var(--border); transition: 0.3s; }
        .card:hover { border-color: var(--brand); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .card h3 { font-size: 0.95rem; margin-bottom: 1rem; color: var(--text); font-weight: 800; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; }
        .field { margin-bottom: 0.8rem; }
        label { font-size: 0.65rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 4px; }
        input, select { width: 100%; padding: 0.65rem; border-radius: 8px; border: 1px solid var(--border); background: #fdfdfd; font-weight: 600; outline: none; }
        .btn-calc { width: 100%; padding: 0.8rem; background: var(--brand); color: white; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 5px; }
        .out-box { margin-top: 1rem; padding: 0.9rem; background: #f5f7ff; border-radius: 10px; text-align: center; font-weight: 800; color: var(--brand); border: 2px dashed #dbeafe; }
        @media (max-width: 1024px) { aside { width: 100%; height: auto; position: relative; } main { margin-left: 0; padding: 1rem; } body { flex-direction: column; } }
    </style>
</head>
<body>

<aside>
    <a href="/" class="logo">🚀 CreatorProfitLab</a>
    <nav role="tablist">
        <button role="tab" class="active" onclick="tab(event, 'creator')">1. Creator Economy</button>
        <button role="tab" onclick="tab(event, 'finance')">2. Finance & Money</button>
        <button role="tab" onclick="tab(event, 'health')">3. Health & Nutrition</button>
        <button role="tab" onclick="tab(event, 'math')">4. Math & Science</button>
        <button role="tab" onclick="tab(event, 'utility')">5. Business & Utility</button>
        <button role="tab" onclick="tab(event, 'lifestyle')">6. Lifestyle & Travel</button>
    </nav>
</aside>

<main>
    <header class="hero-header">
        <h1>All-in-One Calculator Suite</h1>
        <p>Professional grade precision tools for daily metrics.</p>
    </header>

    <section id="creator" class="tab-content" style="display:block" role="tabpanel">
        <h2 style="display:none;">Creator Economy Tools</h2>
        <div class="grid">
            <div class="card">
                <h3>YouTube Income Calculator</h3>
                <div class="field">
                    <label for="c1-v">Views / CPM ($)</label>
                    <div style="display:flex;gap:5px;">
                        <input type="number" id="c1-v" value="100000" aria-label="Views">
                        <input type="number" id="c1-c" value="5" aria-label="CPM">
                    </div>
                </div>
                <button class="btn-calc" onclick="run('c1')">Estimate Revenue</button>
                <div class="out-box" id="r-c1" aria-live="polite">$500</div>
            </div>
            </div>
    </section>

    </main>

<script>
    // IMPROVED TAB LOGIC FOR SEO & DEEP LINKING
    function tab(e, id) {
        document.querySelectorAll('.tab-content').forEach(x => x.style.display = 'none');
        document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
        document.getElementById(id).style.display = 'block';
        if(e) e.currentTarget.classList.add('active');
        window.location.hash = id; // Update URL for SEO deep linking
    }

    // Load tab based on URL hash (e.g., mysite.com/#finance)
    window.onload = function() {
        let hash = window.location.hash.substring(1);
        if(hash) {
            let btn = Array.from(document.querySelectorAll('nav button')).find(b => b.innerText.toLowerCase().includes(hash));
            if(btn) btn.click();
        }
    }

    // [Your run() function remains the same...]
</script>
</body>
</html>
