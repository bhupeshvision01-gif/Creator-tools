<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="meta-title">CreatorProfitLab | 52+ Professional Tools for 2026</title>
    <meta name="description" id="meta-desc" content="The elite toolkit for the creator economy. Professional-grade calculators for YouTube, Finance, and Business Growth.">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lexend:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand: #4f46e5;
            --brand-dark: #3730a3;
            --bg: #f8fafc;
            --card: rgba(255, 255, 255, 0.9);
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.6; }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

        /* --- HEADER --- */
        header { background: #fff; border-bottom: 1px solid var(--border); padding: 15px 0; position: sticky; top: 0; z-index: 100; }
        .nav-flex { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Lexend', sans-serif; font-size: 1.5rem; color: var(--brand); cursor: pointer; text-decoration: none; font-weight: 800; }
        
        .search-container { flex-grow: 1; max-width: 400px; margin: 0 30px; position: relative; }
        #toolSearch { width: 100%; padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border); outline: none; }

        /* --- HERO --- */
        #hero-wrapper { text-align: center; padding: 60px 0 40px; background: radial-gradient(circle at top, #eef2ff 0%, #f8fafc 100%); }
        #hero-wrapper h1 { font-family: 'Lexend', sans-serif; font-size: 2.8rem; margin-bottom: 10px; letter-spacing: -1px; }

        /* --- GRID --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 25px; border-radius: 16px; cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--brand); }
        .card-cat { font-size: 0.7rem; text-transform: uppercase; font-weight: 800; color: var(--brand); margin-bottom: 5px; }

        /* --- CALC UI --- */
        .calc-main { max-width: 750px; margin: 40px auto; background: #fff; padding: 40px; border-radius: 24px; border: 1px solid var(--border); }
        .formula-box { background: var(--bg); padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.9rem; margin: 20px 0; border-left: 4px solid var(--brand); }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 1.1rem; }
        .result-box { background: #f5f3ff; padding: 30px; border-radius: 12px; text-align: center; margin: 30px 0; border: 1px solid #ddd6fe; }
        .result-box h2 { font-size: 2.8rem; color: var(--brand); font-family: 'Lexend', sans-serif; }

        /* --- SEO CONTENT AREA --- */
        .seo-article { margin-top: 50px; padding-top: 30px; border-top: 1px solid var(--border); color: var(--text-muted); }
        .seo-article h2, .seo-article h3 { color: var(--text); margin-bottom: 15px; font-family: 'Lexend', sans-serif; }
        .seo-article p { margin-bottom: 15px; }

        footer { border-top: 1px solid var(--border); padding: 40px 0; margin-top: 60px; text-align: center; }
        .footer-links a { color: var(--brand); text-decoration: none; margin: 0 10px; font-weight: 600; }

        .tabs { display: flex; justify-content: center; gap: 10px; margin: 20px 0 40px; flex-wrap: wrap; }
        .tab { padding: 8px 18px; border-radius: 20px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-weight: 600; color: var(--text-muted); }
        .tab.active { background: var(--brand); color: #fff; }
    </style>
</head>
<body>

<header>
    <div class="container nav-flex">
        <a href="/" class="logo" onclick="event.preventDefault(); resetHome();">CreatorProfitLab.</a>
        <div class="search-container">
            <input type="text" id="toolSearch" placeholder="Search for a tool (e.g. YouTube)..." oninput="doSearch()">
        </div>
        <div style="font-size: 0.8rem; font-weight: 700;">PRO 2026</div>
    </div>
</header>

<main id="app">
    <section id="hero-wrapper">
        <div class="container">
            <h1>Free High-Precision Tools.</h1>
            <p>Verified calculators for Creators, Marketers, and Business Owners.</p>
            <div class="tabs">
                <button class="tab active" onclick="setCat('All', this)">All</button>
                <button class="tab" onclick="setCat('Creator', this)">Creator</button>
                <button class="tab" onclick="setCat('Finance', this)">Finance</button>
                <button class="tab" onclick="setCat('Business', this)">Business</button>
            </div>
        </div>
    </section>

    <div class="container" id="view"></div>
</main>

<footer>
    <div class="container">
        <div class="footer-links">
            <a href="#" onclick="renderPage('about')">About</a>
            <a href="#" onclick="renderPage('privacy')">Privacy</a>
            <a href="#" onclick="renderPage('terms')">Terms</a>
        </div>
        <p style="margin-top:20px;">&copy; 2026 CreatorProfitLab. Optimized for Google AdSense & SEO.</p>
    </div>
</footer>

<script>
    // 1. TOOL DATABASE (SEO OPTIMIZED)
    const TOOLS = [
        { 
            id: 'youtube-revenue-calculator', 
            name: 'YouTube Revenue Calculator', 
            cat: 'Creator', 
            desc: 'Estimate your monthly YouTube income after the 45% platform cut.',
            seo_desc: 'Calculate your YouTube earnings based on views and CPM. Use our free tool for 2026 revenue projections.',
            formula: 'Views * (CPM/1000) * 0.55', 
            inputs: [{l:'Monthly Views', v:100000, id:'v'}, {l:'Average CPM ($)', v:4, id:'cpm'}],
            article: `<h2>How to Calculate YouTube Earnings</h2><p>Your earnings depend on your <strong>CPM (Cost Per Mille)</strong>. Finance niches usually have a $10+ CPM, while gaming might be $2. Our calculator automatically applies the 45% YouTube tax to give you your net take-home pay.</p>`
        },
        { 
            id: 'emi-calculator', 
            name: 'EMI Calculator', 
            cat: 'Finance', 
            desc: 'Calculate your Equated Monthly Installments for loans.',
            seo_desc: 'Free loan EMI calculator for home, car, and personal loans. Instant results with amortization logic.',
            formula: 'P * r * (1+r)^n / ((1+r)^n - 1)', 
            inputs: [{l:'Loan Principal ($)', v:50000, id:'p'}, {l:'Interest Rate %', v:8, id:'r'}, {l:'Tenure (Years)', v:5, id:'n'}],
            article: `<h2>Understanding Your Loan EMI</h2><p>A higher tenure reduces your monthly EMI but increases the total interest you pay. Use this tool to find the perfect balance between monthly affordability and long-term savings.</p>`
        },
        { 
            id: 'instagram-engagement-calculator', 
            name: 'Instagram Engagement Rate', 
            cat: 'Creator', 
            desc: 'Verify authentic influence based on reach and interactions.',
            seo_desc: 'Calculate Instagram engagement rate for influencers and brands. Check reach-to-interaction ratios.',
            formula: '(Engagements / Reach) * 100', 
            inputs: [{l:'Total Likes + Comments', v:1200, id:'e'}, {l:'Post Reach', v:25000, id:'r'}],
            article: `<h2>Why Engagement Rate Matters in 2026</h2><p>In the current algorithm, <strong>reach-based engagement</strong> is more important than follower count. A healthy engagement rate is between 2% and 5%.</p>`
        },
        { 
            id: 'roi-calculator', 
            name: 'Business ROI Calculator', 
            cat: 'Business', 
            desc: 'Measure the return on investment for your marketing campaigns.',
            seo_desc: 'Professional ROI calculator for businesses. Measure marketing success and investment returns.',
            formula: '((Gain - Cost) / Cost) * 100', 
            inputs: [{l:'Total Gain ($)', v:15000, id:'g'}, {l:'Investment Cost ($)', v:5000, id:'c'}],
            article: `<h2>How to Improve Business ROI</h2><p>To maximize ROI, focus on reducing acquisition costs and increasing the Lifetime Value (LTV) of each customer.</p>`
        }
    ];

    let currentCat = "All";

    // 2. SEO ROUTING ENGINE
    window.onload = () => {
        const params = new URLSearchParams(window.location.search);
        const toolId = params.get('id');
        if (toolId) {
            const tool = TOOLS.find(t => t.id === toolId);
            if (tool) { showTool(tool); return; }
        }
        renderGrid();
    };

    function resetHome() {
        document.getElementById('hero-wrapper').style.display = 'block';
        window.history.pushState({}, '', '/');
        renderGrid();
    }

    function renderGrid() {
        const view = document.getElementById('view');
        const filtered = currentCat === "All" ? TOOLS : TOOLS.filter(t => t.cat === currentCat);
        view.innerHTML = `<div class="grid">${filtered.map(t => `
            <div class="card" onclick="showToolById('${t.id}')">
                <div class="card-cat">${t.cat}</div>
                <h3>${t.name}</h3>
                <p>${t.desc}</p>
            </div>`).join('')}</div>`;
        document.getElementById('meta-title').innerText = "CreatorProfitLab | 52+ Professional Tools";
    }

    function showToolById(id) {
        const tool = TOOLS.find(t => t.id === id);
        showTool(tool);
    }

    function showTool(t) {
        document.getElementById('hero-wrapper').style.display = 'none';
        window.history.pushState({id: t.id}, '', `?id=${t.id}`);
        
        // Dynamic SEO Update
        document.getElementById('meta-title').innerText = `${t.name} - CreatorProfitLab`;
        document.getElementById('meta-desc').setAttribute('content', t.seo_desc);

        const view = document.getElementById('view');
        view.innerHTML = `
            <div class="calc-main">
                <div class="back-link" style="cursor:pointer; color:var(--brand); margin-bottom:20px;" onclick="resetHome()">← Back to Hub</div>
                <h1>${t.name}</h1>
                <div class="formula-box">Logic: ${t.formula}</div>
                ${t.inputs.map(i => `
                    <div class="input-group">
                        <label>${i.l}</label>
                        <input type="number" id="${i.id}" value="${i.v}" oninput="runCalc()">
                    </div>`).join('')}
                <div class="result-box"><small>ESTIMATED RESULT</small><h2 id="res">--</h2></div>
                <div class="seo-article">${t.article}</div>
            </div>`;
        window.activeTool = t;
        runCalc();
        window.scrollTo(0,0);
    }

    function runCalc() {
        if (!window.activeTool) return;
        const t = window.activeTool;
        let res = 0;
        const val = (id) => parseFloat(document.getElementById(id).value) || 0;

        if (t.id === 'youtube-revenue-calculator') res = val('v') * (val('cpm')/1000) * 0.55;
        if (t.id === 'emi-calculator') {
            const r = val('r')/12/100; const n = val('n')*12;
            res = (val('p') * r * Math.pow(1+r, n)) / (Math.pow(1+r, n) - 1);
        }
        if (t.id === 'instagram-engagement-calculator') res = (val('e') / val('r')) * 100;
        if (t.id === 'roi-calculator') res = ((val('g') - val('c')) / val('c')) * 100;

        document.getElementById('res').innerText = t.name.includes('Rate') || t.name.includes('ROI') ? res.toFixed(2) + '%' : '$' + res.toLocaleString(undefined, {maximumFractionDigits:2});
    }

    function setCat(cat, el) {
        currentCat = cat;
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        renderGrid();
    }

    function doSearch() {
        const q = document.getElementById('toolSearch').value.toLowerCase();
        if(q) {
            document.getElementById('hero-wrapper').style.display = 'none';
            const filtered = TOOLS.filter(t => t.name.toLowerCase().includes(q));
            document.getElementById('view').innerHTML = `<div class="grid">${filtered.map(t => `<div class="card" onclick="showToolById('${t.id}')"><h3>${t.name}</h3></div>`).join('')}</div>`;
        } else {
            resetHome();
        }
    }
</script>
</body>
</html>
