<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreatorProfitLab | 50+ Tools for Creators, Finance & Health</title>
    <meta name="description" content="Free professional calculators for YouTube revenue, SIP, BMI, GST, and Business ROI.">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand: #4f46e5; --brand-light: #f5f7ff; --bg: #f8fafc; 
            --surface: #ffffff; --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        
        /* Header & Search */
        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
        .nav-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.4rem; color: var(--brand); text-decoration: none; }
        #toolSearch { width: 280px; padding: 10px 18px; border-radius: 50px; border: 1px solid var(--border); outline: none; font-size: 0.9rem; transition: 0.3s; }
        #toolSearch:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        /* Home View */
        .hero { text-align: center; padding: 60px 0; background: linear-gradient(180deg, #eff6ff 0%, #f8fafc 100%); }
        .hero h1 { font-size: 2.8rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 10px; }
        .category-nav { display: flex; gap: 12px; justify-content: center; margin-bottom: 40px; flex-wrap: wrap; }
        .cat-btn { padding: 10px 20px; border-radius: 50px; border: 1px solid var(--border); background: white; cursor: pointer; font-weight: 700; font-size: 0.85rem; color: var(--text-muted); }
        .cat-btn.active { background: var(--brand); color: white; border-color: var(--brand); }

        /* Grid System */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 80px; }
        .card { background: var(--surface); padding: 25px; border-radius: 16px; border: 1px solid var(--border); text-decoration: none; color: inherit; transition: 0.3s; position: relative; overflow: hidden; }
        .card:hover { transform: translateY(-5px); border-color: var(--brand); box-shadow: 0 12px 30px rgba(0,0,0,0.04); }
        .card .tag { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; color: var(--brand); background: var(--brand-light); padding: 4px 10px; border-radius: 4px; display: inline-block; margin-bottom: 12px; }
        .card h3 { font-size: 1.15rem; margin-bottom: 8px; font-weight: 700; }
        .card p { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; }

        /* Calculator View */
        .calc-layout { display: grid; grid-template-columns: 1.8fr 1fr; gap: 40px; margin-top: 30px; }
        .main-card { background: var(--surface); padding: 40px; border-radius: 20px; border: 1px solid var(--border); }
        .input-group { margin-bottom: 24px; }
        label { display: block; font-size: 0.75rem; font-weight: 800; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 1.5px solid var(--border); font-size: 1.1rem; font-weight: 700; color: var(--text); background: #fcfdfe; }
        input:focus { border-color: var(--brand); outline: none; background: white; }
        
        .result-display { background: var(--brand); color: white; padding: 35px; border-radius: 16px; text-align: center; margin: 30px 0; box-shadow: 0 10px 20px rgba(79, 70, 229, 0.2); }
        .result-display p { font-size: 0.9rem; font-weight: 600; opacity: 0.9; text-transform: uppercase; margin-bottom: 5px; }
        .result-display h2 { font-size: 3rem; font-weight: 800; margin: 0; letter-spacing: -1px; }

        /* SEO Content */
        .article { margin-top: 50px; padding-top: 40px; border-top: 1px solid var(--border); }
        .article h2 { font-size: 1.8rem; margin-bottom: 20px; font-weight: 800; }
        .article p { margin-bottom: 20px; font-size: 1.05rem; color: #475569; }

        /* Ads & Sidebars */
        .ad-box { background: #f1f5f9; border: 1px dashed #cbd5e1; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 0.7rem; border-radius: 12px; margin: 20px 0; }
        .sidebar-ad { height: 600px; position: sticky; top: 100px; }
        .affiliate-promo { background: #059669; color: white; padding: 25px; border-radius: 16px; margin-bottom: 20px; }
        .affiliate-promo h4 { font-size: 1.2rem; margin-bottom: 10px; }
        .affiliate-promo button { width: 100%; padding: 12px; border: none; border-radius: 10px; background: white; color: #059669; font-weight: 800; cursor: pointer; margin-top: 15px; }

        footer { background: white; padding: 60px 0; border-top: 1px solid var(--border); margin-top: 100px; text-align: center; color: var(--text-muted); }
        
        @media (max-width: 900px) { .calc-layout { grid-template-columns: 1fr; } .hero h1 { font-size: 2rem; } #toolSearch { width: 100%; margin-top: 10px; } .nav-content { flex-direction: column; } }
    </style>
</head>
<body>

<header>
    <div class="container nav-content">
        <a href="index.html" class="logo">🚀 CreatorProfitLab</a>
        <input type="text" id="toolSearch" placeholder="Search tools..." onkeyup="doSearch()">
    </div>
</header>

<div id="content-area">
    </div>

<footer>
    <div class="container">
        <p>&copy; 2026 CreatorProfitLab. The Ultimate Creator Toolbox.</p>
        <div style="margin-top: 15px;">
            <a href="#" style="color: inherit; margin: 0 15px; text-decoration: none;">About</a>
            <a href="#" style="color: inherit; margin: 0 15px; text-decoration: none;">Privacy</a>
            <a href="#" style="color: inherit; margin: 0 15px; text-decoration: none;">Contact</a>
        </div>
    </div>
</footer>

<script>
    // THE DATABASE (Expand this to 200+ tools)
    const TOOLS = [
        { id: "yt-money", cat: "Creator", name: "YouTube Money Calculator", desc: "Calculate potential earnings from views and CPM rates.", unit: "$", formula: "(v/1000)*c", inputs: [{id:"v", l:"Daily Views", v:10000}, {id:"c", l:"CPM ($)", v:5}], art: "<h2>How much can you earn?</h2><p>YouTube pays through the AdSense program. Most creators earn between $2 and $10 per 1,000 views depending on their niche. This tool helps you estimate daily, monthly, and yearly revenue.</p>" },
        { id: "sip-calc", cat: "Finance", name: "SIP Investment Calculator", desc: "Estimate wealth growth with monthly mutual fund investments.", unit: "₹", formula: "p*((((1+r/1200)**n)-1)/(r/1200))*(1+r/1200)", inputs: [{id:"p", l:"Monthly Investment", v:5000}, {id:"r", l:"Expected Return (%)", v:12}, {id:"n", l:"Tenure (Months)", v:120}], art: "<h2>The Wealth of Compounding</h2><p>Systematic Investment Plans (SIP) allow you to invest a small fixed amount regularly. Over time, the power of compounding can turn small savings into a significant corpus.</p>" },
        { id: "bmi-calc", cat: "Health", name: "Body Mass Index (BMI)", desc: "Quickly check if you are within a healthy weight range.", unit: "", formula: "w/((h/100)**2)", inputs: [{id:"w", l:"Weight (kg)", v:70}, {id:"h", l:"Height (cm)", v:175}], art: "<h2>Healthy Weight Metrics</h2><p>BMI is a screening tool used to identify potential weight problems. A BMI of 18.5 to 24.9 is generally considered healthy.</p>" },
        { id: "gst-calc", cat: "Finance", name: "GST Tax Calculator", desc: "Add or remove GST from product prices in seconds.", unit: "₹", formula: "p*(r/100)", inputs: [{id:"p", l:"Base Amount", v:1000}, {id:"r", l:"GST Rate (%)", v:18}], art: "<h2>Understanding GST</h2><p>GST is a comprehensive, multi-stage, destination-based tax that is levied on every value addition.</p>" },
        { id: "ig-price", cat: "Creator", name: "Instagram Sponsored Post", desc: "Estimate what you should charge for a brand deal.", unit: "$", formula: "f*0.02", inputs: [{id:"f", l:"Total Followers", v:25000}], art: "<h2>Influencer Pricing</h2><p>Standard rates for Instagram posts range from $10 to $50 per 1,000 followers, adjusted for engagement rate.</p>" }
    ];

    const app = document.getElementById('content-area');

    function router() {
        const id = new URLSearchParams(window.location.search).get('id');
        if (id) {
            const tool = TOOLS.find(t => t.id === id);
            renderTool(tool);
        } else {
            renderHome();
        }
    }

    function renderHome() {
        let html = `
            <section class="hero">
                <div class="container">
                    <h1>Smarter Tools for Smarter Creators</h1>
                    <p>Free, data-driven calculators for finance, creators, and business growth.</p>
                </div>
            </section>
            <div class="container">
                <div class="category-nav">
                    <button class="cat-btn active" onclick="filterCat('All', this)">All Tools</button>
                    <button class="cat-btn" onclick="filterCat('Creator', this)">Creator</button>
                    <button class="cat-btn" onclick="filterCat('Finance', this)">Finance</button>
                    <button class="cat-btn" onclick="filterCat('Health', this)">Health</button>
                </div>
                <div class="grid" id="toolGrid">
                    ${TOOLS.map(t => `
                        <a href="?id=${t.id}" class="card" data-cat="${t.cat}">
                            <span class="tag">${t.cat}</span>
                            <h3>${t.name}</h3>
                            <p>${t.desc}</p>
                        </a>
                    `).join('')}
                </div>
            </div>
        `;
        app.innerHTML = html;
    }

    function renderTool(tool) {
        if (!tool) { renderHome(); return; }
        document.title = `${tool.name} | CreatorProfitLab`;
        
        app.innerHTML = `
            <div class="container">
                <div class="calc-layout">
                    <div class="main-card">
                        <a href="index.html" style="font-weight:700; text-decoration:none; color:var(--brand); font-size:0.8rem;">← ALL TOOLS</a>
                        <h1 style="margin: 15px 0 5px 0;">${tool.name}</h1>
                        <p style="color:var(--text-muted); margin-bottom:30px;">${tool.desc}</p>
                        
                        <div class="ad-box" style="height:90px;">HORIZONTAL AD SLOT</div>

                        <div class="calculator-engine">
                            ${tool.inputs.map(i => `
                                <div class="input-group">
                                    <label>${i.l}</label>
                                    <input type="number" id="${i.id}" value="${i.v}" oninput="runMath()">
                                </div>
                            `).join('')}
                            
                            <div class="result-display">
                                <p>Estimated ${tool.name}</p>
                                <h2 id="res">--</h2>
                            </div>
                        </div>

                        <div class="article">
                            ${tool.art}
                        </div>
                    </div>
                    
                    <div class="sidebar">
                        <div class="affiliate-promo">
                            <h4>Creator Pro Bundle</h4>
                            <p>Get 20% off the best tools to grow your social media presence.</p>
                            <button onclick="window.open('https://example.com')">Claim Discount</button>
                        </div>
                        <div class="ad-box sidebar-ad">VERTICAL AD SLOT (High RPM)</div>
                    </div>
                </div>
            </div>
        `;
        window.activeTool = tool;
        runMath();
    }

    function runMath() {
        const t = window.activeTool;
        let expression = t.formula;
        t.inputs.forEach(i => {
            const val = document.getElementById(i.id).value || 0;
            expression = expression.replace(new RegExp(`\\b${i.id}\\b`, 'g'), val);
        });
        try {
            const result = eval(expression);
            document.getElementById('res').innerText = t.unit + result.toLocaleString(undefined, {maximumFractionDigits: 2});
        } catch(e) { console.error("Math Logic Error"); }
    }

    function filterCat(cat, btn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.card').forEach(c => {
            c.style.display = (cat === 'All' || c.dataset.cat === cat) ? 'flex' : 'none';
        });
    }

    function doSearch() {
        const q = document.getElementById('toolSearch').value.toLowerCase();
        document.querySelectorAll('.card').forEach(c => {
            c.style.display = c.innerText.toLowerCase().includes(q) ? 'flex' : 'none';
        });
    }

    router();
</script>
</body>
</html>
