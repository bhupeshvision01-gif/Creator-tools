        { id: _0x4f22[129], cat: _0x4f22[126], name: _0x4f22[130], desc: "Probability.", unit: "%", formula: _0x4f22[131], inputs: [{id:"s", l:"Success Outcomes", v:1}, {id:"t", l:"Total Outcomes", v:6}] },
        { id: _0x4f22[132], cat: _0x4f22[126], name: _0x4f22[133], desc: "Average Calc.", unit: " Avg", formula: _0x4f22[134], inputs: [{id:"a", l:"Val 1", v:10}, {id:"b", l:"Val 2", v:20}, {id:"c", l:"Val 3", v:30}] },
        { id: _0x4f22[135], cat: _0x4f22[126], name: _0x4f22[136], desc: "Square Root.", unit: " Root", formula: _0x4f22[137], inputs: [{id:"n", l:"Number", v:144}] },
        { id: _0x4f22[138], cat: _0x4f22[126], name: _0x4f22[139], desc: "X of Y %.", unit: " Result", formula: _0x4f22[140], inputs: [{id:"p", l:"Percentage %", v:15}, {id:"t", l:"Total", v:500}] }
    ];

    let currentCat = "Creator";

    function init() {
        renderTabs();
        navigate('');
    }

    function renderTabs() {
        const cats = [...new Set(TOOLS.map(t => t.cat))].filter(c => !/[*+/-]/.test(c));
        let tabsHtml = cats.map(c => 
            `<button class="tab-btn ${c === currentCat ? 'active' : ''}" onclick="setCat('${c}')">${c}</button>`
        ).join('');
        
        tabsHtml += `<button class="tab-btn ${currentCat === 'Blogs' ? 'active' : ''}" onclick="setCat('Blogs')">Blogs</button>`;
        
        document.getElementById('tabs').innerHTML = tabsHtml;
    }

    function setCat(c) {
        currentCat = c;
        document.getElementById('toolSearch').value = "";
        renderTabs();
        navigate('');
    }

    function navigate(q) {
        const params = new URLSearchParams(q);
        const id = params.get('id');
        const view = document.getElementById('view');
        
        if (id) {
            const tool = TOOLS.find(t => t.id === id);
            if (tool) renderTool(tool);
        } else if (currentCat === "Blogs") {
            renderBlogGrid();
        } else {
            const filtered = TOOLS.filter(t => t.cat === currentCat);
            renderGrid(filtered);
        }
    }

    function renderGrid(toolsList) {
        const view = document.getElementById('view');
        let gridHtml = '';
        
        toolsList.forEach((t, i) => {
            // Insert an Ad slot after every 3 items
            if (i > 0 && i % 3 === 0) {
                gridHtml += `
                <div class="ad-card">
                    <span class="ad-tag">SPONSORED</span>
                    <div>
                        <strong>AD SPACE</strong><br>
                        <small>Native Display Ad</small>
                    </div>
                </div>`;
            }
            gridHtml += `
            <div class="card" onclick="navigate('id=${t.id}')">
                <span class="badge">${t.cat}</span>
                <h3>${t.name}</h3>
                <div style="color:var(--brand); font-weight:700; margin-top:auto; font-size:0.8rem;">USE CALCULATOR →</div>
            </div>`;
        });
        
        view.innerHTML = `<div class="grid">${gridHtml}</div>`;
    }

    function renderBlogGrid() {
        const view = document.getElementById('view');
        const blogKeys = Object.keys(content).filter(k => !['about','contact','privacy','terms'].includes(k));
        view.innerHTML = `<div class="grid">${blogKeys.map(key => `
            <div class="card" onclick="renderContent('${key}')">
                <span class="badge">Blog</span>
                <h3>${key.replace(/-/g, ' ').toUpperCase()}</h3>
                <div style="color:var(--brand); font-weight:700; margin-top:auto; font-size:0.8rem;">READ ARTICLE →</div>
            </div>`).join('')}</div>`;
    }

    function renderTool(t) {
        const view = document.getElementById('view');
        view.innerHTML = `
            <div class="calc-main">
                <div class="back-link" onclick="navigate('')">← Back to ${t.cat}</div>
                <h1>${t.name}</h1>

                <div class="calc-banner-ad">
                    <span style="font-size:0.6rem; font-weight:800; display:block; margin-bottom:5px;">ADVERTISEMENT</span>
                    <div style="height:90px; border:1px dashed #cbd5e1; display:flex; align-items:center; justify-content:center;">
                        728 x 90 Leaderboard Placeholder
                    </div>
                </div>

                <div class="formula-box">📊 Formula: ${t.formula.replace(/\*/g,'×').replace(/\//g,'÷')}</div>
                ${t.inputs.map(i => `
                    <div class="input-group">
                        <label>${i.l}</label>
                        <input type="number" id="${i.id}" value="${i.v}" oninput="calc()">
                    </div>`).join('')}
                <div class="result-box">
                    <small>PROJECTION RESULT</small>
                    <h2 id="res">--</h2>
                </div>
            </div>`;
        window.activeTool = t;
        calc();
    }

    function renderContent(key) {
        const view = document.getElementById('view');
        view.innerHTML = `<div class="content-page">
            <div class="back-link" onclick="navigate('')">← Back</div>
            ${content[key]}
        </div>`;
        window.scrollTo(0,0);
    }

    function calc() {
        const t = window.activeTool;
        if (!t) return;
        let expr = t.formula;
        t.inputs.forEach(i => {
            const val = parseFloat(document.getElementById(i.id).value) || 0;
            expr = expr.replace(new RegExp(`\\b${i.id}\\b`, 'g'), val);
        });
        try {
            const res = eval(expr);
            const isCurrency = t.unit.includes('$');
            const formatted = res.toLocaleString(undefined, { maximumFractionDigits: 2 });
            document.getElementById('res').innerText = isCurrency ? `$${formatted}` : `${formatted}${t.unit}`;
        } catch (e) { document.getElementById('res').innerText = "Error"; }
    }

    function doSearch() {
        const q = document.getElementById('toolSearch').value.toLowerCase();
        if (q === "") { navigate(''); return; }
        
        const matches = TOOLS.filter(t => t.name.toLowerCase().includes(q) || t.cat.toLowerCase().includes(q));
        
        let articleHtml = "";
        Object.keys(content).forEach(key => {
            if (key.includes(q) || content[key].toLowerCase().includes(q)) {
                if (!['about','contact','privacy','terms'].includes(key)) {
                    articleHtml += `
                        <div class="card" onclick="renderContent('${key}')">
                            <span class="badge">Blog</span>
                            <h3>${key.replace(/-/g, ' ').toUpperCase()}</h3>
                            <div style="color:var(--brand); font-weight:700; margin-top:auto; font-size:0.8rem;">READ ARTICLE →</div>
                        </div>`;
                }
            }
        });

        document.getElementById('view').innerHTML = `<div class="grid">${matches.map(t => `
            <div class="card" onclick="navigate('id=${t.id}')">
                <span class="badge">${t.cat}</span>
                <h3>${t.name}</h3>
                <div style="color:var(--brand); font-weight:700; margin-top:auto; font-size:0.8rem;">USE CALCULATOR →</div>
            </div>`).join('')}${articleHtml}</div>`;
    }
</script>
