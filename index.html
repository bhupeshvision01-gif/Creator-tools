<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreatorProfitLab | 50+ Global Professional Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand: #4f46e5; --bg: #f8fafc; --surface: #ffffff; 
            --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        /* Nav & Tabs */
        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
        .nav-content { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .logo { font-weight: 800; font-size: 1.4rem; color: var(--brand); text-decoration: none; }
        #toolSearch { width: 300px; padding: 10px 18px; border-radius: 50px; border: 1px solid var(--border); outline: none; }

        .tabs-container { 
            display: flex; 
            gap: 10px; 
            overflow-x: auto; 
            padding-bottom: 10px;
            scrollbar-width: none; /* Hide scrollbar Firefox */
        }
        .tabs-container::-webkit-scrollbar { display: none; } /* Hide scrollbar Chrome */

        .tab-btn { 
            padding: 8px 20px; 
            background: #eef2ff; 
            border: 1px solid var(--border); 
            border-radius: 50px; 
            cursor: pointer; 
            white-space: nowrap;
            font-weight: 600;
            color: var(--text-muted);
            transition: 0.3s;
        }
        .tab-btn.active { background: var(--brand); color: white; border-color: var(--brand); }

        /* Grid Layout */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: var(--surface); padding: 22px; border-radius: 16px; border: 1px solid var(--border); text-decoration: none; color: inherit; transition: 0.3s; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-3px); border-color: var(--brand); box-shadow: 0 10px 20px rgba(0,0,0,0.04); }
        .card h3 { font-size: 1.05rem; margin-bottom: 8px; font-weight: 700; }
        .card p { font-size: 0.85rem; color: var(--text-muted); }

        /* Calc Layout */
        .calc-main { background: var(--surface); padding: 40px; border-radius: 24px; border: 1px solid var(--border); margin-top: 30px; max-width: 700px; margin-left: auto; margin-right: auto; }
        .input-group { margin-bottom: 18px; }
        label { display: block; font-size: 0.75rem; font-weight: 800; margin-bottom: 6px; color: var(--text-muted); }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 1.1rem; font-weight: 700; }
        
        .result-box { background: var(--brand); color: white; padding: 30px; border-radius: 20px; text-align: center; margin: 25px 0; }
        .result-box h2 { font-size: 2.8rem; font-weight: 800; margin: 0; }
        
        footer { text-align: center; padding: 40px 0; color: var(--text-muted); font-size: 0.85rem; }
    </style>
</head>
<body>

<header>
    <div class="container">
        <div class="nav-content">
            <a href="index.html" class="logo">🚀 CreatorProfitLab</a>
            <input type="text" id="toolSearch" placeholder="Search tools..." onkeyup="doSearch()">
        </div>
        <div class="tabs-container" id="tabs">
            </div>
    </div>
</header>

<div id="view" class="container"></div>

<footer>&copy; 2026 CreatorProfitLab • Professional Digital Toolbox</footer>

<script>
    const TOOLS = [
        // CATEGORY 1: CREATOR
        { id: "yt-income", cat: "Creator", name: "YouTube Income", desc: "Views × CPM × Ads.", unit: "$", formula: "(v/1000)*c*a", inputs: [{id:"v", l:"Monthly Views", v:100000}, {id:"c", l:"CPM ($)", v:5}, {id:"a", l:"Ads per Video", v:1.5}] },
        { id: "ig-eng", cat: "Creator", name: "Instagram Engagement", desc: "Likes + Comments / Reach.", unit: "%", formula: "((l+c)/r)*100", inputs: [{id:"l", l:"Likes", v:1200}, {id:"c", l:"Comments", v:80}, {id:"r", l:"Reach", v:20000}] },
        { id: "tk-earn", cat: "Creator", name: "TikTok Earnings", desc: "Creator Fund Revenue.", unit: "$", formula: "(v/1000000)*35", inputs: [{id:"v", l:"Views", v:1000000}] },
        { id: "cpm-calc", cat: "Creator", name: "CPM Calculator", desc: "Ad cost per 1k views.", unit: "$", formula: "(cost/imp)*1000", inputs: [{id:"cost", l:"Spend ($)", v:500}, {id:"imp", l:"Impressions", v:100000}] },
        
        // CATEGORY 2: FINANCE
        { id: "emi-calc", cat: "Finance", name: "EMI Calculator", desc: "Equated Monthly Installment.", unit: "$/mo", formula: "(p*(r/1200)*((1+r/1200)**n))/(((1+r/1200)**n)-1)", inputs: [{id:"p", l:"Principal ($)", v:10000}, {id:"r", l:"Rate (%)", v:10}, {id:"n", l:"Months", v:24}] },
        { id: "compound-calc", cat: "Finance", name: "Compound Interest", desc: "Wealth growth over time.", unit: "$", formula: "p*(1+(r/100))**t", inputs: [{id:"p", l:"Principal ($)", v:1000}, {id:"r", l:"Annual Rate (%)", v:8}, {id:"t", l:"Years", v:10}] },
        { id: "sip-calc", cat: "Finance", name: "SIP Calculator", desc: "Mutual Funds growth.", unit: "$", formula: "p*((((1+r/1200)**n)-1)/(r/1200))*(1+r/1200)", inputs: [{id:"p", l:"Monthly Inv ($)", v:500}, {id:"r", l:"Return (%)", v:12}, {id:"n", l:"Months", v:120}] },
        { id: "crypto-prof", cat: "Finance", name: "Crypto Profit", desc: "Bitcoin/ETH gains/loss.", unit: "$ Profit", formula: "(amt/buy)*sell - amt", inputs: [{id:"amt", l:"Invested ($)", v:1000}, {id:"buy", l:"Buy Price ($)", v:45000}, {id:"sell", l:"Sell Price ($)", v:65000}] },

        // CATEGORY 3: HEALTH
        { id: "bmi-calc", cat: "Health", name: "BMI Calculator", desc: "Weight/Height ratio.", unit: " BMI", formula: "w/((h/100)**2)", inputs: [{id:"w", l:"Weight (kg)", v:70}, {id:"h", l:"Height (cm)", v:175}] },
        { id: "calorie-calc", cat: "Health", name: "Daily Calorie", desc: "Maintenance intake.", unit: " kcal", formula: "((10*w) + (6.25*h) - (5*a) + 5) * 1.2", inputs: [{id:"w", l:"Weight (kg)", v:70}, {id:"h", l:"Height (cm)", v:175}, {id:"a", l:"Age", v:25}] },
        { id: "heart-rate", cat: "Health", name: "Target Heart Rate", desc: "Karvonen Formula.", unit: " bpm", formula: "((220 - a - r) * 0.7) + r", inputs: [{id:"a", l:"Age", v:25}, {id:"r", l:"Resting HR", v:70}] },

        // CATEGORY 4: BUSINESS
        { id: "startup-val", cat: "Business", name: "Startup Valuation", desc: "Revenue Multiplier.", unit: "$ Value", formula: "r * m", inputs: [{id:"r", l:"Annual Revenue ($)", v:100000}, {id:"m", l:"Multiplier (3-10x)", v:5}] },
        { id: "break-even", cat: "Business", name: "Break-even Calc", desc: "Units to cover costs.", unit: " Units", formula: "f / (s - v)", inputs: [{id:"f", l:"Fixed Costs ($)", v:2000}, {id:"s", l:"Selling Price ($)", v:50}, {id:"v", l:"Variable Cost ($)", v:20}] },
        { id: "retirement-calc", cat: "Business", name: "Retirement Planner", desc: "4% Safe Withdrawal rule.", unit: "$ Target", formula: "(e*12) / 0.04", inputs: [{id:"e", l:"Monthly Spend ($)", v:4000}] },

        // CATEGORY 5: TRAVEL/LIFESTYLE
        { id: "trip-total", cat: "Lifestyle", name: "Trip Cost Total", desc: "Fuel + Tolls + Hotel.", unit: "$ Total", formula: "((dist/mpg)*price) + tolls + hotel", inputs: [{id:"dist", l:"Distance (Miles)", v:500}, {id:"mpg", l:"MPG", v:25}, {id:"price", l:"Fuel $", v:4}, {id:"tolls", l:"Tolls $", v:20}, {id:"hotel", l:"Hotel $", v:150}] },
        { id: "paint-calc", cat: "Lifestyle", name: "Carpet & Paint", desc: "Area coverage.", unit: " sq ft", formula: "l * w", inputs: [{id:"l", l:"Length (ft)", v:15}, {id:"w", l:"Width (ft)", v:12}] }
        // (Add more tools here following the same structure)
    ];

    let currentCat = "Creator";
    const view = document.getElementById('view');
    const tabsBox = document.getElementById('tabs');

    function init() {
        renderTabs();
        router();
    }

    function renderTabs() {
        const categories = [...new Set(TOOLS.map(t => t.cat))];
        tabsBox.innerHTML = categories.map(cat => 
            `<button class="tab-btn ${cat === currentCat ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>`
        ).join('');
    }

    function setCategory(cat) {
        currentCat = cat;
        renderTabs();
        const url = new URL(window.location);
        url.searchParams.delete('id');
        window.history.pushState({}, '', url);
        renderHome();
    }

    function renderHome() {
        document.getElementById('tabs').style.display = 'flex';
        const filtered = TOOLS.filter(t => t.cat === currentCat);
        let html = `<div class="grid">`;
        html += filtered.map(t => `<a href="?id=${t.id}" class="card"><h3>${t.name}</h3><p>${t.desc}</p></a>`).join('');
        html += `</div>`;
        view.innerHTML = html;
    }

    function renderTool(tool) {
        document.getElementById('tabs').style.display = 'none';
        view.innerHTML = `
            <div class="calc-main">
                <button onclick="window.history.back()" style="border:none; background:none; color:var(--brand); font-weight:800; cursor:pointer; margin-bottom:15px;">← BACK</button>
                <h1>${tool.name}</h1>
                <p style="color:var(--text-muted); margin-bottom:25px;">${tool.desc}</p>
                ${tool.inputs.map(i => `<div class="input-group"><label>${i.l}</label><input type="number" id="${i.id}" value="${i.v}" oninput="calc()"></div>`).join('')}
                <div class="result-box"><p>Result</p><h2 id="res">--</h2></div>
            </div>`;
        window.activeTool = tool;
        calc();
    }

    function calc() {
        const t = window.activeTool;
        if (!t) return;
        let expr = t.formula;
        t.inputs.forEach(i => {
            const val = parseFloat(document.getElementById(i.id).value) || 0;
            expr = expr.replace(new RegExp(`\\b${i.id}\\b`, 'g'), val);
        });
        const result = eval(expr);
        document.getElementById('res').innerText = (t.unit.includes('$') ? '$' : '') + result.toLocaleString(undefined, {maximumFractionDigits: 2}) + (!t.unit.includes('$') ? t.unit : '');
    }

    function doSearch() {
        const q = document.getElementById('toolSearch').value.toLowerCase();
        if(q.length > 0) {
            document.getElementById('tabs').style.display = 'none';
            const matches = TOOLS.filter(t => t.name.toLowerCase().includes(q) || t.cat.toLowerCase().includes(q));
            view.innerHTML = `<div class="grid">${matches.map(t => `<a href="?id=${t.id}" class="card"><h3>${t.name}</h3><p>${t.desc}</p></a>`).join('')}</div>`;
        } else {
            renderTabs();
            renderHome();
        }
    }

    function router() {
        const id = new URLSearchParams(window.location.search).get('id');
        if (id) {
            const tool = TOOLS.find(t => t.id === id);
            renderTool(tool);
        } else {
            renderHome();
        }
    }

    window.onpopstate = router;
    init();
</script>
</body>
</html>
