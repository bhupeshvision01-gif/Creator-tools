<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreatorProfitLab | The Ultimate Professional Toolkit</title>
    
    <meta name="description" content="Professional calculators for YouTubers, Investors, and Fitness enthusiasts.">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --brand: #6366f1;
            --brand-dark: #4f46e5;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
        }

        [data-theme="dark"] {
            --bg: #020617;
            --surface: #0f172a;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.2s; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); }

        .app-shell { display: flex; min-height: 100vh; }

        /* Sidebar */
        aside {
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 2.5rem 1.5rem;
            position: fixed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .logo { font-size: 1.5rem; font-weight: 800; color: var(--brand); margin-bottom: 2.5rem; letter-spacing: -1px; }
        .logo span { color: var(--text); }

        nav button {
            width: 100%;
            padding: 0.9rem 1.2rem;
            margin-bottom: 0.6rem;
            border: none;
            border-radius: 14px;
            background: transparent;
            color: var(--text-muted);
            font-weight: 700;
            text-align: left;
            cursor: pointer;
        }

        nav button.active { background: var(--brand); color: white; box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4); }

        /* Main Content */
        main { flex: 1; margin-left: 280px; padding: 4rem; }
        .hero { margin-bottom: 3rem; }
        .hero h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -1.2px; }

        /* Grid & Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 2rem; }
        .card {
            background: var(--surface);
            padding: 2rem;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            position: relative;
        }
        .card:hover { border-color: var(--brand); }
        .card h3 { font-size: 1rem; margin-bottom: 1.2rem; color: var(--brand); text-transform: uppercase; font-weight: 800; }

        .field { margin-bottom: 1rem; }
        label { font-size: 0.7rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 4px; }
        input, select {
            width: 100%;
            padding: 0.8rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-weight: 700;
            outline: none;
        }

        .btn-calc {
            width: 100%;
            padding: 1rem;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 1rem;
        }

        /* Result Visualization */
        .output-container {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: rgba(99, 102, 241, 0.05);
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(99, 102, 241, 0.1);
        }
        .res-label { font-size: 0.7rem; font-weight: 800; color: var(--brand); text-transform: uppercase; margin-bottom: 5px; display: block; }
        .res-val { font-size: 1.8rem; font-weight: 800; color: var(--brand); }

        .btn-save {
            margin-top: 10px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-save:hover { background: var(--bg); color: var(--brand); border-color: var(--brand); }

        @media (max-width: 1024px) {
            aside { width: 100%; height: auto; position: relative; }
            main { margin-left: 0; padding: 2rem; }
            .app-shell { flex-direction: column; }
        }
    </style>
</head>
<body data-theme="light">

<div class="app-shell">
    <aside>
        <div class="logo">CreatorProfit<span>Lab</span></div>
        <nav>
            <button class="active" onclick="showTab(event, 'creator')">Creator Tools</button>
            <button onclick="showTab(event, 'finance')">Finance Suite</button>
            <button onclick="showTab(event, 'health')">Health & Nutrition</button>
        </nav>
        <button onclick="toggleTheme()" style="margin-top:auto; padding: 10px; font-size: 11px; border-radius: 8px; border:1px solid var(--border);">🌓 SWITCH THEME</button>
    </aside>

    <main>
        <section id="creator" class="tab-pane">
            <div class="hero">
                <h1>Creator Tools</h1>
                <p>Maximize your social presence and revenue.</p>
            </div>
            <div class="grid">
                <div class="card" id="card-yt">
                    <h3>YouTube Income</h3>
                    <div class="field"><label>Monthly Views</label><input type="number" id="yt-v" value="100000"></div>
                    <div class="field"><label>CPM ($)</label><input type="number" id="yt-c" value="5"></div>
                    <button class="btn-calc" onclick="calc('yt')">Calculate</button>
                    <div class="output-container">
                        <span class="res-label">Est. Revenue</span>
                        <div class="res-val" id="yt-res">$500.00</div>
                    </div>
                    <button class="btn-save" onclick="saveCard('card-yt')">📸 Save Result</button>
                </div>
                </div>
        </section>

        <section id="finance" class="tab-pane" style="display:none">
            <div class="hero"><h1>Finance Suite</h1><p>Investment and Loan calculators.</p></div>
            <div class="grid">
                <div class="card" id="card-sip">
                    <h3>SIP Calculator</h3>
                    <div class="field"><label>Monthly Investment</label><input type="number" id="sip-m" value="100"></div>
                    <div class="field"><label>Return Rate %</label><input type="number" id="sip-r" value="12"></div>
                    <div class="field"><label>Years</label><input type="number" id="sip-y" value="10"></div>
                    <button class="btn-calc" onclick="calc('sip')">Calculate SIP</button>
                    <div class="output-container">
                        <span class="res-label">Wealth Gained</span>
                        <div class="res-val" id="sip-res">$23,234</div>
                    </div>
                    <button class="btn-save" onclick="saveCard('card-sip')">📸 Save Result</button>
                </div>
            </div>
        </section>

        <section id="health" class="tab-pane" style="display:none">
            <div class="hero"><h1>Health Intelligence</h1><p>Body and nutrition metrics.</p></div>
            <div class="grid">
                <div class="card" id="card-bmi">
                    <h3>BMI Calculator</h3>
                    <div class="field"><label>Weight (kg)</label><input type="number" id="bmi-w" value="70"></div>
                    <div class="field"><label>Height (cm)</label><input type="number" id="bmi-h" value="175"></div>
                    <button class="btn-calc" onclick="calc('bmi')">Calculate BMI</button>
                    <div class="output-container">
                        <span class="res-label">Your BMI</span>
                        <div class="res-val" id="bmi-res">22.9</div>
                    </div>
                    <button class="btn-save" onclick="saveCard('card-bmi')">📸 Save Result</button>
                </div>
            </div>
        </section>
    </main>
</div>

<script>
    function toggleTheme() {
        document.body.setAttribute('data-theme', document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }

    function showTab(e, id) {
        document.querySelectorAll('.tab-pane').forEach(p => p.style.display = 'none');
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).style.display = 'block';
        e.currentTarget.classList.add('active');
    }

    // Logic Engine
    function calc(type) {
        if(type === 'yt') {
            let res = (document.getElementById('yt-v').value / 1000) * document.getElementById('yt-c').value;
            document.getElementById('yt-res').innerText = '$' + res.toLocaleString(undefined, {minimumFractionDigits: 2});
        }
        if(type === 'sip') {
            let m = parseFloat(document.getElementById('sip-m').value);
            let r = (document.getElementById('sip-r').value / 12) / 100;
            let n = document.getElementById('sip-y').value * 12;
            let res = m * [ (Math.pow(1 + r, n) - 1) / r ] * (1 + r);
            document.getElementById('sip-res').innerText = '$' + Math.round(res).toLocaleString();
        }
        if(type === 'bmi') {
            let w = document.getElementById('bmi-w').value;
            let h = document.getElementById('bmi-h').value / 100;
            document.getElementById('bmi-res').innerText = (w / (h*h)).toFixed(1);
        }
    }

    // --- NEW: SAVE AS IMAGE FEATURE ---
    function saveCard(cardId) {
        const card = document.getElementById(cardId);
        // Temporarily hide the buttons for a clean capture
        const btns = card.querySelectorAll('button');
        btns.forEach(b => b.style.visibility = 'hidden');

        html2canvas(card, {
            backgroundColor: getComputedStyle(document.body).getPropertyValue('--surface'),
            scale: 2, // Higher quality
            borderRadius: 24
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `CreatorProfitLab-Result.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
            // Restore buttons
            btns.forEach(b => b.style.visibility = 'visible');
        });
    }
</script>

</body>
</html>
