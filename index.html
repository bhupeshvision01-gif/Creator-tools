<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreatorProfitLab | 50+ Global Professional Tools</title>
    <meta name="description" content="Free professional calculators for YouTube, Finance, Business, and Health. Calculate EMI, SIP, Creator Earnings, and BMI instantly.">
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --brand: #4f46e5; --bg: #f8fafc; --surface: #ffffff; 
            --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0;
            --accent: #f1f5f9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 0; position: sticky; top: 0; z-index: 1000; }
        .nav-content { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
        .logo { font-weight: 800; font-size: 1.5rem; color: var(--brand); text-decoration: none; }
        #toolSearch { flex-grow: 1; max-width: 400px; padding: 12px 20px; border-radius: 50px; border: 1px solid var(--border); outline: none; background: var(--accent); }
        .tabs-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .tab-btn { padding: 10px 22px; background: var(--accent); border: none; border-radius: 50px; cursor: pointer; white-space: nowrap; font-weight: 600; color: var(--text-muted); }
        .tab-btn.active { background: var(--brand); color: white; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: var(--surface); padding: 24px; border-radius: 20px; border: 1px solid var(--border); text-decoration: none; color: inherit; transition: 0.3s; display: flex; flex-direction: column; height: 100%; }
        .card:hover { transform: translateY(-5px); border-color: var(--brand); }
        .badge { align-self: flex-start; font-size: 0.7rem; font-weight: 800; padding: 4px 10px; background: #eef2ff; color: var(--brand); border-radius: 6px; text-transform: uppercase; margin-bottom: 10px; }
        .calc-main { background: var(--surface); padding: 40px; border-radius: 30px; border: 1px solid var(--border); margin: 40px auto; max-width: 650px; }
        .back-btn { color: var(--brand); font-weight: 700; cursor: pointer; border: none; background: none; margin-bottom: 20px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.75rem; font-weight: 800; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; }
        input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 1.1rem; background: var(--accent); }
        .result-box { background: var(--brand); color: white; padding: 35px; border-radius: 24px; text-align: center; margin: 30px 0; }
        .result-box h2 { font-size: 3rem; font-weight: 800; }
        footer { border-top: 1px solid var(--border); padding: 40px 0; margin-top: 60px; text-align: center; }
        .f-links a { margin: 0 10px; text-decoration: none; color: var(--text-muted); font-size: 0.9rem; font-weight: 600; }
        .legal-content { max-width: 800px; margin: 40px auto; background: white; padding: 40px; border-radius: 20px; border: 1px solid var(--border); }
    </style>
</head>
<body>

<header>
    <div class="container">
        <div class="nav-content">
            <a href="index.html" class="logo">🚀 CreatorProfitLab</a>
            <input type="text" id="toolSearch" placeholder="Search 50+ tools..." onkeyup="doSearch()">
        </div>
        <div class="tabs-container" id="tabs"></div>
    </div>
</header>

<div id="view" class="container"></div>

<footer>
    <div class="container">
        <div class="f-links">
            <a href="index.html">Home</a>
            <a href="?page=about">About</a>
            <a href="?page=contact">Contact</a>
            <a href="?page=privacy">Privacy</a>
            <a href="?page=terms">Terms</a>
        </div>
        <p style="margin-top:15px; font-size:0.8rem; color:#94a3b8;">&copy; 2026 CreatorProfitLab</p>
    </div>
</footer>

<script>
    const TOOLS = [
        { id: "yt-income", cat: "Creator", name: "YouTube Revenue", desc: "Views × CPM × Ads.", unit: "$", formula: "(v/1000)*c*a", inputs: [{id:"v", l:"Monthly Views", v:100000}, {id:"c", l:"CPM ($)", v:5}, {id:"a", l:"Ads per Video", v:1.5}] },
        { id: "cpm-calc", cat: "Creator", name: "CPM Calculator", desc: "Cost per 1,000 views.", unit: "$ CPM", formula: "(cost/views)*1000", inputs: [{id:"cost", l:"Total Ad Spend ($)", v:500}, {id:"views", l:"Total Views", v:100000}] },
        { id: "brand-deal", cat: "Creator", name: "Brand Deal Estimator", desc: "Estimate post value.", unit: "$/Post", formula: "f*(r/100)", inputs: [{id:"f", l:"Total Followers", v:50000}, {id:"r", l:"Rate Per Follower ($)", v:0.02}] },
        { id: "x-post-calc", cat: "Creator", name: "X Post Value", desc: "Value of an X post.", unit: "$ Value", formula: "((i/1000)*c)+((e+r)*a)", inputs: [{id:"i", l:"Impressions", v:5000}, {id:"c", l:"CPM Rate ($)", v:6}, {id:"e", l:"Likes", v:150}, {id:"r", l:"Retweets", v:20}, {id:"a", l:"Bonus ($)", v:0.50}] },
        { id: "emi-calc", cat: "Finance", name: "Loan EMI", desc: "Monthly installments.", unit: "$/mo", formula: "(p*(r/1200)*((1+r/1200)**n))/(((1+r/1200)**n)-1)", inputs: [{id:"p", l:"Principal ($)", v:10000}, {id:"r", l:"Rate (%)", v:10}, {id:"n", l:"Months", v:24}] },
        { id: "sip-calc", cat: "Finance", name: "SIP / Mutual Fund", desc: "Wealth growth.", unit: "$", formula: "p*((((1+r/1200)**n)-1)/(r/1200))*(1+r/1200)", inputs: [{id:"p", l:"Monthly Inv ($)", v:500}, {id:"r", l:"Return (%)", v:12}, {id:"n", l:"Months", v:120}] },
        { id: "bmi-calc", cat: "Health", name: "BMI Calculator", desc: "Body Mass Index.", unit: " BMI", formula: "w/((h/100)**2)", inputs: [{id:"w", l:"Weight (kg)", v:70}, {id:"h", l:"Height (cm)", v:175}] },
        { id: "profit-margin", cat: "Business", name: "Net Margin", desc: "Profitability %.", unit: "%", formula: "((r-c)/r)*100", inputs: [{id:"r", l:"Total Revenue ($)", v:50000}, {id:"c", l:"Total Expenses ($)", v:32000}] }
    ];

    let currentCat = "Creator";

    function init() {
        renderTabs();
        router();
    }

    function renderTabs() {
        const categories = [...new Set(TOOLS.map(t => t.cat))];
        document.getElementById('tabs').innerHTML = categories.map(cat => 
            `<button class="tab-btn ${cat === currentCat ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>`
        ).join('');
    }

    function setCategory(cat) {
        currentCat = cat;
        renderTabs();
        window.history.pushState({}, '', 'index.html');
        renderHome();
    }

    function renderHome() {
        document.getElementById('tabs').parentElement.parentElement.style.display = 'block';
        const filtered = TOOLS.filter(t => t.cat === currentCat);
        let html = `<div class="grid">`;
        html += filtered.map(t => `
            <a href="?id=${t.id}" class="card">
                <span class="badge">${t.cat}</span>
                <h3>${t.name}</h3>
                <p>${t.desc}</p>
                <div style="color:var(--brand); font-weight:700; font-size:0.8rem; margin-top:auto;">USE TOOL →</div>
            </a>`).join('');
        html += `</div>`;
        document.getElementById('view').innerHTML = html;
    }

    function renderTool(tool) {
        if(!tool) { renderHome(); return; }
        document.getElementById('tabs').parentElement.parentElement.style.display = 'none';
        document.getElementById('view').innerHTML = `
            <div class="calc-main">
                <button onclick="window.location.href='index.html'" class="back-btn">← Back</button>
                <h1>${tool.name}</h1>
                <p style="margin-bottom:30px; color:var(--text-muted)">${tool.desc}</p>
                ${tool.inputs.map(i => `
                    <div class="input-group">
                        <label>${i.l}</label>
                        <input type="number" id="${i.id}" value="${i.v}" oninput="calc()">
                    </div>
                `).join('')}
                <div class="result-box"><p>Result</p><h2 id="res">--</h2></div>
            </div>`;
        window.activeTool = tool;
        calc();
    }

    function calc() {
        const t = window.activeTool;
        let expr = t.formula;
        t.inputs.forEach(i => {
            const val = parseFloat(document.getElementById(i.id).value) || 0;
            expr = expr.replace(new RegExp(`\\b${i.id}\\b`, 'g'), val);
        });
        const result = eval(expr);
        document.getElementById('res').innerText = (t.unit.includes('$') ? '$' : '') + result.toLocaleString() + (!t.unit.includes('$') ? t.unit : '');
    }

    function doSearch() {
        const q = document.getElementById('toolSearch').value.toLowerCase();
        if(q.length > 0) {
            const matches = TOOLS.filter(t => t.name.toLowerCase().includes(q));
            document.getElementById('view').innerHTML = `<div class="grid">${matches.map(t => `<a href="?id=${t.id}" class="card"><h3>${t.name}</h3><p>${t.desc}</p></a>`).join('')}</div>`;
        } else { renderHome(); }
    }

    function router() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const page = params.get('page');
        if(id) { renderTool(TOOLS.find(t => t.id === id)); }
        else if(page) { document.getElementById('view').innerHTML = `<div class="legal-content"><h1>${page.toUpperCase()}</h1><p>Information coming soon.</p></div>`; }
        else { renderHome(); }
    }

    window.onpopstate = router;
    init();
</script>
</body>
</html>
