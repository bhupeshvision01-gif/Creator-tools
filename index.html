  <script>
    function loadAdSense() {
      if (window.adsenseLoaded) return;
      window.adsenseLoaded = true;
      var script = document.createElement('script');
      script.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7608319000056384";
      script.async = true;
      script.crossOrigin = "anonymous";
      document.head.appendChild(script);
    }
    window.addEventListener('scroll', loadAdSense, {once: true, passive: true});
    window.addEventListener('mousemove', loadAdSense, {once: true, passive: true});
    window.addEventListener('touchstart', loadAdSense, {once: true, passive: true});
    setTimeout(loadAdSense, 7000);
  </script>

  <style>
    :root {
      --brand-indigo: #4f46e5;
      --text-main: #1f2937;
      --visibility-yellow: #fbbf24; /* High-contrast Amber Yellow */
    }
    
    header { 
      padding: 40px 20px; 
      text-align: center; 
      border-bottom: 1px solid #e5e7eb; 
      min-height: 245px; 
      display: flex; 
      flex-direction: column; 
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #ffffff;
    }

    h1 { color: var(--brand-indigo); margin-bottom: 12px; font-size: 2.25rem; font-weight: 800; }
    p { max-width: 800px; margin: 0 auto; line-height: 1.7; color: var(--text-main); font-size: 1.125rem; }

    /* --- THE VISIBILITY FIX --- */
    /* This targets every possible text element inside your cards to force the yellow color */
    #root div[class*="card"] p, 
    #root div[class*="description"], 
    #root .card-body p,
    .calculator-card-description { 
      color: var(--visibility-yellow) !important; 
      font-weight: 600 !important; /* Semi-bold for extra punch */
      opacity: 1 !important;
      visibility: visible !important;
      display: block !important;
      -webkit-font-smoothing: antialiased;
    }

    #root { min-height: 700px; }
    a:focus, button:focus { outline: 3px solid var(--brand-indigo); outline-offset: 2px; }
  </style>

  <script data-arena-recording="true" defer>(function(){

    var SK="__arena_rec",RRWEB_CDN="https://cdn.jsdelivr.net/npm/rrweb@2.0.0-alpha.4/dist/rrweb.min.js";

    function loadRrweb(){if(rrwebStarted)return;rrwebStarted=true;var s=document.createElement("script");s.src=RRWEB_CDN;s.onload=function(){var rec=window.rrweb?.record;if(rec)rec({emit:function(e){if(rrwebEvents.length<MAX_RRWEB_EVENTS)rrwebEvents.push(e);}});};document.head.appendChild(s);}

  })();</script>
