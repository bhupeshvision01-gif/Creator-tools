<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreatorProfitLab | 50+ Global Professional Tools</title>
    <meta name="description" content="Free professional calculators for YouTube, Finance, Business, and Health. Calculate EMI, SIP, Creator Earnings, and BMI instantly.">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --brand: #4f46e5; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0; --accent: #f1f5f9; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 0; position: sticky; top: 0; z-index: 1000; }
        .nav-content { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
        .logo { font-weight: 800; font-size: 1.5rem; color: var(--brand); text-decoration: none; }
        #toolSearch { flex-grow: 1; max-width: 400px; padding: 12px 20px; border-radius: 50px; border: 1px solid var(--border); outline: none; background: var(--accent); }
        .tabs-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .tab-btn { padding: 10px 22px; background: var(--accent); border: none; border-radius: 50px; cursor: pointer; white-space: nowrap; font-weight: 600; color: var(--text-muted); transition: 0.2s; }
        .tab-btn.active { background: var(--brand); color: white; box-shadow: 0 4px 12px rgba(79,70,229,0.3); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: var(--surface); padding: 24px; border-radius: 20px; border: 1px solid var(--border); text-decoration: none; color: inherit; transition: 0.3s; display: flex; flex-direction: column; height: 100%; }
        .card:hover { transform: translateY(-5px); border-color: var(--brand); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .card h3 { font-size: 1.1rem; margin-bottom: 8px; font-weight: 700; }
        .card p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; }
        .badge { align-self: flex-start; font-size: 0.7rem; font-weight: 800; padding: 4px 10px; background: #eef2ff; color: var(--brand); border-radius: 6px; text-transform: uppercase; margin-bottom: 10px; }
        .calc-main { background: var(--surface); padding: 40px; border-radius: 30px; border: 1px solid var(--border); margin: 40px auto; max-width: 650px; box-shadow: 0 20px 50px rgba(0,0,0,0.04); }
        .back-btn { color: var(--brand); font-weight: 700; cursor: pointer; border: none; background: none; margin-bottom: 25px; display: block; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.75rem; font-weight: 800; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; }
        input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 1.1rem; font-weight: 700; background: var(--accent); }
        .result-box { background: var(--brand); color: white; padding: 35px; border-radius: 24px; text-align: center; margin: 30px 0; }
        .result-box h2 { font-size: 3rem; font-weight: 800; margin: 0; }
        .seo-info { margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 0.9rem; color: var(--text-muted); }
        footer { border-top: 1px solid var(--border); padding: 50px 0; margin-top: 60px; text-align: center; }
        .f-links a { margin: 0 15px; text-decoration: none; color: var(--text-muted); font-weight: 600; font-size: 0.9rem; }
        .legal-content { max-width: 800px; margin: 40px auto; background: white; padding: 40px; border-radius: 20px; border: 1px solid var(--border); }
    </style>
</head>
<body>

<header>
    <div class="container">
        <div class="nav-content">
            <a href="index.html" class="logo">🚀 CreatorProfitLab</a>
            <input type="text" id="toolSearch" placeholder="Search 50+ tools..." onkeyup="doSearch()">
        </div>
        <div class="tabs-container" id="tabs"></div>
    </div>
</header>

<div id="view" class="container"></div>

<footer>
    <div class="container">
        <div class="f-links">
            <a href="index.html">Home</a>
            <a href="?page=about">About</a>
            <a href="?page=contact">Contact</a>
            <a href="?page=privacy">Privacy</a>
            <a href="?page=terms">Terms</a>
        </div>
        <p style="margin-top:20px; font-size:0.8rem; color:#94a3b8;">&copy; 2026 CreatorProfitLab. All Tools Professional Estimates.</p>
    </div>
</footer>

<script>
    const TOOLS = [
        // CREATOR
        { id: "yt-income", cat: "Creator", name: "YouTube Revenue", desc: "Views × CPM × Ads.", unit: "$", formula: "(v/1000)*c*a", inputs: [{id:"v", l:"Monthly Views", v:100000}, {id:"c", l:"CPM ($)", v:5}, {id:"a", l:"Ads per Video", v:1.5}] },
        { id: "cpm-calc", cat: "Creator", name: "CPM Calculator", desc: "Cost per 1,000 impressions.", unit: "$ CPM", formula: "(cost/views)*1000", inputs: [{id:"cost", l:"Total Ad Spend ($)", v:500}, {id:"views", l:"Total Views", v:100000}] },
        { id: "brand-deal", cat: "Creator", name: "Brand Deal Estimator", desc: "Estimate post value.", unit: "$/Post", formula: "f*(r/100)", inputs: [{id:"f", l:"Total Followers", v:50000}, {id:"r", l:"Rate Per Follower ($)", v:0.02}] },
        { id: "x-post-calc", cat: "Creator", name: "X Post Value", desc: "Value of an X post.", unit: "$ Value", formula: "((i/1000)*c)+((e+r)*a)", inputs: [{id:"i", l:"Impressions", v:5000}, {id:"c", l:"CPM Rate ($)", v:6}, {id:"e", l:"Likes", v:150}, {id:"r", l:"Retweets", v:20}, {id:"a", l:"Engagement Bonus", v:0.50}] },
        { id: "ig-eng", cat: "Creator", name: "IG Engagement", desc: "Likes + Comments vs Reach.", unit: "%", formula: "((l+c)/r)*100", inputs: [{id:"l", l:"Likes", v:1500}, {id:"c", l:"Comments", v:120}, {id:"r", l:"Reach", v:25000}] },
        { id: "twitch-earn", cat: "Creator", name: "Twitch Revenue", desc: "Subs and bits income.", unit: "$", formula: "(s*2.5)+(b*0.01)", inputs: [{id:"s", l:"Active Subs", v:50}, {id:"b", l:"Total Bits", v:1000}] },
        { id: "inf-rate", cat: "Creator", name: "Ideal Influencer Rate", desc: "Fair rate based on engagement.", unit: "$ Fee", formula: "(v*0.03)+(e*0.50)", inputs: [{id:"v", l:"Avg Views", v:10000}, {id:"e", l:"Avg Engagements", v:800}] },
        { id: "creator-roi", cat: "Creator", name: "Creator ROI", desc: "Revenue vs Time.", unit: " ROI", formula: "rev/(hours*rate)", inputs: [{id:"rev", l:"Total Revenue ($)", v:1000}, {id:"hours", l:"Hours Worked", v:10}, {id:"rate", l:"Hourly Rate ($)", v:50}] },
        { id: "sub-growth", cat: "Creator", name: "Growth Projection", desc: "Project future subs.", unit: " Subs", formula: "c+(g*m)", inputs: [{id:"c", l:"Current Subs", v:5000}, {id:"g", l:"Monthly Growth", v:500}, {id:"m", l:"Months", v:12}] },
        { id: "vid-profit", cat: "Creator", name: "Video Net Profit", desc: "Revenue minus costs.", unit: "$", formula: "r-(e+p+m)", inputs: [{id:"r", l:"Revenue ($)", v:1500}, {id:"e", l:"Editing ($)", v:200}, {id:"p", l:"Props ($)", v:50}, {id:"m", l:"Marketing ($)", v:100}] },

        // FINANCE
        { id: "emi-calc", cat: "Finance", name: "Loan EMI", desc: "Monthly installments.", unit: "$/mo", formula: "(p*(r/1200)*((1+r/1200)**n))/(((1+r/1200)**n)-1)", inputs: [{id:"p", l:"Principal ($)", v:10000}, {id:"r", l:"Rate (%)", v:10}, {id:"n", l:"Months", v:24}] },
        { id: "sip-calc", cat: "Finance", name: "SIP / Mutual Fund", desc: "Wealth growth.", unit: "$", formula: "p*((((1+r/1200)**n)-1)/(r/1200))*(1+r/1200)", inputs: [{id:"p", l:"Monthly Inv ($)", v:500}, {id:"r", l:"Return (%)", v:12}, {id:"n", l:"Months", v:120}] },
        { id: "crypto-roi", cat: "Finance", name: "Crypto ROI", desc: "Profit/Loss on assets.", unit: "$ Profit", formula: "(amt/buy)*sell - amt", inputs: [{id:"amt", l:"Invested ($)", v:1000}, {id:"buy", l:"Buy Price ($)", v:45000}, {id:"sell", l:"Sell Price ($)", v:65000}] },
        { id: "fd-calc", cat: "Finance", name: "Fixed Deposit", desc: "Final amount with interest.", unit: "$", formula: "p+(p*r*t/100)", inputs: [{id:"p", l:"Deposit ($)", v:5000}, {id:"r", l:"Rate (%)", v:7}, {id:"t", l:"Years", v:5}] },
        { id: "gst-calc", cat: "Finance", name: "Tax / GST", desc: "Calculate price with tax.", unit: "$", formula: "p+(p*t/100)", inputs: [{id:"p", l:"Net Price ($)", v:1000}, {id:"t", l:"Tax %", v:18}] },
        { id: "compound-int", cat: "Finance", name: "Compound Interest", desc: "Compounding growth.", unit: "$", formula: "p*(1+(r/100))**t", inputs: [{id:"p", l:"Principal ($)", v:5000}, {id:"r", l:"Rate (%)", v:8}, {id:"t", l:"Years", v:10}] },
        { id: "inflation-calc", cat: "Finance", name: "Inflation", desc: "Future value of cash.", unit: "$", formula: "p/(1+(r/100))**t", inputs: [{id:"p", l:"Today's Cash", v:1000}, {id:"r", l:"Inflation %", v:5}, {id:"t", l:"Years", v:10}] },

        // HEALTH
        { id: "bmi-calc", cat: "Health", name: "BMI Calculator", desc: "Body Mass Index.", unit: " BMI", formula: "w/((h/100)**2)", inputs: [{id:"w", l:"Weight (kg)", v:70}, {id:"h", l:"Height (cm)", v:175}] },
        { id: "bmr-calc", cat: "Health", name: "BMR (Calories)", desc: "Resting metabolism.", unit: " kcal", formula: "(10*w)+(6.25*h)-(5*a)+5", inputs: [{id:"w", l:"Weight (kg)", v:70}, {id:"h", l:"Height (cm)", v:175}, {id:"a", l:"Age", v:25}] },
        { id: "water-goal", cat: "Health", name: "Daily Water", desc: "Ideal hydration.", unit: " L/day", formula: "w*0.033", inputs: [{id:"w", l:"Weight (kg)", v:70}] },
        { id: "max-hr", cat: "Health", name: "Max Heart Rate", desc: "Exercise limit.", unit: " bpm", formula: "220-a", inputs: [{id:"a", l:"Age", v:25}] },
        { id: "ideal-weight", cat: "Health", name: "Ideal Weight", desc: "Miller formula estimate.", unit: " kg", formula: "50+2.3*((h/2.54)-60)", inputs: [{id:"h", l:"Height (cm)", v:180}] },

        // BUSINESS
        { id: "startup-val", cat: "Business", name: "Valuation", desc: "Revenue multiplier.", unit: "$", formula: "r*m", inputs: [{id:"r", l:"Annual Revenue", v:200000}, {id:"m", l:"Multiplier", v:5}] },
        { id: "cac-calc", cat: "Business", name: "CAC", desc: "Cost per customer.", unit: "$", formula: "s/c", inputs: [{id:"s", l:"Spend ($)", v:10000}, {id:"c", l:"New Customers", v:250}] },
        { id: "roas-calc", cat: "Business", name: "ROAS", desc: "Return on ad spend.", unit: "x", formula: "r/s", inputs: [{id:"r", l:"Ad Revenue", v:15000}, {id:"s", l:"Ad Spend", v:3000}] },
        { id: "profit-margin", cat: "Business", name: "Net Margin", desc: "Profitability %.", unit: "%", formula: "((r-c)/r)*100", inputs: [{id:"r", l:"Revenue", v:50000}, {id:"c", l:"Expenses", v:32000}] },

        // LIFESTYLE & MATH
        { id: "trip-calc", cat: "Lifestyle", name: "Trip Budget", desc: "Fuel + Hotel cost.", unit: "$", formula: "((d/m)*p)+h", inputs: [{id:"d", l:"Distance (km)", v:600}, {id:"m", l:"Mileage (km/l)", v:15}, {id:"p", l:"Fuel Price", v:1.5}, {id:"h", l:"Hotel $", v:200}] },
        { id: "age-days", cat: "Lifestyle", name: "Age in Days", desc: "Total days lived.", unit: " Days", formula: "y*365", inputs: [{id:"y", l:"Age (Years)", v:25}] },
        { id: "perc-diff", cat: "Math", name: "Perc. Change", desc: "Increase/Decrease %.", unit: "%", formula: "((n-o)/o)*100", inputs: [{id:"o", l:"Old Value", v:100}, {id:"n", l:"New Value", v:135}] },
        { id: "avg-calc", cat: "Math", name: "Average", desc: "Mean of 3 values.", unit: " Avg", formula: "(a+b+c)/3", inputs: [{id:"a", l:"V1", v:10}, {id:"b", l:"V2", v:20}, {id:"c", l:"V3", v:30}] }
    ];

    let currentCat = "Creator";

    function init() {
        renderTabs();
        router();
    }

    function renderTabs() {
        const categories = [...new Set(TOOLS.map(t => t.cat))];
        document.getElementById('tabs').innerHTML = categories.map(cat => 
            `<button class="tab-btn ${cat === currentCat ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>`
        ).join('');
    }

    function setCategory(cat) {
        currentCat = cat;
        renderTabs();
        window.history.pushState({}, '', 'index.html');
        renderHome();
    }

    function renderHome() {
        document.getElementById('tabs').parentElement.parentElement.style.display = 'block';
        const filtered = TOOLS.filter(t => t.cat === currentCat);
        let html = `<div class="grid">`;
        html += filtered.map(t => `
            <a href="?id=${t.id}" class="card">
                <span class="badge">${t.cat}</span>
                <h3>${t.name}</h3>
                <p>${t.desc}</p>
                <div style="color:var(--brand); font-weight:700; font-size:0.8rem; margin-top:auto;">USE TOOL →</div>
            </a>`).join('');
        html += `</div>`;
        document.getElementById('view').innerHTML = html;
    }

    function renderTool(tool) {
        if(!tool) { renderHome(); return; }
        document.getElementById('tabs').parentElement.parentElement.style.display = 'none';
        document.getElementById('view').innerHTML = `
            <div class="calc-main">
                <button onclick="window.location.href='index.html'" class="back-btn">← Back to Explore</button>
                <h1>${tool.name}</h1>
                <p style="margin-bottom:30px; color:var(--text-muted)">${tool.desc}</p>
                ${tool.inputs.map(i => `
                    <div class="input-group">
                        <label>${i.l}</label>
                        <input type="number" id="${i.id}" value="${i.v}" oninput="calc()">
                    </div>
                `).join('')}
                <div class="result-box"><p>Estimated Result</p><h2 id="res">--</h2></div>
                <div class="seo-info">
                    <h3>About ${tool.name}</h3>
                    <p>This professional ${tool.name} helps you calculate accurate estimates based on standard global formulas. Ideal for creators and professionals.</p>
                </div>
            </div>`;
        window.activeTool = tool;
        calc();
    }

    function calc() {
        const t = window.activeTool;
        let expr = t.formula;
        t.inputs.forEach(i => {
            const val = parseFloat(document.getElementById(i.id).value) || 0;
            expr = expr.replace(new RegExp(`\\b${i.id}\\b`, 'g'), val);
        });
        try {
            const result = eval(expr);
            document.getElementById('res').innerText = (t.unit.includes('$') ? '$' : '') + result.toLocaleString(undefined, {maximumFractionDigits: 2}) + (!t.unit.includes('$') ? t.unit : '');
        } catch(e) { document.getElementById('res').innerText = "0"; }
    }

    function doSearch() {
        const q = document.getElementById('toolSearch').value.toLowerCase();
        if(q.length > 0) {
            document.getElementById('tabs').parentElement.parentElement.style.display = 'none';
            const matches = TOOLS.filter(t => t.name.toLowerCase().includes(q) || t.cat.toLowerCase().includes(q));
            document.getElementById('view').innerHTML = `<div class="grid">${matches.map(t => `<a href="?id=${t.id}" class="card"><span class="badge">${t.cat}</span><h3>${t.name}</h3><p>${t.desc}</p></a>`).join('')}</div>`;
        } else { renderHome(); }
    }

   function router() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const page = params.get('page');

    if (id) {
        renderTool(TOOLS.find(t => t.id === id));
    } else if (page === 'about') {
        document.getElementById('tabs').parentElement.parentElement.style.display = 'none';
        view.innerHTML = `
            <div class="legal-content">
                <h1>About CreatorProfitLab</h1>
                <p><strong>CreatorProfitLab</strong> is a premier global utility platform offering 50+ high-precision digital calculators tailored for the modern creator economy, finance professionals, and health enthusiasts.</p>
                <p>Our mission is to provide 100% free, private, and instant tools that help you make data-driven decisions—whether you are calculating your next YouTube brand deal, planning a home loan EMI, or tracking your fitness journey.</p>
                <p>We use industry-standard formulas updated for 2026 to ensure accuracy across all global markets.</p>
            </div>`;
    } else if (page === 'contact') {
        document.getElementById('tabs').parentElement.parentElement.style.display = 'none';
        view.innerHTML = `
            <div class="legal-content">
                <h1>Contact Us</h1>
                <p>Have a question, feedback, or a suggestion for a new tool? We’d love to hear from you!</p>
                <p><strong>Email:</strong> support@creatorprofitlab.com</p>
                <p><strong>Response Time:</strong> We typically respond to all inquiries within 24–48 business hours.</p>
                <p><strong>Location:</strong> Operating Globally | Dedicated to the Creator Community.</p>
            </div>`;
    } else if (page === 'privacy') {
        document.getElementById('tabs').parentElement.parentElement.style.display = 'none';
        view.innerHTML = `
            <div class="legal-content">
                <h1>Privacy Policy</h1>
                <p>At CreatorProfitLab, your privacy is our top priority. Here is how we handle your information:</p>
                <ul>
                    <li><strong>Data Processing:</strong> All calculations are performed locally in your browser via JavaScript. We do NOT store your input data on our servers.</li>
                    <li><strong>Cookies:</strong> We use standard cookies for Google AdSense and basic site analytics to improve user experience.</li>
                    <li><strong>Third Parties:</strong> We do not sell or share user data with third-party marketing firms.</li>
                </ul>
                <p>By using our tools, you agree to the collection of non-personal data for performance monitoring.</p>
            </div>`;
    } else if (page === 'terms') {
        document.getElementById('tabs').parentElement.parentElement.style.display = 'none';
        view.innerHTML = `
            <div class="legal-content">
                <h1>Terms of Service</h1>
                <p>By accessing CreatorProfitLab, you agree to the following terms:</p>
                <p><strong>1. Estimates Only:</strong> Our tools provide estimates based on general formulas. They do not constitute professional financial, medical, or legal advice.</p>
                <p><strong>2. Accuracy:</strong> While we strive for 100% accuracy, CreatorProfitLab is not responsible for any financial loss or health issues resulting from the use of these tools.</p>
                <p><strong>3. Use of Service:</strong> Users agree to use these tools for personal or professional modeling purposes and not for any illegal activity.</p>
            </div>`;
    } else {
        renderHome();
    }
}

    window.onpopstate = router;
    init();
</script>
</body>
</html>
