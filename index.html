<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreatorProfitLab | 100+ Free Revenue & Financial Calculators</title>
    <meta name="description" content="The ultimate toolkit for digital creators and entrepreneurs. Calculate YouTube earnings, SIP growth, EMI, and business margins instantly.">
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --brand: #4f46e5; 
            --bg: #f8fafc; 
            --surface: #ffffff; 
            --text: #0f172a; 
            --text-muted: #64748b; 
            --border: #e2e8f0; 
            --accent: #f1f5f9; 
            --nav-bg: rgba(255, 255, 255, 0.8);
        }

        /* Dark Mode Theme */
        [data-theme="dark"] {
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --accent: #0f172a;
            --nav-bg: rgba(30, 41, 59, 0.8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s, border-color 0.3s; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; overflow-x: hidden; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        /* Header & Navigation */
        header { background: var(--nav-bg); border-bottom: 1px solid var(--border); padding: 1rem 0; position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(10px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .nav-content { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .logo { font-weight: 800; font-size: 1.4rem; color: var(--brand); text-decoration: none; letter-spacing: -0.5px; }
        .search-box { flex-grow: 1; max-width: 350px; position: relative; }
        #toolSearch { width: 100%; padding: 12px 20px; border-radius: 50px; border: 1px solid var(--border); background: var(--accent); color: var(--text); outline: none; font-family: inherit; }
        
        .header-controls { display: flex; gap: 10px; align-items: center; }
        .header-select { background: var(--brand); color: white; border: none; padding: 10px 12px; border-radius: 50px; cursor: pointer; font-weight: 700; font-size: 0.8rem; outline: none; }
        .theme-toggle { background: var(--accent); color: var(--text); border: 1px solid var(--border); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }

        /* Category Tabs */
        .tabs-wrapper { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 0; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
        .tabs-wrapper::-webkit-scrollbar { display: none; }
        .tab-btn { padding: 8px 20px; margin-right: 8px; border: none; background: transparent; cursor: pointer; font-weight: 600; color: var(--text-muted); border-radius: 50px; }
        .tab-btn.active { background: #eef2ff; color: var(--brand); }
        [data-theme="dark"] .tab-btn.active { background: var(--brand); color: white; }

        /* Grid System */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin: 30px 0; }
        .card { background: var(--surface); padding: 24px; border-radius: 20px; border: 1px solid var(--border); text-decoration: none; color: inherit; transition: 0.3s; height: 100%; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(0,0,0,0.06); border-color: var(--brand); }
        .card h3 { font-size: 1.1rem; margin-bottom: 8px; }
        .card p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; flex-grow: 1; }
        .badge { font-size: 0.65rem; font-weight: 800; padding: 4px 10px; background: var(--accent); color: var(--brand); border-radius: 6px; text-transform: uppercase; margin-bottom: 10px; display: inline-block; }

        /* Calculator UI */
        .calc-container { max-width: 800px; margin: 40px auto; background: var(--surface); border-radius: 30px; border: 1px solid var(--border); padding: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.03); }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 25px 0; }
        .input-group label { display: block; font-size: 0.75rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--accent); color: var(--text); font-size: 1.1rem; font-weight: 700; }
        
        .result-panel { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; padding: 40px; border-radius: 24px; text-align: center; margin-top: 30px; }
        .result-value { font-size: 3rem; font-weight: 800; margin-bottom: 5px; }
        .result-label { text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1.5px; opacity: 0.8; }

        footer { text-align: center; padding: 60px 0; border-top: 1px solid var(--border); margin-top: 40px; color: var(--text-muted); font-size: 0.9rem; }

        @media (max-width: 800px) { 
            .nav-content { flex-wrap: wrap; justify-content: center; }
            .search-box { order: 3; max-width: 100%; width: 100%; }
        }
        @media (max-width: 600px) { .input-grid { grid-template-columns: 1fr; } .result-value { font-size: 2rem; } }
    </style>
</head>
<body onload="init()">

<header>
    <div class="container">
        <div class="nav-content">
            <a href="#" class="logo" onclick="navigate('')">🚀 CreatorProfitLab</a>
            <div class="search-box">
                <input type="text" id="toolSearch" placeholder="Search 100+ calculators..." onkeyup="doSearch()">
            </div>
            <div class="header-controls">
                <select class="header-select" id="currencySelect" onchange="updateCurrency()">
                    <option value="USD">$ USD</option>
                    <option value="INR">₹ INR</option>
                    <option value="GBP">£ GBP</option>
                    <option value="EUR">€ EUR</option>
                </select>
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌓</button>
            </div>
        </div>
    </div>
</header>

<div class="tabs-wrapper">
    <div class="container" id="categoryTabs"></div>
</div>

<main class="container" id="mainView"></main>

<footer>
    <div class="container">
        <p>&copy; 2026 CreatorProfitLab. Tools updated for 2026 Algorithms.</p>
        <div style="margin-top:10px;">
            <a href="#" style="margin:0 10px; color:var(--text-muted); text-decoration:none;">Privacy</a>
            <a href="#" style="margin:0 10px; color:var(--text-muted); text-decoration:none;">Terms</a>
        </div>
    </div>
</footer>

<script>
    // --- THE DATA ENGINE ---
    const TOOLS = [
        { id: 'yt-revenue', cat: 'Creator', name: 'YouTube AdSense', desc: 'Predict monthly earnings based on CPM and views.', unit: 'currency', formula: '(v/1000)*c*a', inputs: [{id:'v', l:'Monthly Views', v:100000}, {id:'c', l:'Avg CPM ($)', v:5}, {id:'a', l:'Ads per Video', v:1.5}] },
        { id: 'shorts-fund', cat: 'Creator', name: 'Shorts Revenue', desc: 'Estimate RPM earnings for short-form content.', unit: 'currency', formula: '(v/1000)*r', inputs: [{id:'v', l:'Total Views', v:1000000}, {id:'r', l:'RPM Rate ($)', v:0.06}] },
        { id: 'brand-deal', cat: 'Creator', name: 'Sponsorship Rate', desc: 'Calculate what to charge brands for a post.', unit: 'currency', formula: '(v*0.025)+(e*0.5)', inputs: [{id:'v', l:'Avg Views', v:20000}, {id:'e', l:'Avg Engagement', v:1000}] },
        { id: 'tiktok-calc', cat: 'Creator', name: 'TikTok Rewards', desc: 'Project payouts from the Creator Rewards program.', unit: 'currency', formula: '(v/1000)*0.4', inputs: [{id:'v', l:'Qualified Views', v:500000}] },
        { id: 'ig-eng', cat: 'Creator', name: 'Insta Engagement', desc: 'Check your real engagement percentage.', unit: '%', formula: '((l+c)/r)*100', inputs: [{id:'l', l:'Likes', v:1500}, {id:'c', l:'Comments', v:120}, {id:'r', l:'Reach', v:25000}] },
        { id: 'sip-calc', cat: 'Finance', name: 'SIP Wealth', desc: 'Calculate returns on Monthly Mutual Fund investments.', unit: 'currency', formula: 'p*((((1+r/1200)**n)-1)/(r/1200))*(1+r/1200)', inputs: [{id:'p', l:'Monthly SIP', v:5000}, {id:'r', l:'Return (%)', v:12}, {id:'n', l:'Months', v:120}] },
        { id: 'emi-calc', cat: 'Finance', name: 'Loan EMI', desc: 'Calculate monthly payments for Home/Car loans.', unit: 'currency', formula: '(p*(r/1200)*((1+r/1200)**n))/(((1+r/1200)**n)-1)', inputs: [{id:'p', l:'Loan Amount', v:1000000}, {id:'r', l:'Interest %', v:9}, {id:'n', l:'Months', v:60}] },
        { id: 'gst-calc', cat: 'Finance', name: 'GST Calculator', desc: 'Quickly add or remove GST (India).', unit: 'currency', formula: 'p+(p*t/100)', inputs: [{id:'p', l:'Net Amount', v:10000}, {id:'t', l:'Tax Rate %', v:18}] },
        { id: 'fd-returns', cat: 'Finance', name: 'Fixed Deposit', desc: 'Bank FD returns with maturity value.', unit: 'currency', formula: 'p+(p*r*t/100)', inputs: [{id:'p', l:'Principal', v:100000}, {id:'r', l:'Rate %', v:7}, {id:'t', l:'Years', v:5}] },
        { id: 'ppf-calc', cat: 'Finance', name: 'PPF Growth', desc: 'Long-term Public Provident Fund estimation.', unit: 'currency', formula: 'p*(((1+0.071)**n-1)/0.071)', inputs: [{id:'p', l:'Annual Deposit', v:150000}, {id:'n', l:'Years', v:15}] },
        { id: 'roas', cat: 'Marketing', name: 'ROAS Calc', desc: 'Return on Ad Spend efficiency tracker.', unit: 'x', formula: 'r/s', inputs: [{id:'r', l:'Ad Revenue', v:5000}, {id:'s', l:'Ad Spend', v:1000}] },
        { id: 'cac', cat: 'Marketing', name: 'Customer Cost', desc: 'Average cost to acquire one new lead.', unit: 'currency', formula: 's/c', inputs: [{id:'s', l:'Total Spend', v:2000}, {id:'c', l:'New Customers', v:40}] },
        { id: 'margin', cat: 'Marketing', name: 'Profit Margin', desc: 'Calculate net percentage profit.', unit: '%', formula: '((r-c)/r)*100', inputs: [{id:'r', l:'Total Sales', v:50000}, {id:'c', l:'Total Cost', v:35000}] },
        { id: 'bmi', cat: 'Health', name: 'BMI Checker', desc: 'Body Mass Index health assessment.', unit: ' BMI', formula: 'w/((h/100)**2)', inputs: [{id:'w', l:'Weight (kg)', v:70}, {id:'h', l:'Height (cm)', v:175}] },
        { id: 'water', cat: 'Health', name: 'Water Intake', desc: 'Daily hydration needs based on weight.', unit: ' Liters', formula: 'w*0.033', inputs: [{id:'w', l:'Weight (kg)', v:70}] },
        { id: 'percentage', cat: 'Utility', name: 'Percentage Calc', desc: 'Calculate X% of Y instantly.', unit: '', formula: '(p/100)*v', inputs: [{id:'p', l:'Percent %', v:15}, {id:'v', l:'Value', v:5000}] }
    ];

    let currentCat = "Creator";
    
    // Currency State
    const currencyConfig = {
        USD: { symbol: '$', rate: 1, locale: 'en-US' },
        INR: { symbol: '₹', rate: 83.5, locale: 'en-IN' },
        GBP: { symbol: '£', rate: 0.79, locale: 'en-GB' },
        EUR: { symbol: '€', rate: 0.92, locale: 'de-DE' }
    };
    let activeCurrency = 'USD';

    const mainView = document.getElementById('mainView');

    function init() {
        // Load theme preference
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        
        renderCategories();
        router();
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
    }

    function updateCurrency() {
        activeCurrency = document.getElementById('currencySelect').value;
        if(window.activeTool) calculate();
        else renderGrid();
    }

    function renderCategories() {
        const cats = [...new Set(TOOLS.map(t => t.cat))];
        document.getElementById('categoryTabs').innerHTML = cats.map(c => 
            `<button class="tab-btn ${c === currentCat ? 'active' : ''}" onclick="setCat('${c}')">${c}</button>`
        ).join('');
    }

    function setCat(c) {
        currentCat = c;
        renderCategories();
        navigate('');
    }

    function navigate(q) {
        window.history.pushState({}, '', q ? '?' + q : window.location.pathname);
        router();
    }

    function router() {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        if(id) {
            renderTool(TOOLS.find(t => t.id === id));
        } else {
            renderGrid();
        }
    }

    function renderGrid() {
        const list = TOOLS.filter(t => t.cat === currentCat);
        mainView.innerHTML = `<div class="grid">${list.map(t => `
            <a href="?id=${t.id}" class="card" onclick="event.preventDefault(); navigate('id=${t.id}')">
                <span class="badge">${t.cat}</span>
                <h3>${t.name}</h3>
                <p>${t.desc}</p>
                <div style="color:var(--brand); font-weight:800; font-size:0.75rem;">OPEN CALCULATOR →</div>
            </a>
        `).join('')}</div>`;
    }

    function renderTool(tool) {
        if(!tool) return navigate('');
        window.activeTool = tool;
        mainView.innerHTML = `
            <div class="calc-container">
                <a href="#" onclick="event.preventDefault(); navigate('')" style="color:var(--brand); text-decoration:none; font-weight:700; font-size:0.8rem;">← BACK TO ${tool.cat.toUpperCase()}</a>
                <h1 style="margin-top:15px;">${tool.name}</h1>
                <p style="color:var(--text-muted); margin-bottom:20px;">${tool.desc}</p>
                <div class="input-grid">
                    ${tool.inputs.map(i => `
                        <div class="input-group">
                            <label>${i.l}</label>
                            <input type="number" id="${i.id}" value="${i.v}" oninput="calculate()">
                        </div>
                    `).join('')}
                </div>
                <div class="result-panel">
                    <p class="result-label">Calculated Result</p>
                    <div class="result-value" id="resValue">--</div>
                </div>
            </div>`;
        calculate();
    }

    function calculate() {
        const t = window.activeTool;
        let expression = t.formula;
        t.inputs.forEach(i => {
            const val = parseFloat(document.getElementById(i.id).value) || 0;
            expression = expression.replace(new RegExp(`\\b${i.id}\\b`, 'g'), val);
        });
        
        try {
            let result = eval(expression);
            const conf = currencyConfig[activeCurrency];
            
            if(t.unit === 'currency') result *= conf.rate;
            
            const format = result.toLocaleString(conf.locale, { maximumFractionDigits: 2 });
            let prefix = t.unit === 'currency' ? conf.symbol : "";
            
            document.getElementById('resValue').innerText = prefix + format + (t.unit !== 'currency' ? t.unit : '');
        } catch(e) { console.error(e); }
    }

    function doSearch() {
        const q = document.getElementById('toolSearch').value.toLowerCase();
        if(!q) return renderGrid();
        const matches = TOOLS.filter(t => t.name.toLowerCase().includes(q) || t.cat.toLowerCase().includes(q));
        mainView.innerHTML = `<div class="grid">${matches.map(t => `
            <a href="?id=${t.id}" class="card" onclick="event.preventDefault(); navigate('id=${t.id}')">
                <span class="badge">${t.cat}</span>
                <h3>${t.name}</h3>
                <p>${t.desc}</p>
            </a>
        `).join('')}</div>`;
    }

    window.onpopstate = router;
</script>

</body>
</html>
