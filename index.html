<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="meta-title">CreatorProfitLab | 100+ Tools & Expert Guides 2026</title>
    <meta name="description" id="meta-desc" content="Elite toolkit and guides for the creator economy. Professional calculators and SEO blogs for YouTube, Finance, and Business.">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lexend:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --brand: #4f46e5; --brand-dark: #3730a3; --bg: #f8fafc; --card: #fff; --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.6; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

        header { background: #fff; border-bottom: 1px solid var(--border); padding: 15px 0; position: sticky; top: 0; z-index: 100; }
        .nav-flex { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Lexend', sans-serif; font-size: 1.5rem; color: var(--brand); cursor: pointer; text-decoration: none; font-weight: 800; }
        #toolSearch { width: 100%; max-width: 400px; padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border); outline: none; }

        #hero-wrapper { text-align: center; padding: 60px 0 40px; background: radial-gradient(circle at top, #eef2ff 0%, #f8fafc 100%); }
        h1 { font-family: 'Lexend', sans-serif; font-size: 2.5rem; margin-bottom: 10px; }

        .tabs { display: flex; justify-content: center; gap: 10px; margin: 20px 0 40px; flex-wrap: wrap; }
        .tab { padding: 8px 18px; border-radius: 20px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-weight: 600; color: var(--text-muted); }
        .tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 25px; border-radius: 16px; cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--brand); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .card-cat { font-size: 0.7rem; text-transform: uppercase; font-weight: 800; color: var(--brand); margin-bottom: 5px; }

        .content-area { max-width: 800px; margin: 40px auto; background: #fff; padding: 40px; border-radius: 24px; border: 1px solid var(--border); }
        .blog-body h2 { margin: 25px 0 15px; font-family: 'Lexend', sans-serif; }
        .blog-body p { margin-bottom: 15px; color: #444; }
        .calc-link-box { background: #f5f3ff; border: 1px dashed var(--brand); padding: 20px; border-radius: 12px; margin: 20px 0; }
        
        /* Calculator Specific */
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 1.1rem; }
        .result-box { background: #4f46e5; color: #fff; padding: 30px; border-radius: 12px; text-align: center; margin: 30px 0; }
        .result-box h2 { font-size: 3rem; color: #fff; }

        footer { border-top: 1px solid var(--border); padding: 40px 0; margin-top: 60px; text-align: center; }
        .section-title { font-family: 'Lexend', sans-serif; margin: 40px 0 20px; font-size: 1.8rem; }
    </style>
</head>
<body>

<header>
    <div class="container nav-flex">
        <a href="/" class="logo" onclick="event.preventDefault(); resetHome();">CreatorProfitLab.</a>
        <input type="text" id="toolSearch" placeholder="Search tools or blogs..." oninput="doSearch()">
        <div style="font-weight: 700; color: var(--brand);">SEO HUB</div>
    </div>
</header>

<main id="app">
    <section id="hero-wrapper">
        <div class="container">
            <h1>Expert Tools & Growth Guides.</h1>
            <p>Master the creator economy with 100+ calculators and SEO-backed insights.</p>
            <div class="tabs">
                <button class="tab active" onclick="setView('All', this)">All</button>
                <button class="tab" onclick="setView('Calculator', this)">Calculators</button>
                <button class="tab" onclick="setView('Blog', this)">SEO Guides</button>
            </div>
        </div>
    </section>

    <div class="container" id="main-view">
        </div>
</main>

<footer>
    <div class="container">
        <p>&copy; 2026 CreatorProfitLab. Optimized for AdSense & Search Traffic.</p>
    </div>
</footer>

<script>
    // --- DATA: TOOLS ---
    const TOOLS = [
        { id: 'yt-revenue', name: 'YouTube Revenue Calculator', cat: 'Creator', desc: 'Calculate net earnings after the 45% cut.', formula: 'Views * (CPM/1000) * 0.55', inputs: [{l:'Monthly Views', v:100000, id:'v'}, {l:'CPM ($)', v:4, id:'cpm'}] },
        { id: 'emi-calc', name: 'Loan EMI Calculator', cat: 'Finance', desc: 'Calculate monthly loan installments.', formula: 'Amortization Logic', inputs: [{l:'Principal', v:10000, id:'p'}, {l:'Rate %', v:8, id:'r'}, {l:'Years', v:5, id:'n'}] },
        { id: 'bmi-calc', name: 'BMI Calculator', cat: 'Health', desc: 'Check your Body Mass Index.', formula: 'Weight / Height^2', inputs: [{l:'Weight (kg)', v:70, id:'w'}, {l:'Height (cm)', v:175, id:'h'}] }
    ];

    // --- DATA: BLOGS ---
    const BLOGS = [
        { 
            id: 'how-much-youtube-pays', 
            title: 'How Much YouTube Pays Per 1000 Views', 
            cat: 'Creator',
            excerpt: 'The definitive guide to YouTube CPM, RPM, and take-home pay in 2026.',
            content: `
                <h2>The Short Answer</h2>
                <p>On average, YouTube pays between $2 and $12 per 1000 views. However, this depends entirely on your niche and viewer location.</p>
                <div class="calc-link-box">
                    <strong>Try the Tool:</strong> <a href="?id=yt-revenue">YouTube Revenue Calculator</a>
                </div>
                <h2>CPM vs RPM</h2>
                <p>CPM is what advertisers pay; RPM is what you actually keep. Our calculators help you distinguish the two instantly.</p>
                <h3>Example Calculation</h3>
                <p>If you have 100,000 views and a $5 CPM, the total ad spend is $500. After YouTube's 45% cut, you earn $275.</p>
            `
        },
        {
            id: 'compound-interest-explained',
            title: 'Compound Interest: The 8th Wonder',
            cat: 'Finance',
            excerpt: 'How to grow your wealth exponentially using the power of compounding.',
            content: `
                <h2>How it Works</h2>
                <p>Unlike simple interest, compound interest calculates gain on both your principal and previous interest.</p>
                <div class="calc-link-box">
                    <strong>Recommended:</strong> <a href="?id=emi-calc">Loan & Interest Calculator</a>
                </div>
                <h2>The 2026 Strategy</h2>
                <p>Starting early is more important than the amount you invest. Even a small monthly SIP can grow into millions.</p>
            `
        }
    ];

    let currentTab = "All";

    window.onload = () => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('id')) {
            showTool(TOOLS.find(t => t.id === params.get('id')));
        } else if (params.get('blog')) {
            showBlog(BLOGS.find(b => b.id === params.get('blog')));
        } else {
            renderHome();
        }
    };

    function renderHome() {
        const view = document.getElementById('main-view');
        let html = '';

        if (currentTab === "All" || currentTab === "Calculator") {
            html += `<h2 class="section-title">Popular Calculators</h2><div class="grid">`;
            TOOLS.forEach(t => {
                html += `<div class="card" onclick="showToolById('${t.id}')"><div class="card-cat">${t.cat} Tool</div><h3>${t.name}</h3><p>${t.desc}</p></div>`;
            });
            html += `</div>`;
        }

        if (currentTab === "All" || currentTab === "Blog") {
            html += `<h2 class="section-title">Latest SEO Guides</h2><div class="grid">`;
            BLOGS.forEach(b => {
                html += `<div class="card" onclick="showBlogById('${b.id}')" style="border-left: 5px solid var(--brand);">
                    <div class="card-cat">${b.cat} Blog</div><h3>${b.title}</h3><p>${b.excerpt}</p>
                </div>`;
            });
            html += `</div>`;
        }
        view.innerHTML = html;
        document.getElementById('hero-wrapper').style.display = 'block';
    }

    function showToolById(id) { showTool(TOOLS.find(t => t.id === id)); }
    function showBlogById(id) { showBlog(BLOGS.find(b => b.id === id)); }

    function showTool(t) {
        if (!t) return;
        window.history.pushState({}, '', `?id=${t.id}`);
        document.getElementById('hero-wrapper').style.display = 'none';
        const view = document.getElementById('main-view');
        view.innerHTML = `
            <div class="content-area">
                <button onclick="resetHome()" style="background:none; border:none; color:var(--brand); cursor:pointer; font-weight:700;">← Back to Hub</button>
                <h1 style="margin-top:20px;">${t.name}</h1>
                ${t.inputs.map(i => `
                    <div class="input-group">
                        <label>${i.l}</label>
                        <input type="number" id="${i.id}" value="${i.v}" oninput="runCalc()">
                    </div>
                `).join('')}
                <div class="result-box"><small>ESTIMATED TOTAL</small><h2 id="res">--</h2></div>
                <div class="blog-body"><h3>Methodology</h3><p>Calculated using the standard formula: ${t.formula}</p></div>
            </div>`;
        window.activeTool = t;
        runCalc();
    }

    function showBlog(b) {
        if (!b) return;
        window.history.pushState({}, '', `?blog=${b.id}`);
        document.getElementById('hero-wrapper').style.display = 'none';
        const view = document.getElementById('main-view');
        view.innerHTML = `
            <div class="content-area">
                <button onclick="resetHome()" style="background:none; border:none; color:var(--brand); cursor:pointer; font-weight:700;">← Back to Hub</button>
                <h1 style="margin-top:20px;">${b.title}</h1>
                <div class="blog-body">${b.content}</div>
            </div>`;
    }

    function runCalc() {
        const t = window.activeTool;
        const get = (id) => parseFloat(document.getElementById(id).value) || 0;
        let r = 0;
        if (t.id === 'yt-revenue') r = get('v') * (get('cpm')/1000) * 0.55;
        if (t.id === 'emi-calc') {
            let int = get('r')/12/100; let n = get('n')*12;
            r = (get('p') * int * Math.pow(1+int, n)) / (Math.pow(1+int, n) - 1);
        }
        if (t.id === 'bmi-calc') r = get('w') / ((get('h')/100)**2);
        document.getElementById('res').innerText = r.toLocaleString(undefined, {maximumFractionDigits: 2});
    }

    function setView(view, btn) {
        currentTab = view;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        renderHome();
    }

    function resetHome() {
        window.history.pushState({}, '', '/');
        renderHome();
    }

    function doSearch() {
        const q = document.getElementById('toolSearch').value.toLowerCase();
        if (!q) { renderHome(); return; }
        document.getElementById('hero-wrapper').style.display = 'none';
        const tRes = TOOLS.filter(t => t.name.toLowerCase().includes(q));
        const bRes = BLOGS.filter(b => b.title.toLowerCase().includes(q));
        
        let html = `<h2 class="section-title">Search Results</h2><div class="grid">`;
        tRes.forEach(t => html += `<div class="card" onclick="showToolById('${t.id}')"><h3>${t.name}</h3></div>`);
        bRes.forEach(b => html += `<div class="card" onclick="showBlogById('${b.id}')" style="border-left:5px solid var(--brand)"><h3>${b.title}</h3></div>`);
        html += `</div>`;
        document.getElementById('main-view').innerHTML = html;
    }
</script>
</body>
</html>
