<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreatorProfitLab | 50+ Global Business & Creator Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand: #4f46e5; --bg: #f8fafc; --surface: #ffffff; 
            --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        /* Nav */
        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
        .nav-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.4rem; color: var(--brand); text-decoration: none; }
        #toolSearch { width: 320px; padding: 12px 20px; border-radius: 50px; border: 1px solid var(--border); outline: none; }

        /* Categories */
        .cat-section { margin-bottom: 50px; }
        .cat-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        .cat-header h2 { font-size: 1.5rem; font-weight: 800; }
        
        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--surface); padding: 22px; border-radius: 16px; border: 1px solid var(--border); text-decoration: none; color: inherit; transition: 0.3s; height: 100%; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-3px); border-color: var(--brand); box-shadow: 0 10px 20px rgba(0,0,0,0.04); }
        .card h3 { font-size: 1.05rem; margin-bottom: 8px; font-weight: 700; }
        .card p { font-size: 0.85rem; color: var(--text-muted); flex-grow: 1; }

        /* Calc Layout */
        .calc-main { background: var(--surface); padding: 40px; border-radius: 24px; border: 1px solid var(--border); margin-top: 30px; }
        .input-group { margin-bottom: 18px; }
        label { display: block; font-size: 0.7rem; font-weight: 800; margin-bottom: 5px; color: var(--text-muted); text-transform: uppercase; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 1.1rem; font-weight: 700; }
        
        .result-box { background: var(--brand); color: white; padding: 30px; border-radius: 20px; text-align: center; margin: 25px 0; }
        .result-box h2 { font-size: 3rem; font-weight: 800; margin: 0; }
    </style>
</head>
<body>

<header>
    <div class="container nav-content">
        <a href="index.html" class="logo">🚀 CreatorProfitLab</a>
        <input type="text" id="toolSearch" placeholder="Search 50+ USD tools..." onkeyup="doSearch()">
    </div>
</header>

<div id="view" class="container"></div>

<script>
    const TOOLS = [
        // 1. CREATOR ECONOMY
        { id: "yt-income", cat: "1️⃣ Creator Economy", name: "YouTube Income", desc: "Views × CPM × Ads.", unit: "$", formula: "(v/1000)*c*a", inputs: [{id:"v", l:"Monthly Views", v:100000}, {id:"c", l:"CPM ($)", v:5}, {id:"a", l:"Ads per Video", v:1.5}] },
        { id: "ig-eng", cat: "1️⃣ Creator Economy", name: "Instagram Engagement", desc: "Likes + Comments / Reach.", unit: "%", formula: "((l+c)/r)*100", inputs: [{id:"l", l:"Likes", v:1200}, {id:"c", l:"Comments", v:80}, {id:"r", l:"Reach", v:20000}] },
        { id: "tk-earn", cat: "1️⃣ Creator Economy", name: "TikTok Earnings", desc: "Creator Fund Revenue.", unit: "$", formula: "(v/1000000)*35", inputs: [{id:"v", l:"Views", v:1000000}] },
        { id: "cpm-calc", cat: "1️⃣ Creator Economy", name: "CPM Calculator", desc: "Ad cost per 1k views.", unit: "$", formula: "(cost/imp)*1000", inputs: [{id:"cost", l:"Spend ($)", v:500}, {id:"imp", l:"Impressions", v:100000}] },
        { id: "aff-income", cat: "1️⃣ Creator Economy", name: "Affiliate Income", desc: "Clicks to Commissions.", unit: "$", formula: "cl*(cr/100)*com", inputs: [{id:"cl", l:"Clicks", v:5000}, {id:"cr", l:"Conv %", v:2}, {id:"com", l:"Commission ($)", v:25}] },
        { id: "brand-deal", cat: "1️⃣ Creator Economy", name: "Brand Deal Calc", desc: "Follower based pricing.", unit: "$", formula: "f*0.02", inputs: [{id:"f", l:"Followers", v:50000}] },
        { id: "creator-roi", cat: "1️⃣ Creator Economy", name: "Creator ROI", desc: "Revenue vs Time/Cost.", unit: "x", formula: "rev/exp", inputs: [{id:"rev", l:"Revenue ($)", v:5000}, {id:"exp", l:"Cost ($)", v:1500}] },
        { id: "sub-growth", cat: "1️⃣ Creator Economy", name: "Subscriber Growth", desc: "Growth projection.", unit: " Subs", formula: "cur + (daily*days)", inputs: [{id:"cur", l:"Current", v:10000}, {id:"daily", l:"Daily Gain", v:50}, {id:"days", l:"Days", v:30}] },
        { id: "vid-profit", cat: "1️⃣ Creator Economy", name: "Video Profit", desc: "Net after production.", unit: "$", formula: "rev - cost", inputs: [{id:"rev", l:"Revenue ($)", v:1200}, {id:"cost", l:"Production ($)", v:400}] },
        { id: "inf-rate", cat: "1️⃣ Creator Economy", name: "Influencer Rate", desc: "Engagement based price.", unit: "$", formula: "(f/1000)*15 + (e*40)", inputs: [{id:"f", l:"Followers", v:20000}, {id:"e", l:"Engagement %", v:4}] },

        
      // 2. FINANCE / MONEY
        { id: "emi-calc", cat: "2️⃣ Finance / Money", name: "EMI Calculator", desc: "Equated Monthly Installment for loans.", unit: "$/mo", formula: "(p*(r/1200)*((1+r/1200)**n))/(((1+r/1200)**n)-1)", inputs: [{id:"p", l:"Loan Principal ($)", v:10000}, {id:"r", l:"Int. Rate (%)", v:10}, {id:"n", l:"Months", v:24}] },

        { id: "home-loan", cat: "2️⃣ Finance / Money", name: "Home Loan Calc", desc: "Long-term mortgage planning.", unit: "$/mo", formula: "(p*(r/1200)*((1+r/1200)**n))/(((1+r/1200)**n)-1)", inputs: [{id:"p", l:"Home Value ($)", v:250000}, {id:"r", l:"Rate (%)", v:7}, {id:"n", l:"Tenure (Months)", v:360}] },

        { id: "personal-loan", cat: "2️⃣ Finance / Money", name: "Personal Loan Calc", desc: "Short-term debt installment.", unit: "$/mo", formula: "(p*(r/1200)*((1+r/1200)**n))/(((1+r/1200)**n)-1)", inputs: [{id:"p", l:"Amount ($)", v:5000}, {id:"r", l:"Rate (%)", v:12}, {id:"n", l:"Months", v:36}] },

        { id: "mortgage-calc", cat: "2️⃣ Finance / Money", name: "Mortgage Calculator", desc: "Includes down payment logic.", unit: "$/mo", formula: "((p-d)*(r/1200)*((1+r/1200)**n))/(((1+r/1200)**n)-1)", inputs: [{id:"p", l:"Home Price ($)", v:300000}, {id:"d", l:"Down Payment ($)", v:60000}, {id:"r", l:"Rate (%)", v:6.5}, {id:"n", l:"Months", v:360}] },

        { id: "compound-calc", cat: "2️⃣ Finance / Money", name: "Compound Interest", desc: "Wealth growth over time.", unit: "$", formula: "p*(1+(r/100))**t", inputs: [{id:"p", l:"Principal ($)", v:1000}, {id:"r", l:"Annual Rate (%)", v:8}, {id:"t", l:"Time (Years)", v:10}] },

        { id: "sip-calc", cat: "2️⃣ Finance / Money", name: "SIP Calculator", desc: "Systematic Investment Plan (Mutual Funds).", unit: "$", formula: "p*((((1+r/1200)**n)-1)/(r/1200))*(1+r/1200)", inputs: [{id:"p", l:"Monthly Inv ($)", v:500}, {id:"r", l:"Expected Return (%)", v:12}, {id:"n", l:"Duration (Months)", v:120}] },

        { id: "fd-calc", cat: "2️⃣ Finance / Money", name: "FD Calculator", desc: "Fixed Deposit maturity value.", unit: "$", formula: "p*(1+(r/400))**(4*(n/12))", inputs: [{id:"p", l:"Deposit ($)", v:10000}, {id:"r", l:"Interest (%)", v:6.5}, {id:"n", l:"Period (Months)", v:12}] },

        { id: "rd-calc", cat: "2️⃣ Finance / Money", name: "RD Calculator", desc: "Recurring Deposit maturity.", unit: "$", formula: "p*((((1+r/400)**(4*n/12))-1)/(1-(1+r/400)**(-1/3)))", inputs: [{id:"p", l:"Monthly Deposit ($)", v:2000}, {id:"r", l:"Rate (%)", v:7}, {id:"n", l:"Months", v:24}] },

        { id: "gst-calc", cat: "2️⃣ Finance / Money", name: "Tax / GST Calc", desc: "Calculate tax component and total.", unit: "$ Tax", formula: "p*(r/100)", inputs: [{id:"p", l:"Net Amount ($)", v:1000}, {id:"r", l:"Tax Rate (%)", v:18}] },

        { id: "income-tax", cat: "2️⃣ Finance / Money", name: "Income Tax Estimate", desc: "Simplified annual tax liability.", unit: "$ Tax", formula: "(i > 100000) ? (i*0.3) : (i*0.2)", inputs: [{id:"i", l:"Annual Income ($)", v:80000}] },

        { id: "currency-conv", cat: "2️⃣ Finance / Money", name: "Currency Converter", desc: "Quick Forex exchange (Manual rate).", unit: " Units", formula: "a*r", inputs: [{id:"a", l:"Amount ($)", v:100}, {id:"r", l:"Exchange Rate", v:0.92}] },

        { id: "crypto-prof", cat: "2️⃣ Finance / Money", name: "Crypto Profit Calc", desc: "Investment gains/loss on tokens.", unit: "$ Profit", formula: "(amt/buy)*sell - amt", inputs: [{id:"amt", l:"Invested ($)", v:1000}, {id:"buy", l:"Buy Price ($)", v:45000}, {id:"sell", l:"Sell Price ($)", v:65000}] },

    
       // 3. HEALTH / FITNESS / NUTRITION
        { id: "bmi-calc", cat: "3️⃣ Health / Fitness", name: "BMI Calculator", desc: "Body Mass Index (Weight/Height ratio).", unit: " BMI", formula: "w/((h/100)**2)", inputs: [{id:"w", l:"Weight (kg)", v:70}, {id:"h", l:"Height (cm)", v:175}] },
        
        { id: "bmr-calc", cat: "3️⃣ Health / Fitness", name: "BMR Calculator", desc: "Basal Metabolic Rate (Mifflin-St Jeor).", unit: " kcal", formula: "(10*w) + (6.25*h) - (5*a) + 5", inputs: [{id:"w", l:"Weight (kg)", v:70}, {id:"h", l:"Height (cm)", v:175}, {id:"a", l:"Age", v:25}] },
        
        { id: "calorie-calc", cat: "3️⃣ Health / Fitness", name: "Daily Calorie Calc", desc: "Maintenance calories (BMR × Activity).", unit: " kcal", formula: "((10*w) + (6.25*h) - (5*a) + 5) * 1.2", inputs: [{id:"w", l:"Weight (kg)", v:70}, {id:"h", l:"Height (cm)", v:175}, {id:"a", l:"Age", v:25}] },
        
        { id: "ideal-weight", cat: "3️⃣ Health / Fitness", name: "Ideal Weight Calc", desc: "Based on Devine Formula (Male standard).", unit: " kg", formula: "50 + (0.9 * (h - 152))", inputs: [{id:"h", l:"Height (cm)", v:175}] },
        
        { id: "pregnancy-due", cat: "3️⃣ Health / Fitness", name: "Pregnancy Due Date", desc: "Estimated date (Days from last period).", unit: " Days Left", formula: "280 - d", inputs: [{id:"d", l:"Days since last period", v:30}] },
        
        { id: "body-fat", cat: "3️⃣ Health / Fitness", name: "Body Fat Estimator", desc: "Navy Method approximation.", unit: "%", formula: "495 / (1.0324 - 0.19077 * Math.log10(w-n) + 0.15456 * Math.log10(h)) - 450", inputs: [{id:"w", l:"Waist (cm)", v:80}, {id:"n", l:"Neck (cm)", v:37}, {id:"h", l:"Height (cm)", v:175}] },
        
        { id: "water-intake", cat: "3️⃣ Health / Fitness", name: "Water Intake Calc", desc: "Recommended daily hydration.", unit: " Liters", formula: "(w * 0.033)", inputs: [{id:"w", l:"Weight (kg)", v:70}] },
        
         { id: "heart-rate", cat: "3️⃣ Health / Fitness", name: "Target Heart Rate", desc: "Karvonen Formula (70% Intensity).", unit: " bpm", formula: "((220 - a - r) * 0.7) + r", inputs: [{id:"a", l:"Age", v:25}, {id:"r", l:"Resting Heart Rate", v:70}] },


        // 4. MATH / EDUCATION / SCIENCE
        { id: "percent-calc", cat: "4️⃣ Math / Education", name: "Percentage Calc", desc: "Calculate marks, grades, or ratios.", unit: "%", formula: "(score/total)*100", inputs: [{id:"score", l:"Obtained Marks", v:450}, {id:"total", l:"Total Marks", v:600}] },

        { id: "age-calc", cat: "4️⃣ Math / Education", name: "Age Calculator", desc: "Exact age based on birth year.", unit: " Years", formula: "2026 - y", inputs: [{id:"y", l:"Birth Year", v:1998}] },

        { id: "date-diff", cat: "4️⃣ Math / Education", name: "Date Difference", desc: "Days between two dates (approx).", unit: " Days", formula: "Math.abs(d2 - d1)", inputs: [{id:"d1", l:"Start Day (1-365)", v:1}, {id:"d2", l:"End Day (1-365)", v:100}] },

        { id: "sci-calc", cat: "4️⃣ Math / Education", name: "Scientific Tester", desc: "Trig, Log, and Square Root values.", unit: " Result", formula: "Math.sqrt(v) + Math.sin(v) - Math.sin(v)", inputs: [{id:"v", l:"Input Value (x)", v:25}] },

        { id: "math-compound", cat: "4️⃣ Math / Education", name: "Compound Interest (Math)", desc: "Pure mathematical growth formula.", unit: " Total", formula: "p * Math.pow((1 + (r/100)), t)", inputs: [{id:"p", l:"Principal (P)", v:1000}, {id:"r", l:"Rate (r%)", v:5}, {id:"t", l:"Time (t)", v:3}] },

        { id: "unit-conv", cat: "4️⃣ Math / Education", name: "Unit Converter (Length)", desc: "Convert Meters to Feet.", unit: " Feet", formula: "m * 3.28084", inputs: [{id:"m", l:"Value in Meters", v:10}] },

        { id: "temp-conv", cat: "4️⃣ Math / Education", name: "Temperature Calc", desc: "Celsius to Fahrenheit conversion.", unit: " °F", formula: "(c * 9/5) + 32", inputs: [{id:"c", l:"Temp in Celsius", v:37}] },
        
    // 5. BUSINESS / MARKETING / UTILITY
        { id: "price-comp", cat: "5️⃣ Business / Marketing", name: "Price Comparison", desc: "Compare unit price of two products.", unit: "$ Savings", formula: "(p2/q2 > p1/q1) ? (p2/q2 - p1/q1) : (p1/q1 - p2/q2)", inputs: [{id:"p1", l:"Price Product A ($)", v:10}, {id:"q1", l:"Quantity A (units/kg)", v:1}, {id:"p2", l:"Price Product B ($)", v:18}, {id:"q2", l:"Quantity B (units/kg)", v:2}] },

        { id: "hidden-cost", cat: "5️⃣ Business / Marketing", name: "Hidden Cost Calc", desc: "Total price including tax and shipping.", unit: "$ Total", formula: "p + (p*(t/100)) + s", inputs: [{id:"p", l:"Item Price ($)", v:100}, {id:"t", l:"Tax Rate (%)", v:8}, {id:"s", l:"Shipping/Fees ($)", v:15}] },

        { id: "fuel-cost", cat: "5️⃣ Business / Marketing", name: "Fuel & Travel Cost", desc: "Estimate road trip fuel expenses.", unit: "$ Cost", formula: "(d/m)*p", inputs: [{id:"d", l:"Distance (Miles)", v:300}, {id:"m", l:"Fuel Efficiency (MPG)", v:25}, {id:"p", l:"Fuel Price ($/Gal)", v:4}] },

        { id: "web-roi", cat: "5️⃣ Business / Marketing", name: "Website ROI", desc: "Ad revenue vs Traffic acquisition cost.", unit: "$ Profit", formula: "(v*(cpm/1000)) - cost", inputs: [{id:"v", l:"Monthly Visits", v:50000}, {id:"cpm", l:"Ad CPM ($)", v:12}, {id:"cost", l:"Content/Ad Cost ($)", v:300}] },

        { id: "break-even", cat: "5️⃣ Business / Marketing", name: "Break-even Calc", desc: "Units needed to cover all costs.", unit: " Units", formula: "f / (s - v)", inputs: [{id:"f", l:"Fixed Costs ($)", v:2000}, {id:"s", l:"Selling Price ($)", v:50}, {id:"v", l:"Variable Cost ($)", v:20}] },

        { id: "startup-val", cat: "5️⃣ Business / Marketing", name: "Startup Valuation", desc: "Estimated value (Revenue Multiplier).", unit: "$ Value", formula: "r * m", inputs: [{id:"r", l:"Annual Revenue ($)", v:100000}, {id:"m", l:"Industry Multiplier (3-10x)", v:5}] },

        { id: "loan-elig", cat: "5️⃣ Business / Marketing", name: "Loan Eligibility", desc: "Estimated loan amount based on DTI.", unit: "$ Max Loan", formula: "(i*0.4 - d) * 100", inputs: [{id:"i", l:"Monthly Income ($)", v:5000}, {id:"d", l:"Existing EMIs ($)", v:500}] },

        { id: "retirement-calc", cat: "5️⃣ Business / Marketing", name: "Retirement Planner", desc: "Target savings for 4% safe withdrawal.", unit: "$ Target", formula: "(e*12) / 0.04", inputs: [{id:"e", l:"Desired Monthly Spend ($)", v:4000}] },

        { id: "discount-calc", cat: "5️⃣ Business / Marketing", name: "Discount/Sale Calc", desc: "Final price after percentage off.", unit: "$ Final", formula: "p - (p*(d/100))", inputs: [{id:"p", l:"Original Price ($)", v:80}, {id:"d", l:"Discount (%)", v:25}] },

        
    ];

    const view = document.getElementById('view');

    function router() {
        const id = new URLSearchParams(window.location.search).get('id');
        id ? renderTool(TOOLS.find(t => t.id === id)) : renderHome();
    }

    function renderHome() {
        const groups = TOOLS.reduce((acc, t) => {
            acc[t.cat] = acc[t.cat] || [];
            acc[t.cat].push(t);
            return acc;
        }, {});

        let html = `<h1 style="text-align:center; padding: 40px 0;">All-in-One Digital Toolbox</h1>`;
        Object.entries(groups).forEach(([cat, tools]) => {
            html += `<section class="cat-section"><div class="cat-header"><h2>${cat}</h2></div><div class="grid">`;
            html += tools.map(t => `<a href="?id=${t.id}" class="card"><h3>${t.name}</h3><p>${t.desc}</p></a>`).join('');
            html += `</div></section>`;
        });
        view.innerHTML = html;
    }

    function renderTool(tool) {
        if (!tool) return renderHome();
        view.innerHTML = `
            <div class="calc-main">
                <a href="index.html" style="text-decoration:none; color:var(--brand); font-weight:800; font-size:0.8rem;">← HOME</a>
                <h1 style="margin:10px 0;">${tool.name}</h1>
                ${tool.inputs.map(i => `<div class="input-group"><label>${i.l}</label><input type="number" id="${i.id}" value="${i.v}" oninput="calc()"></div>`).join('')}
                <div class="result-box"><p>Total Result</p><h2 id="res">--</h2></div>
                <div style="background:#f1f5f9; padding:20px; border-radius:15px; font-size:0.9rem;">
                    <strong>About ${tool.name}:</strong> This professional tool helps you calculate financial metrics in USD based on standard global formulas.
                </div>
            </div>`;
        window.activeTool = tool;
        calc();
    }

    function calc() {
        const t = window.activeTool;
        let expr = t.formula;
        t.inputs.forEach(i => {
            const val = document.getElementById(i.id).value || 0;
            expr = expr.replace(new RegExp(`\\b${i.id}\\b`, 'g'), val);
        });
        const result = eval(expr);
        document.getElementById('res').innerText = (t.unit === '$' ? '$' : '') + result.toLocaleString(undefined, {maximumFractionDigits: 2}) + (t.unit !== '$' ? t.unit : '');
    }

    function doSearch() {
        const q = document.getElementById('toolSearch').value.toLowerCase();
        document.querySelectorAll('.card').forEach(c => c.style.display = c.innerText.toLowerCase().includes(q) ? 'flex' : 'none');
    }

    router();
</script>
</body>
</html>
