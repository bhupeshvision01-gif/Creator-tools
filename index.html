<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreatorProfitLab | 52+ Tools & Creator Strategy</title>
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --brand: #4f46e5; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0; --accent: #f1f5f9; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        
        /* Navigation */
        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 0; position: sticky; top: 0; z-index: 1000; }
        .nav-content { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; }
        .logo { font-weight: 800; font-size: 1.4rem; color: var(--brand); text-decoration: none; cursor: pointer; }
        #toolSearch { flex-grow: 1; max-width: 400px; padding: 12px 20px; border-radius: 50px; border: 1px solid var(--border); outline: none; background: var(--accent); font-weight: 600; }
        .tabs-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .tab-btn { padding: 10px 22px; background: var(--accent); border: none; border-radius: 50px; cursor: pointer; white-space: nowrap; font-weight: 700; color: var(--text-muted); transition: 0.2s; }
        .tab-btn.active { background: var(--brand); color: white; }

        /* Grids & Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: var(--surface); padding: 24px; border-radius: 20px; border: 1px solid var(--border); cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; height: 100%; }
        .card:hover { transform: translateY(-5px); border-color: var(--brand); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .badge { align-self: flex-start; font-size: 0.65rem; font-weight: 800; padding: 4px 10px; background: #eef2ff; color: var(--brand); border-radius: 6px; text-transform: uppercase; margin-bottom: 10px; }
        
        /* Content Pages & Calculators */
        .content-page { background: var(--surface); padding: 40px; border-radius: 30px; border: 1px solid var(--border); margin: 40px auto; max-width: 850px; }
        .calc-main { background: var(--surface); padding: 40px; border-radius: 30px; border: 1px solid var(--border); margin: 40px auto; max-width: 650px; }
        .formula-box { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; padding: 15px; border-radius: 12px; font-size: 0.85rem; margin-bottom: 25px; font-weight: 600; }
        input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 1.1rem; font-weight: 700; background: var(--accent); margin-bottom: 15px; outline: none; }
        .result-box { background: var(--brand); color: white; padding: 30px; border-radius: 20px; text-align: center; margin-top: 25px; }
        
        /* Ad Containers */
        .adsense-wrapper { margin: 30px 0; text-align: center; min-height: 100px; display: flex; justify-content: center; overflow: hidden; }
        .footer-ad-divider { border-top: 1px solid var(--border); padding-top: 40px; margin-top: 50px; }

        footer { text-align: center; padding: 60px 0; color: var(--text-muted); font-size: 0.9rem; border-top: 1px solid var(--border); }
        .footer-links { margin-top: 15px; display: flex; justify-content: center; gap: 20px; }
        .footer-links span { cursor: pointer; font-weight: 600; }
    </style>
</head>
<body onload="init()">

<header>
    <div class="container">
        <div class="nav-content">
            <div class="logo" onclick="setCat('YouTube')">🚀 CreatorProfitLab</div>
            <input type="text" id="toolSearch" placeholder="Search 52+ tools & blogs..." onkeyup="doSearch()">
        </div>
        <div class="tabs-container" id="tabs"></div>
    </div>
</header>

<main id="view" class="container"></main>

<div class="container footer-ad-divider">
    <div class="adsense-wrapper">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="FOOTER_SLOT" data-ad-format="auto" data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
</div>

<footer>
    <div class="container">
        &copy; 2026 CreatorProfitLab
        <div class="footer-links">
            <span onclick="renderPage('about')">About</span>
            <span onclick="renderPage('privacy')">Privacy</span>
            <span onclick="renderPage('terms')">Terms</span>
        </div>
    </div>
</footer>

<script>
    const BLOGS = [
        { id: 'b1', title: 'The 2026 Creator Economy Outlook', excerpt: 'How decentralized platforms and AI are shifting influencer revenue streams...', content: 'Full analysis of the $500B creator market including platform shifts toward direct-to-consumer models.' },
        { id: 'b2', title: 'Mastering YouTube RPM', title: 'Mastering YouTube RPM', excerpt: 'Hidden factors that determine your niche earnings...', content: 'Detailed breakdown of high-CPM niches like FinTech and SaaS vs lifestyle vlogging.' },
        { id: 'b3', title: 'Sponsorship Negotiation 101', excerpt: 'Stop leaving money on the table with these 5 templates...', content: 'Negotiation strategies for creators with mid-sized audiences.' },
        { id: 'b4', title: 'The Rise of "Luxury Lifestyle" Shorts', excerpt: 'Why cinematic high-contrast content is dominating vertical video...', content: 'Case study on channels like Luxentis and their engagement metrics.' },
        { id: 'b5', title: 'Privacy Laws & Your App', excerpt: 'Understanding India’s DPDP Act for developers...', content: 'Compliance checklist for independent software developers.' },
        { id: 'b6', title: 'No-Code for Entrepreneurs', excerpt: 'Build your first SaaS for under $100...', content: 'Exploring Glide, Bubble, and PWA frameworks for rapid deployment.' },
        { id: 'b7', title: 'TikTok Shop Strategy', excerpt: 'How to integrate commerce without killing engagement...', content: 'Balancing organic content with TikTok Shop product features.' },
        { id: 'b8', title: 'Scaling to 7-Figures', excerpt: 'The hiring roadmap for solo creators...', content: 'When to hire an editor, manager, or virtual assistant.' },
        { id: 'b9', title: 'Algorithm Proofing Your Brand', excerpt: 'Why your email list is more valuable than followers...', content: 'Strategies for platform independence and data ownership.' },
        { id: 'b10', title: 'Financial Literacy for Freelancers', excerpt: 'Handling taxes, burn rate, and runway...', content: 'A guide to professional financial management for creators.' }
    ];

    const TOOLS = [
        { id: 'yt-adsense', cat: 'YouTube', name: 'AdSense Earnings Calc', formula: 'Views/1000 * RPM', inputs: [{l:'Views', id:'v1', v:100000}, {l:'RPM ($)', id:'v2', v:4.5}] },
        { id: 'ig-er', cat: 'Instagram', name: 'Engagement Rate', formula: '((Likes+Comments)/Followers)*100', inputs: [{l:'Followers', id:'v1', v:5000}, {l:'Likes', id:'v2', v:200}, {l:'Comments', id:'v3', v:15}] },
        { id: 'tk-fund', cat: 'TikTok', name: 'Creator Fund Calc', formula: 'Views/1000 * 0.03', inputs: [{l:'Total Views', id:'v1', v:100000}] },
        { id: 'free-hourly', cat: 'Business', name: 'Hourly Rate Calc', formula: '(Expenses + Salary)/160', inputs: [{l:'Desired Monthly', id:'v1', v:5000}, {l:'Biz Expenses', id:'v2', v:1000}] },
        // ... (Include other 48 tools here following same pattern)
    ];

    let currentCat = 'YouTube';

    function init() {
        renderTabs();
        navigate('');
    }

    function renderTabs() {
        const cats = ['YouTube', 'Instagram', 'TikTok', 'Business', 'Blogs'];
        document.getElementById('tabs').innerHTML = cats.map(c => 
            `<button class="tab-btn ${c === currentCat ? 'active' : ''}" onclick="setCat('${c}')">${c}</button>`
        ).join('');
    }

    function setCat(c) {
        currentCat = c;
        renderTabs();
        c === 'Blogs' ? renderBlogGrid() : navigate('');
    }

    function renderBlogGrid() {
        const view = document.getElementById('view');
        let html = '<div class="grid">';
        BLOGS.forEach((b, i) => {
            if (i > 0 && i % 4 === 0) {
                html += `<div class="adsense-wrapper" style="grid-column: 1/-1;"><ins class="adsbygoogle" style="display:block" data-ad-format="fluid" data-ad-layout-key="-fb+5w+4e-db+86" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="GRID_SLOT"></ins><script>(adsbygoogle = window.adsbygoogle || []).push({});<\/script></div>`;
            }
            html += `<div class="card" onclick="renderBlogPost('${b.id}')"><span class="badge">Article</span><h3>${b.title}</h3><p style="color:var(--text-muted); font-size:0.9rem; margin-top:10px;">${b.excerpt}</p></div>`;
        });
        view.innerHTML = html + '</div>';
    }

    function renderBlogPost(id) {
        const post = BLOGS.find(b => b.id === id);
        document.getElementById('view').innerHTML = `<div class="content-page"><h1>${post.title}</h1><p>${post.content}</p><button class="tab-btn" style="margin-top:20px" onclick="setCat('Blogs')">Back to Blogs</button></div>`;
        window.scrollTo(0,0);
    }

    function navigate(q) {
        const params = new URLSearchParams(q);
        const id = params.get('id');
        if (id) { renderTool(TOOLS.find(t => t.id === id)); } 
        else { renderGrid(TOOLS.filter(t => t.cat === currentCat)); }
    }

    function renderGrid(list) {
        let html = '<div class="grid">';
        list.forEach((t, i) => {
            if (i > 0 && i % 6 === 0) {
                html += `<div class="adsense-wrapper" style="grid-column: 1/-1;"><ins class="adsbygoogle" style="display:block" data-ad-format="fluid" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="GRID_SLOT"></ins><script>(adsbygoogle = window.adsbygoogle || []).push({});<\/script></div>`;
            }
            html += `<div class="card" onclick="navigate('id=${t.id}')"><span class="badge">${t.cat}</span><h3>${t.name}</h3><div style="color:var(--brand); font-weight:700; margin-top:auto; font-size:0.8rem; padding-top:15px;">CALCULATE →</div></div>`;
        });
        document.getElementById('view').innerHTML = html + '</div>';
    }

    function renderTool(t) {
        document.getElementById('view').innerHTML = `
            <div class="calc-main">
                <div style="cursor:pointer; color:var(--brand); font-weight:700;" onclick="navigate('')">← Back</div>
                <h1 style="margin: 15px 0;">${t.name}</h1>
                <div class="formula-box">Formula: ${t.formula}</div>
                ${t.inputs.map(i => `<label style="font-size:0.7rem; font-weight:800; color:var(--text-muted);">${i.l}</label><input type="number" id="${i.id}" value="${i.v}" oninput="calc()">`).join('')}
                <div class="result-box"><small>RESULT</small><h2 id="res">--</h2></div>
                <div class="adsense-wrapper">
                    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="CALC_SLOT" data-ad-format="auto"></ins>
                    <script>(adsbygoogle = window.adsbygoogle || []).push({});<\/script>
                </div>
            </div>`;
        window.activeTool = t;
        calc();
    }

    function renderPage(page) {
        const content = {
            about: "<h1>About CreatorProfitLab</h1><p>We build tools for the 2026 digital economy. Our mission is to provide entrepreneurs with verified financial frameworks.</p>",
            privacy: "<h1>Privacy Policy</h1><p>Your data is processed locally. We comply with global data protection standards including the DPDP Act.</p>",
            terms: "<h1>Terms of Service</h1><p>Tools are for projection purposes only. Always consult with a financial professional.</p>"
        };
        document.getElementById('view').innerHTML = `<div class="content-page">${content[page]}</div>`;
        window.scrollTo(0,0);
    }

    function calc() {
        const t = window.activeTool;
        let f = t.formula;
        t.inputs.forEach(i => {
            const val = document.getElementById(i.id).value || 0;
            // Simplified replacement logic for demo
            if(i.id === 'v1') f = f.replace(/Views|Followers|Expenses|Total Views/g, val);
            if(i.id === 'v2') f = f.replace(/RPM|Likes|Salary/g, val);
            if(i.id === 'v3') f = f.replace(/Comments/g, val);
        });
        try { document.getElementById('res').innerText = eval(f).toLocaleString(); } catch(e) {}
    }

    function doSearch() {
        const q = document.getElementById('toolSearch').value.toLowerCase();
        if(!q) return navigate('');
        const results = TOOLS.filter(t => t.name.toLowerCase().includes(q));
        renderGrid(results);
    }
</script>
</body>
</html>
