<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreatorProfitLab | 50+ Professional Business & Creator Tools</title>
    <meta name="description" content="Free professional calculators for YouTube, Finance, Health, and Business. Optimized for creators and entrepreneurs.">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand: #4f46e5; --bg: #f8fafc; --surface: #ffffff; 
            --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        /* Navigation */
        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
        .nav-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.4rem; color: var(--brand); text-decoration: none; display: flex; align-items: center; gap: 8px; }
        #toolSearch { width: 320px; padding: 12px 20px; border-radius: 50px; border: 1px solid var(--border); outline: none; transition: 0.3s; }
        #toolSearch:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }

        /* Hero */
        .hero { text-align: center; padding: 80px 0; background: radial-gradient(circle at top right, #eef2ff, #f8fafc); }
        .hero h1 { font-size: 3rem; font-weight: 800; margin-bottom: 15px; letter-spacing: -1.5px; }
        .hero p { color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto; }

        /* Category Sections */
        .cat-section { margin-bottom: 60px; }
        .cat-header { display: flex; align-items: center; gap: 12px; margin-bottom: 25px; border-bottom: 2px solid var(--border); padding-bottom: 12px; }
        .cat-header h2 { font-size: 1.6rem; font-weight: 800; color: var(--text); }
        .cat-badge { background: var(--brand); color: white; padding: 3px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }

        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--surface); padding: 25px; border-radius: 18px; border: 1px solid var(--border); text-decoration: none; color: inherit; transition: 0.3s; display: flex; flex-direction: column; height: 100%; }
        .card:hover { transform: translateY(-5px); border-color: var(--brand); box-shadow: 0 15px 30px rgba(0,0,0,0.04); }
        .card h3 { font-size: 1.1rem; margin-bottom: 10px; font-weight: 700; color: #1e293b; }
        .card p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; flex-grow: 1; }

        /* Tool View */
        .calc-wrapper { display: grid; grid-template-columns: 2fr 1fr; gap: 40px; margin-top: 40px; }
        .calc-main { background: var(--surface); padding: 40px; border-radius: 24px; border: 1px solid var(--border); }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.75rem; font-weight: 800; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; }
        input, select { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 1.1rem; font-weight: 700; background: #fcfdfe; transition: 0.2s; }
        input:focus { border-color: var(--brand); outline: none; background: white; }
        
        .result-box { background: var(--brand); color: white; padding: 35px; border-radius: 20px; text-align: center; margin: 30px 0; }
        .result-box h2 { font-size: 3.2rem; font-weight: 800; margin: 5px 0; }
        .result-box span { font-size: 0.9rem; font-weight: 600; opacity: 0.8; }

        .ad-slot { background: #f1f5f9; border: 1px dashed #cbd5e1; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 0.7rem; border-radius: 12px; margin: 20px 0; }
        
        footer { background: white; padding: 60px 0; border-top: 1px solid var(--border); text-align: center; margin-top: 80px; color: var(--text-muted); }
        
        @media (max-width: 900px) { .calc-wrapper { grid-template-columns: 1fr; } .hero h1 { font-size: 2.2rem; } .nav-content { flex-direction: column; gap: 15px; } #toolSearch { width: 100%; } }
    </style>
</head>
<body>

<header>
    <div class="container nav-content">
        <a href="index.html" class="logo">🚀 CreatorProfitLab</a>
        <input type="text" id="toolSearch" placeholder="Search 50+ calculators..." onkeyup="doSearch()">
    </div>
</header>

<div id="view"></div>

<footer>
    <div class="container">
        <p>&copy; 2026 CreatorProfitLab. The Global Standard for Online Calculations.</p>
        <div style="margin-top: 15px; display: flex; justify-content: center; gap: 20px;">
            <a href="#" style="color:inherit; text-decoration:none; font-size:0.85rem;">Privacy Policy</a>
            <a href="#" style="color:inherit; text-decoration:none; font-size:0.85rem;">About Us</a>
            <a href="#" style="color:inherit; text-decoration:none; font-size:0.85rem;">Contact</a>
        </div>
    </div>
</footer>

<script>
    const TOOLS = [
        // 1. CREATOR ECONOMY
        { id: "yt-income", cat: "1️⃣ Creator Economy", name: "YouTube Income Calculator", desc: "Views × CPM × Ads → Revenue estimate.", unit: "$", formula: "(v/1000)*c*a", inputs: [{id:"v", l:"Monthly Views", v:100000}, {id:"c", l:"Estimated CPM", v:5}, {id:"a", l:"Ads per Video", v:1.5}] },
        { id: "ig-eng", cat: "1️⃣ Creator Economy", name: "Instagram Engagement", desc: "Likes, comments, reach → Engagement rate.", unit: "%", formula: "((l+c)/r)*100", inputs: [{id:"l", l:"Likes", v:1200}, {id:"c", l:"Comments", v:80}, {id:"r", l:"Total Reach", v:20000}] },
        { id: "tk-earn", cat: "1️⃣ Creator Economy", name: "TikTok Earnings", desc: "Views × Creator Fund → Revenue estimate.", unit: "$", formula: "(v/1000000)*35", inputs: [{id:"v", l:"Total Views", v:1000000}] },
        { id: "cpm-calc", cat: "1️⃣ Creator Economy", name: "CPM Calculator", desc: "Cost per 1000 views for ads.", unit: "$", formula: "(cost/imp)*1000", inputs: [{id:"cost", l:"Ad Spend", v:500}, {id:"imp", l:"Impressions", v:100000}] },
        { id: "aff-income", cat: "1️⃣ Creator Economy", name: "Affiliate Income", desc: "Clicks × Conv × Commission → Earnings.", unit: "$", formula: "cl*(cr/100)*com", inputs: [{id:"cl", l:"Link Clicks", v:5000}, {id:"cr", l:"Conv Rate (%)", v:2.5}, {id:"com", l:"Avg Commission", v:20}] },
        { id: "brand-deal", cat: "1️⃣ Creator Economy", name: "Brand Deal Calculator", desc: "Followers × Rate → Post Price.", unit: "$", formula: "f*0.015", inputs: [{id:"f", l:"Total Followers", v:50000}] },
        { id: "creator-roi", cat: "1️⃣ Creator Economy", name: "Creator ROI", desc: "Revenue vs Effort/Cost investment.", unit: "x", formula: "rev/exp", inputs: [{id:"rev", l:"Total Revenue", v:5000}, {id:"exp", l:"Total Expenses", v:1500}] },
        { id: "sub-growth", cat: "1️⃣ Creator Economy", name: "Subscriber Growth", desc: "Track profile growth over time.", unit: " Subs", formula: "cur + (daily*days)", inputs: [{id:"cur", l:"Current Subs", v:10000}, {id:"daily", l:"Daily Gain", v:50}, {id:"days", l:"Days", v:30}] },
        { id: "vid-profit", cat: "1️⃣ Creator Economy", name: "Video Profit Calculator", desc: "Costs vs Monetization → Net Profit.", unit: "$", formula: "rev - cost", inputs: [{id:"rev", l:"Video Revenue", v:1200}, {id:"cost", l:"Production Cost", v:400}] },
        { id: "inf-rate", cat: "1️⃣ Creator Economy", name: "Influencer Rate", desc: "Followers & Engagement → Ideal Price.", unit: "$", formula: "(f/1000)*12 + (e*50)", inputs: [{id:"f", l:"Followers", v:25000}, {id:"e", l:"Engagement %", v:4}] },

        // 2. FINANCE
        { id: "emi-calc", cat: "2️⃣ Finance / Money", name: "EMI Calculator", desc: "Loan/Credit Card Monthly Payments.", unit: "₹", formula: "(p*(r/1200)*((1+r/1200)**n))/(((1+r/1200)**n)-1)", inputs: [{id:"p", l:"Loan Amount", v:1000000}, {id:"r", l:"Rate (%)", v:8.5}, {id:"n", l:"Tenure (Months)", v:120}] },
        { id: "sip-calc", cat: "2️⃣ Finance / Money", name: "SIP Calculator", desc: "Mutual Funds Wealth Gain.", unit: "₹", formula: "p*((((1+r/1200)**n)-1)/(r/1200))*(1+r/1200)", inputs: [{id:"p", l:"Monthly SIP", v:5000}, {id:"r", l:"Return %", v:12}, {id:"n", l:"Months", v:120}] },
        { id: "gst-calc", cat: "2️⃣ Finance / Money", name: "GST Calculator", desc: "Indian Goods & Service Tax.", unit: "₹", formula: "p*(r/100)", inputs: [{id:"p", l:"Net Price", v:10000}, {id:"r", l:"GST Rate %", v:18}] },
        { id: "crypto-prof", cat: "2️⃣ Finance / Money", name: "Crypto Profit", desc: "Bitcoin/ETH Investment Gains.", unit: "$", formula: "(amt/buy)*sell - amt", inputs: [{id:"amt", l:"Invested", v:1000}, {id:"buy", l:"Buy Price", v:40000}, {id:"sell", l:"Sell Price", v:60000}] },
        // ... Adding logic for other 40+ placeholders to match your sequence
        { id: "bmi-calc", cat: "3️⃣ Health / Fitness", name: "BMI Calculator", desc: "Body Mass Index.", unit: "BMI ", formula: "w/((h/100)**2)", inputs: [{id:"w", l:"Weight (kg)", v:70}, {id:"h", l:"Height (cm)", v:175}] },
        { id: "age-calc", cat: "4️⃣ Math / Education", name: "Age Calculator", desc: "Current age in years.", unit: " Yrs", formula: "2026 - y", inputs: [{id:"y", l:"Birth Year", v:1995}] },
        { id: "disc-calc", cat: "5️⃣ Business / Utility", name: "Discount Calculator", desc: "Final price after sale.", unit: "$", formula: "p - (p*(d/100))", inputs: [{id:"p", l:"Original Price", v:100}, {id:"d", l:"Discount %", v:20}] },
        { id: "trip-calc", cat: "6️⃣ Lifestyle / Travel", name: "Trip Cost Calculator", desc: "Fuel + Hotel + Tolls.", unit: "₹", formula: "(dist/mil)*price + hotel + tolls", inputs: [{id:"dist", l:"KM", v:500}, {id:"mil", l:"Mileage", v:15}, {id:"price", l:"Fuel Price", v:100}, {id:"hotel", l:"Hotels", v:2000}, {id:"tolls", l:"Tolls", v:500}] }
    ];

    const view = document.getElementById('view');

    function router() {
        const id = new URLSearchParams(window.location.search).get('id');
        if (id) {
            renderTool(TOOLS.find(t => t.id === id));
        } else {
            renderHome();
        }
    }

    function renderHome() {
        const groups = TOOLS.reduce((acc, t) => {
            acc[t.cat] = acc[t.cat] || [];
            acc[t.cat].push(t);
            return acc;
        }, {});

        let html = `
            <section class="hero">
                <div class="container">
                    <h1>Smarter Decisions, Instantly.</h1>
                    <p>All-in-one professional tools for the modern entrepreneur, creator, and professional.</p>
                </div>
            </section>
            <div class="container">`;

        Object.entries(groups).forEach(([cat, tools]) => {
            html += `
                <div class="cat-section">
                    <div class="cat-header">
                        <h2>${cat}</h2>
                        <span class="cat-badge">${tools.length} Tools</span>
                    </div>
                    <div class="grid">
                        ${tools.map(t => `
                            <a href="?id=${t.id}" class="card">
                                <h3>${t.name}</h3>
                                <p>${t.desc}</p>
                            </a>
                        `).join('')}
                    </div>
                </div>
            `;
        });
        view.innerHTML = html + `</div>`;
    }

    function renderTool(tool) {
        if (!tool) return renderHome();
        document.title = `${tool.name} | CreatorProfitLab`;
        
        view.innerHTML = `
            <div class="container">
                <div class="calc-wrapper">
                    <div class="calc-main">
                        <a href="index.html" style="text-decoration:none; color:var(--brand); font-weight:700; font-size:0.8rem;">← ALL TOOLS</a>
                        <h1 style="margin: 15px 0 10px 0;">${tool.name}</h1>
                        <p style="color:var(--text-muted); margin-bottom:30px;">${tool.desc}</p>
                        
                        <div class="ad-slot" style="height:90px;">TOP AD BANNER</div>

                        <div class="inputs">
                            ${tool.inputs.map(i => `
                                <div class="input-group">
                                    <label>${i.l}</label>
                                    <input type="number" id="${i.id}" value="${i.v}" oninput="calc()">
                                </div>
                            `).join('')}
                            
                            <div class="result-box">
                                <span>TOTAL ${tool.name.toUpperCase()}</span>
                                <h2 id="res">--</h2>
                            </div>
                        </div>

                        <div class="ad-slot" style="height:250px;">IN-CONTENT AD</div>
                        <div style="margin-top:40px;">
                            <h2>How it Works</h2>
                            <p>This ${tool.name} uses industry-standard formulas to give you the most accurate estimates for your business or personal needs.</p>
                        </div>
                    </div>
                    
                    <div class="sidebar">
                        <div style="background:#4f46e5; color:white; padding:30px; border-radius:20px;">
                            <h3>Creator Growth Pro</h3>
                            <p style="font-size:0.85rem; margin-top:10px;">Get the same tools used by top 1% creators.</p>
                            <button style="width:100%; padding:12px; margin-top:20px; border-radius:10px; border:none; background:white; color:#4f46e5; font-weight:800; cursor:pointer;">Learn More</button>
                        </div>
                        <div class="ad-slot" style="height:600px;">SIDEBAR TALL AD</div>
                    </div>
                </div>
            </div>
        `;
        window.activeTool = tool;
        calc();
    }

    function calc() {
        const t = window.activeTool;
        let expr = t.formula;
        t.inputs.forEach(i => {
            const val = document.getElementById(i.id).value || 0;
            expr = expr.replace(new RegExp(`\\b${i.id}\\b`, 'g'), val);
        });
        try {
            const result = eval(expr);
            document.getElementById('res').innerText = (t.unit === '₹' ? '₹' : '') + 
                result.toLocaleString(undefined, {maximumFractionDigits: 2}) + 
                (t.unit !== '₹' ? t.unit : '');
        } catch(e) { console.error("Error"); }
    }

    function doSearch() {
        const q = document.getElementById('toolSearch').value.toLowerCase();
        document.querySelectorAll('.card').forEach(c => {
            c.style.display = c.innerText.toLowerCase().includes(q) ? 'flex' : 'none';
        });
        document.querySelectorAll('.cat-section').forEach(s => {
            const visible = Array.from(s.querySelectorAll('.card')).some(c => c.style.display !== 'none');
            s.style.display = visible ? 'block' : 'none';
        });
    }

    router();
</script>
</body>
</html>
