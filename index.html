<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreatorProfitLab | All-in-One Professional Calculators</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand: #4f46e5; --bg: #f8fafc; --surface: #ffffff; 
            --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        /* Navigation */
        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
        .nav-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.4rem; color: var(--brand); text-decoration: none; }
        #toolSearch { width: 300px; padding: 10px 20px; border-radius: 50px; border: 1px solid var(--border); outline: none; }

        /* Hero */
        .hero { text-align: center; padding: 60px 0; background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%); }
        .hero h1 { font-size: 2.8rem; font-weight: 800; margin-bottom: 10px; letter-spacing: -1px; }

        /* Category Layout */
        .category-section { margin-bottom: 60px; }
        .category-header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        .category-header h2 { font-size: 1.5rem; font-weight: 800; color: var(--text); }
        .category-header .count { background: var(--brand); color: white; padding: 2px 10px; border-radius: 20px; font-size: 0.8rem; }

        /* Grid & Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--surface); padding: 25px; border-radius: 16px; border: 1px solid var(--border); text-decoration: none; color: inherit; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--brand); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .card h3 { font-size: 1.1rem; margin-bottom: 8px; font-weight: 700; }
        .card p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }

        /* Calculator View Styles (Same as before) */
        .calc-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; margin-top: 30px; }
        .main-card { background: var(--surface); padding: 35px; border-radius: 20px; border: 1px solid var(--border); }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.75rem; font-weight: 800; margin-bottom: 5px; color: var(--text-muted); text-transform: uppercase; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 1.1rem; font-weight: 700; }
        .result-display { background: var(--brand); color: white; padding: 30px; border-radius: 16px; text-align: center; margin: 25px 0; }
        .result-display h2 { font-size: 2.8rem; font-weight: 800; margin: 0; }
        .ad-box { background: #f1f5f9; border: 1px dashed #cbd5e1; height: 90px; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 0.7rem; border-radius: 12px; margin: 20px 0; }

        @media (max-width: 900px) { .calc-layout { grid-template-columns: 1fr; } .nav-content { flex-direction: column; gap: 15px; } #toolSearch { width: 100%; } }
    </style>
</head>
<body>

<header>
    <div class="container nav-content">
        <a href="index.html" class="logo">🚀 CreatorProfitLab</a>
        <input type="text" id="toolSearch" placeholder="Search across all categories..." onkeyup="doSearch()">
    </div>
</header>

<div id="content-area"></div>

<footer>
    <div class="container" style="text-align: center; padding: 60px 0; color: var(--text-muted); border-top: 1px solid var(--border);">
        <p>&copy; 2026 CreatorProfitLab. All professional tools in one place.</p>
    </div>
</footer>

<script>
    const TOOLS = [
        // CATEGORY: CREATOR ECONOMY
        { id: "yt-income", cat: "Creator Economy", name: "YouTube Income Calc", desc: "Estimate revenue from views, CPM, and ads.", unit: "$", formula: "(v/1000)*c*a", inputs: [{id:"v", l:"Monthly Views", v:100000}, {id:"c", l:"CPM ($)", v:4}, {id:"a", l:"Ads/Video", v:1.5}], art: "<p>YouTube revenue is the primary income for digital creators.</p>" },
        { id: "tk-earnings", cat: "Creator Economy", name: "TikTok Earnings", desc: "Creator Fund + Brand Deal potential.", unit: "$", formula: "(v/1000000)*30 + (v/1000)*0.50", inputs: [{id:"v", l:"Video Views", v:500000}], art: "<p>TikTok monetization relies heavily on volume.</p>" },
        { id: "brand-deal", cat: "Creator Economy", name: "Brand Deal Estimator", desc: "Calculate rates based on followers.", unit: "$", formula: "f*0.015", inputs: [{id:"f", l:"Total Followers", v:50000}], art: "<p>Standard rates are $10-$20 per 1k followers.</p>" },
        { id: "influencer-rate", cat: "Creator Economy", name: "Influencer Rate Calc", desc: "Fair market price for sponsorships.", unit: "$", formula: "(f/1000)*15 + (e/100)*50", inputs: [{id:"f", l:"Followers", v:20000}, {id:"e", l:"Engagement (%)", v:4}], art: "<p>Weights reach and impact together.</p>" },

        // CATEGORY: MARKETING & ADS
        { id: "cpm-master", cat: "Marketing & Ads", name: "CPM Calculator", desc: "Calculate cost per 1,000 impressions.", unit: "$", formula: "(cost/imp)*1000", inputs: [{id:"cost", l:"Ad Spend", v:1000}, {id:"imp", l:"Impressions", v:200000}], art: "<p>Essential for media buying.</p>" },
        { id: "affiliate-income", cat: "Marketing & Ads", name: "Affiliate Income", desc: "Predict earnings from clicks and conversions.", unit: "$", formula: "cl*(cr/100)*com", inputs: [{id:"cl", l:"Link Clicks", v:5000}, {id:"cr", l:"Conv. Rate (%)", v:2}, {id:"com", l:"Commission ($)", v:15}], art: "<p>Track your passive income potential.</p>" },
        { id: "ig-engagement", cat: "Marketing & Ads", name: "Instagram Engagement", desc: "Likes, comments, reach ratio.", unit: "%", formula: "((l+c)/r)*100", inputs: [{id:"l", l:"Likes", v:1200}, {id:"c", l:"Comments", v:85}, {id:"r", l:"Reach", v:25000}], art: "<p>Measure how much your audience cares.</p>" },

        // CATEGORY: BUSINESS FINANCE
        { id: "creator-roi", cat: "Business Finance", name: "Creator ROI", desc: "Revenue vs Time/Money investment.", unit: "x", formula: "rev/exp", inputs: [{id:"rev", l:"Total Revenue", v:5000}, {id:"exp", l:"Total Expenses", v:1200}], art: "<p>Is your content actually profitable?</p>" },
        { id: "video-profit", cat: "Business Finance", name: "Video Net Profit", desc: "Final profit after production costs.", unit: "$", formula: "rev - cost", inputs: [{id:"rev", l:"Earnings", v:800}, {id:"cost", l:"Video Budget", v:300}], art: "<p>Know your margins before filming.</p>" },
        { id: "sub-growth", cat: "Business Finance", name: "Growth Tracker", desc: "Project future follower growth.", unit: " Subs", formula: "cur + (daily*days)", inputs: [{id:"cur", l:"Current Subs", v:10000}, {id:"daily", l:"Avg Daily Gain", v:50}, {id:"days", l:"Days", v:30}], art: "<p>Plan your milestones.</p>" }
    ];

    const app = document.getElementById('content-area');

    function router() {
        const id = new URLSearchParams(window.location.search).get('id');
        if (id) {
            renderTool(TOOLS.find(t => t.id === id));
        } else {
            renderHome();
        }
    }

    function renderHome() {
        // Step 1: Group tools by Category
        const groups = TOOLS.reduce((acc, tool) => {
            acc[tool.cat] = acc[tool.cat] || [];
            acc[tool.cat].push(tool);
            return acc;
        }, {});

        let html = `<section class="hero"><div class="container"><h1>Precision Tools for Digital Growth</h1><p>Every calculator you need to manage your creator business.</p></div></section><div class="container">`;

        // Step 2: Loop through groups to create sections
        for (const [category, tools] of Object.entries(groups)) {
            html += `
                <section class="category-section">
                    <div class="category-header">
                        <h2>${category}</h2>
                        <span class="count">${tools.length} Tools</span>
                    </div>
                    <div class="grid">
                        ${tools.map(t => `
                            <a href="?id=${t.id}" class="card">
                                <h3>${t.name}</h3>
                                <p>${t.desc}</p>
                            </a>
                        `).join('')}
                    </div>
                </section>
            `;
        }
        
        app.innerHTML = html + `</div>`;
    }

    function renderTool(tool) {
        if (!tool) { renderHome(); return; }
        document.title = `${tool.name} | CreatorProfitLab`;
        app.innerHTML = `
            <div class="container"><div class="calc-layout"><div class="main-card">
                <a href="index.html" style="font-weight:700; text-decoration:none; color:var(--brand); font-size:0.8rem;">← BACK TO ALL CATEGORIES</a>
                <h1 style="margin: 15px 0 5px 0;">${tool.name}</h1>
                <div class="ad-box">AD SLOT</div>
                <div class="calculator-engine">
                    ${tool.inputs.map(i => `<div class="input-group"><label>${i.l}</label><input type="number" id="${i.id}" value="${i.v}" oninput="runMath()"></div>`).join('')}
                    <div class="result-display"><p>Calculation Result</p><h2 id="res">--</h2></div>
                </div>
                <div class="article">${tool.art}</div>
            </div>
            <div class="sidebar"><div class="ad-box" style="height:500px">SIDEBAR AD</div></div></div></div>
        `;
        window.activeTool = tool;
        runMath();
    }

    function runMath() {
        const t = window.activeTool;
        let expression = t.formula;
        t.inputs.forEach(i => {
            const val = document.getElementById(i.id).value || 0;
            expression = expression.replace(new RegExp(`\\b${i.id}\\b`, 'g'), val);
        });
        try {
            const result = eval(expression);
            document.getElementById('res').innerText = (t.unit === '%' ? '' : t.unit) + result.toLocaleString(undefined, {maximumFractionDigits: 2}) + (t.unit === '%' ? '%' : '');
        } catch(e) { console.error("Math Error"); }
    }

    function doSearch() {
        const q = document.getElementById('toolSearch').value.toLowerCase();
        document.querySelectorAll('.card').forEach(c => {
            c.style.display = c.innerText.toLowerCase().includes(q) ? 'block' : 'none';
        });
        // Hide empty category headers
        document.querySelectorAll('.category-section').forEach(s => {
            const hasVisible = Array.from(s.querySelectorAll('.card')).some(c => c.style.display !== 'none');
            s.style.display = hasVisible ? 'block' : 'none';
        });
    }

    router();
</script>
</body>
</html>
