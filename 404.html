<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting... | CreatorProfitLab</title>
    <script type="text/javascript">
        // This script takes the current path and converts it into a query parameter
        // so that your main index.html script can read it and show the right tool.
        var pathSegmentsToKeep = 0;

        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?id=' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>
<body>
    <div style="font-family: sans-serif; text-align: center; padding-top: 50px;">
        <h1>Loading Tool...</h1>
        <p>Redirecting you to the requested calculator.</p>
    </div>
</body>
</html>
